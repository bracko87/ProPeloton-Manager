    <script src="/main.js"></script>

    <script>
      (() => {
        const primaryLinks = [
          ['How to Play', '/how-to-play/'],
          ['Game Guide', '/game-guide/'],
          ['Demo', '/demo/'],
          ['About', '/about/'],
          ['Support', '/support/'],
        ]

        const installPrimaryNavigation = () => {
          const homepage = document.getElementById('public-homepage')
          if (!homepage) return

          const header = homepage.querySelector('header')
          if (!header || header.querySelector('[data-seo-primary-nav="true"]')) return

          const headerInner = header.firstElementChild
          if (!headerInner) return

          const authNavigation = headerInner.querySelector('nav')
          if (!authNavigation) return

          const navigation = document.createElement('nav')
          navigation.className = 'seo-primary-nav'
          navigation.setAttribute('aria-label', 'Primary site navigation')
          navigation.setAttribute('data-seo-primary-nav', 'true')

          primaryLinks.forEach(([label, href]) => {
            const link = document.createElement('a')
            link.href = href
            link.textContent = label
            navigation.appendChild(link)
          })

          headerInner.insertBefore(navigation, authNavigation)
        }

        installPrimaryNavigation()

        const observer = new MutationObserver(installPrimaryNavigation)
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        })

        window.setTimeout(installPrimaryNavigation, 0)
        window.setTimeout(installPrimaryNavigation, 250)
      })()
    </script>
