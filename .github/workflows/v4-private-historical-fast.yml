name: V4 fast private historical diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'src/race-engine-v4/privateHistoricalPostCatchGapV4.mjs'
      - 'src/race-engine-v4/privateHistoricalDiagnosticsV4.mjs'
      - 'src/race-engine-v4/privateHistoricalPhysicalEntryV4.ts'
      - 'scripts/v4/privateHistoricalPostCatchForensicPatchV4.mjs'
      - 'scripts/v4/privateHistoricalPostCatchGapV4.test.mjs'
      - 'scripts/v4/privateHistoricalDiagnosticsV4.test.mjs'
      - 'scripts/v4/privateHistoricalPhysicsV4.mjs'
      - 'scripts/v4/privateHistoricalPhysicsV4.test.mjs'
      - 'scripts/v4/privateHistoricalPgV4.mjs'
      - 'scripts/v4/privateHistoricalPgV4.test.mjs'
      - '.github/workflows/v4-private-historical-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-history-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify replay gap fields and isolated source patch
        run: node scripts/v4/privateHistoricalPostCatchGapV4.test.mjs
      - name: Verify private replay error whitelists and redaction
        run: node scripts/v4/privateHistoricalDiagnosticsV4.test.mjs
      - name: Verify restricted reader via synthetic mocks (no database)
        run: node scripts/v4/privateHistoricalPgV4.test.mjs
      - name: Verify private baseline/V4 physics wrapper using synthetic locked history
        run: node scripts/v4/privateHistoricalPhysicsV4.test.mjs
