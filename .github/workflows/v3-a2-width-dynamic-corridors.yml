name: V3 A2 2-6 rider corridor road width and dynamic obstacle study
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-width-dynamic-corridors-v3.mjs'
      - '.github/workflows/v3-a2-width-dynamic-corridors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corridor-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing swept collision, finite energy and passing observer checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Run static and moving lane-obstacle width envelope matrix
        env:
          V3_A2_CORRIDOR_SIZE: ${{ matrix.riders }}
          V3_A2_CORRIDOR_DIR: ${{ runner.temp }}/a2-dynamic-corridors-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-width-dynamic-corridors-v3.mjs
      - name: Archive all test outcomes, including sporting failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-width-dynamic-corridors-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-dynamic-corridors-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent production application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
