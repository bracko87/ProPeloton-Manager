name: V3 A2 Step37 swept event-time yield research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2EventTimeYieldResearchV3.mjs'
      - 'scripts/v3/a2SubstepPhysicalResearchV3.mjs'
      - 'scripts/v3/audit-a2-step37-event-yield-v3.mjs'
      - '.github/workflows/v3-a2-step37-event-yield.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tested-families:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        family: [following, hold, merge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run matched 2s 2.5s 5s time-to-contact and collision-safe yield
        env:
          V3_A2_STEP37_FAMILY: ${{ matrix.family }}
          V3_A2_STEP37_DIR: ${{ runner.temp }}/step37
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step37-event-yield-v3.mjs
      - name: Preserve experimental and control fixture-level data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step37-${{ matrix.family }}
          path: ${{ runner.temp }}/step37/*.json
          retention-days: 30
          if-no-files-found: warn
  unchanged-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Step36 Step35 Step34 Step33 Step32 technical checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step36-causal-isolation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step35-substep-sensitivity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-substep-physical-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Production build and internationalization
        run: npm ci --no-audit --no-fund && npm run build
