name: Localization sweep audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-localization-sweep-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan visible English candidates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('src/pages/dashboard/Staff.tsx'),
              Path('src/pages/dashboard/Training.tsx'),
              Path('src/pages/dashboard/infrastructure/AssetsSection.tsx'),
              Path('src/pages/dashboard/Statistics.tsx'),
              Path('src/features/squad/components/TeamStatisticsSection.tsx'),
              Path('src/features/squad/components/RiderStatisticsSection.tsx'),
              Path('src/pages/dashboard/RaceDetailPage.tsx'),
          ]

          direct_text = re.compile(r'>\s*([A-Za-z][^<{}`]*?[A-Za-z0-9.!?…])\s*<')
          prop_text = re.compile(r'\b(?:title|description|placeholder|label|aria-label)="([A-Za-z][^"]*[A-Za-z0-9.!?…])"')

          print('=== LOCALIZATION SWEEP ===')
          for page in pages:
              source = page.read_text(encoding='utf-8')
              print(f'\nPAGE {page}')
              hits = []
              for n, line in enumerate(source.splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith('//') or stripped.startswith('*') or stripped.startswith('import '):
                      continue
                  for rx in (direct_text, prop_text):
                      for m in rx.finditer(line):
                          value = m.group(1).strip()
                          if value:
                              hits.append((n, value))
              seen=set(); unique=[]
              for hit in hits:
                  if hit not in seen:
                      seen.add(hit); unique.append(hit)
              print(f'DIRECT_VISIBLE_CANDIDATES {len(unique)}')
              for n,value in unique[:400]:
                  print(f'L{n}: {value}')

          staff = Path('src/pages/dashboard/Staff.tsx').read_text(encoding='utf-8')
          print('\n=== STAFF COURSE OPTIONS ===')
          # Print every course object in the builder, one field per line, so translation keys can mirror the source.
          for m in re.finditer(r"code:\s*'([^']+)'\s*,\s*title:\s*'([^']+)'\s*,\s*description:\s*'([^']+)'[\s\S]{0,180}?focusLabel:\s*'([^']+)'", staff):
              print('COURSE|' + '|'.join(m.groups()))

          print('\n=== STAFF EFFECT STRINGS ===')
          for needle in ['scouting accuracy','prospect visibility','Future: transfer intelligence','combined scouting accuracy','combined prospect visibility','broader transfer and youth intelligence','Scouting Office Lv']:
              for n,line in enumerate(staff.splitlines(),1):
                  if needle in line:
                      print(f'L{n}: {line.strip()}')
          PY