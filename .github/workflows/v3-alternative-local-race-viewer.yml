name: V3 local-only race viewer original alternate A3 replay
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a3ViewerReplayV3.mjs'
      - 'scripts/v3/serve-a3-race-viewer.mjs'
      - 'scripts/v3/viewer/**'
      - 'scripts/v3/verify-a3-race-viewer-v3.mjs'
      - '.github/workflows/v3-alternative-local-race-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-browser-service-and-original-race-replays:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse standalone viewer JS and server (no browser bundle needed)
        run: |
          node --check scripts/v3/viewer/viewer.js
          node --check scripts/v3/serve-a3-race-viewer.mjs
          node --check scripts/v3/a3ViewerReplayV3.mjs
      - name: Localhost HTTP, 32 106 168 original engine 180s, attacks, seek and replay payload
        run: node scripts/v3/verify-a3-race-viewer-v3.mjs
  preserve-synthetic-model-and-road-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a3-discrete-capacity-v3.mjs
      - run: node scripts/v3/verify-a3-distinct-road-profiles-v3.mjs
      - run: node scripts/v3/verify-a3-rider-performance-v3.mjs
  protect-original-a64-and-group-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  protect-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
