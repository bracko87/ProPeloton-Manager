name: V3 Step80 receding-horizon full-body safety research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step80RecedingHorizonV3.mjs'
      - 'scripts/v3/verify-a2-step80-horizon-physical-v3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - '.github/workflows/v3-step80-receding-horizon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  horizon-physical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A80 two and three tick projected full-bicycle swept road and energy safety, 8 32 106 168
        env:
          V3_A2_STEP80_DIR: ${{ runner.temp }}/a80
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step80-horizon-physical-v3.mjs
      - name: Protected A78 local 32 rider 180s 87 sustained passing exact observer recovery
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protected A77 five-abreast 32 rider 180s staged 87 sustained overtakes
        env:
          V3_A2_STEP77_STAGED_DIR: ${{ runner.temp }}/a77
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step77-phase2-staged-success-v3.mjs
      - name: Protected A76 32 106 168 three-abreast 180s 58 151 198 real sustained passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Upload truthful physical pilot and protected baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-step80-true-swept-receding-horizon
          path: |
            ${{ runner.temp }}/a80/*.json
            ${{ runner.temp }}/a78/*.json
            ${{ runner.temp }}/a77/*.json
            ${{ runner.temp }}/a76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
