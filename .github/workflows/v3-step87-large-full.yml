name: V3 Step87 106 168 five-wide all full 180 second attempts
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step87CorridorOrderV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step87-large-full-v3.mjs'
      - '.github/workflows/v3-step87-large-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-physics-106-168-every-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eight 106 and 168 five-abreast staged double full 180s original A64 contact and W-prime attempts
        env:
          V3_A2_STEP87_LARGE_DIR: ${{ runner.temp }}/a87large
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step87-large-full-v3.mjs
      - name: Save honest every first-contact or completed 106 168 physical result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a87-large-106-168-180s-physical-outcomes
          path: ${{ runner.temp }}/a87large/*.json
          if-no-files-found: warn
          retention-days: 30
