name: Apply race supply reservation UI fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-race-supply-reservation-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Race Preparation supply availability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RacePreparation.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('function StagePlansTab({')
          end = text.index('\nfunction StageCardsScroller({', start)
          body = text[start:end]

          state_needle = '  const [selectedStageIndex, setSelectedStageIndex] = useState(0);\n'
          state_replacement = state_needle + '''  const [stageSupplyOptions, setStageSupplyOptions] =\n    useState<RaceSupplyOption[]>(supplyOptions);\n'''
          assert body.count(state_needle) == 1, 'Unexpected selectedStageIndex state shape'
          body = body.replace(state_needle, state_replacement, 1)

          stage_needle = '  const selectedStage = stages[selectedStageIndex] ?? stages[0] ?? null;\n'
          stage_replacement = stage_needle + '''  const selectedStageSupplyId = String(asRecord(selectedStage).id ?? "");\n  const selectedStageSupplyTeamId = String(\n    asRecord(target?.preparation).participating_club_id ??\n      asRecord(target?.preparation).club_id ??\n      asRecord(target?.entry).participating_club_id ??\n      asRecord(target?.entry).club_id ??\n      "",\n  );\n'''
          assert body.count(stage_needle) == 1, 'Unexpected selectedStage shape'
          body = body.replace(stage_needle, stage_replacement, 1)

          save_disabled_needle = '''  const stageSaveDisabled =\n    !packageSubmitted ||\n    !selectedStage ||\n    !selectedStageKey ||\n    selectedStageLockedByWeather ||\n    lockInfo.isLocked ||\n    stagePlanControlsReadOnly ||\n    savingStagePlan;\n'''
          effect = '''\n\n  useEffect(() => {\n    let cancelled = false;\n\n    async function loadStageSupplyAvailability() {\n      if (!selectedStageSupplyId || !selectedStageSupplyTeamId) {\n        if (!cancelled) setStageSupplyOptions(supplyOptions);\n        return;\n      }\n\n      const { data, error } = await supabase.rpc(\n        "get_race_stage_supply_availability_v1",\n        {\n          p_stage_id: selectedStageSupplyId,\n          p_team_id: selectedStageSupplyTeamId,\n        },\n      );\n\n      if (cancelled) return;\n\n      if (error) {\n        console.warn(\n          "Could not load reservation-aware stage supply availability:",\n          error.message,\n        );\n        setStageSupplyOptions(supplyOptions);\n        return;\n      }\n\n      const availabilityByKey = new Map<string, number>(\n        toArray<JsonRecord>(data).map((row) => [\n          String(row.supply_key ?? ""),\n          Math.max(0, Number(row.quantity_available ?? 0)),\n        ]),\n      );\n\n      setStageSupplyOptions(\n        supplyOptions.map((option) => {\n          const supplyKey = String(option.supply_key ?? "");\n          const available = availabilityByKey.get(supplyKey);\n\n          return available === undefined\n            ? option\n            : { ...option, quantity_available: available };\n        }),\n      );\n    }\n\n    void loadStageSupplyAvailability();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [selectedStageSupplyId, selectedStageSupplyTeamId, supplyOptions]);\n'''
          assert body.count(save_disabled_needle) == 1, 'Unexpected stageSaveDisabled shape'
          body = body.replace(save_disabled_needle, save_disabled_needle + effect, 1)

          prop_needle = 'supplyOptions={supplyOptions}'
          prop_count = body.count(prop_needle)
          assert prop_count >= 2, f'Expected selected-stage supply props, found {prop_count}'
          body = body.replace(prop_needle, 'supplyOptions={stageSupplyOptions}')

          updated = text[:start] + body + text[end:]
          assert updated != text, 'RacePreparation.tsx was not changed'
          assert 'get_race_stage_supply_availability_v1' in updated
          path.write_text(updated, encoding='utf-8')
          print(f'Patched RacePreparation.tsx; replaced {prop_count} selected-stage supply prop(s).')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit validated UI patch and remove temporary workflow
        run: |
          rm -f .github/workflows/chatgpt-fix-race-supply-reservation-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/RacePreparation.tsx .github/workflows/chatgpt-fix-race-supply-reservation-ui.yml
          git commit -m 'Show reservation-aware race supplies in stage plans'
          git pull --rebase origin main
          git push origin main
