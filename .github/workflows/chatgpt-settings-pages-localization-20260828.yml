name: Localize settings pages 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-settings-pages-localization-20260828.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace flag emoji with real flag images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/MyProfile.tsx')
          text = path.read_text(encoding='utf-8')

          active_pattern = re.compile(
              r'<span className="text-xl leading-none" aria-hidden="true">\s*\{activeLanguageDefinition\.flag\}\s*</span>'
          )
          option_pattern = re.compile(
              r'<span className="text-xl leading-none" aria-hidden="true">\s*\{language\.flag\}\s*</span>'
          )

          active_new = '''<img
                src={activeLanguageDefinition.code === 'sr-Latn'
                  ? 'https://flagcdn.com/w40/rs.png'
                  : 'https://flagcdn.com/w40/gb.png'}
                alt=""
                aria-hidden="true"
                className="h-4 w-6 shrink-0 rounded-[2px] object-cover"
              />'''
          option_new = '''<img
                        src={language.code === 'sr-Latn'
                          ? 'https://flagcdn.com/w40/rs.png'
                          : 'https://flagcdn.com/w40/gb.png'}
                        alt=""
                        aria-hidden="true"
                        className="h-4 w-6 shrink-0 rounded-[2px] object-cover"
                      />'''

          text, active_count = active_pattern.subn(active_new, text, count=1)
          text, option_count = option_pattern.subn(option_new, text, count=1)
          if active_count != 1 or option_count != 1:
              raise SystemExit(f'Flag rendering replacement failed: active={active_count}, option={option_count}')
          path.write_text(text, encoding='utf-8')

          script_path = Path('.github/scripts/chatgpt_settings_pages_localization_20260828.py')
          script = script_path.read_text(encoding='utf-8')
          stale = "if count < 1:\n    raise SystemExit('MyProfile language countryCode flag anchor not found')"
          script = script.replace(stale, "if count < 0:\n    raise SystemExit('unreachable')")
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Apply direct i18n conversion
        run: python .github/scripts/chatgpt_settings_pages_localization_20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/MyProfile.tsx \
            src/pages/Help.tsx \
            src/pages/ProPackages.tsx \
            src/pages/Preferences.tsx \
            src/pages/CustomizeTeam.tsx

          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi

          git commit -m "Localize profile settings and support pages"
          git push origin main
