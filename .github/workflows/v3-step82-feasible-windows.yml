name: V3 Step82 physically necessary zipper window feasibility
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step82FeasibleZipperWindowsV3.mjs'
      - 'scripts/v3/verify-a2-step82-feasible-windows-v3.mjs'
      - 'scripts/v3/verify-a2-step82-parity-full-races-v3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - '.github/workflows/v3-step82-feasible-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feasible-window-original-body-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A82 kinematic necessary intervals UNSAT and real 8 32 106 168 swept physical test
        env:
          V3_A2_STEP82_DIR: ${{ runner.temp }}/a82
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step82-feasible-windows-v3.mjs
      - name: A82 mirrored road and renamed physical parity plus actual 8 and 32 rider full 180s overtake observer replay
        env:
          V3_A2_STEP82_LONG_DIR: ${{ runner.temp }}/a82long
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step82-parity-full-races-v3.mjs
      - name: Protect Step81 actual 32r staged 180s, 64 independent overtakes and exact 90+90
        env:
          V3_A2_STEP81_FULL32_DIR: ${{ runner.temp }}/a81
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step81-32-full-races-v3.mjs
      - name: Protect Step78 32r staged five-abreast 180s 87 sustained pair overtakes
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protect Step76 three-abreast 32 106 168 180s 58 151 198 independent passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Upload physical evidence and preserved sporting benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a82-necessary-zipper-window-contact-evidence
          path: |
            ${{ runner.temp }}/a82/*.json
            ${{ runner.temp }}/a82long/*.json
            ${{ runner.temp }}/a81/*.json
            ${{ runner.temp }}/a78/*.json
            ${{ runner.temp }}/a76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
