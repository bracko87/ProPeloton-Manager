name: V3 Step87 physically reachable multirow corridor order
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step87CorridorOrderV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step87-corridor-physical-v3.mjs'
      - '.github/workflows/v3-step87-corridor-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-swept-multirow-order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step87 necessary partial order plus 16 real 8 32 106 168 five-wide original swept tests
        env:
          V3_A2_STEP87_DIR: ${{ runner.temp }}/a87
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - name: Protected Step86 physically attainable partial gap 16 field scenarios
        env:
          V3_A2_STEP86_DIR: ${{ runner.temp }}/a86
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - name: Protected Step85 original physical no-stop proposal and 16 large field audits
        env:
          V3_A2_STEP85_DIR: ${{ runner.temp }}/a85
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step85-throughput-v3.mjs
      - name: Protected Step78 32-rider five-wide staged 180s 87 independent sustained passes
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protected Step76 32 106 168 three-wide double 180s real sustained passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Save strict A64 and previous protected physical/observer research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a87-geometry-multirow-physical-replay
          path: |
            ${{ runner.temp }}/a87/*.json
            ${{ runner.temp }}/a86/*.json
            ${{ runner.temp }}/a85/*.json
            ${{ runner.temp }}/a78/*.json
            ${{ runner.temp }}/a76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
