name: V3 A2 sustained synchronous micro validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-simultaneous-stress-v3.mjs'
      - '.github/workflows/v3-a2-simultaneous-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sustained:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        riders: [12, 24, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing prototype and collision regression
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Repeat 90 ticks under four traffic scenarios
        env:
          V3_A2_STRESS_RIDERS: ${{ matrix.riders }}
          V3_A2_STRESS_DIR: ${{ runner.temp }}/a2-stress-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-simultaneous-stress-v3.mjs
      - name: Archive performance and mobility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-stress-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-stress-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Production build regression
        if: matrix.riders == 12
        run: npm ci --no-audit --no-fund && npm run build
