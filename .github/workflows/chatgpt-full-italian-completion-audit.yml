name: Full Italian completion audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/i18n/locales/it/**'
      - 'src/i18n/index.ts'
      - 'src/i18n/languages.ts'
      - 'src/components/i18n/LanguageSelector.tsx'
      - 'src/components/i18n/LocaleDateFormattingBridge.tsx'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit Italian locale completion and semantics
        shell: bash
        run: python .github/scripts/audit_italian_completion_20260831.py | tee /tmp/italian-completion.txt

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload Italian audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-full-completion-audit
          path: /tmp/italian-completion.txt
          retention-days: 3
          if-no-files-found: warn
