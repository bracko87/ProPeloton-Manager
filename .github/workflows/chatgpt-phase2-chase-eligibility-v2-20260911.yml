name: ChatGPT Phase 2 chase eligibility v2

on:
  push:
    branches:
      - chatgpt-phase2-chase-eligibility-20260911
    paths:
      - .github/workflows/chatgpt-phase2-chase-eligibility-v2-20260911.yml

permissions:
  contents: write

jobs:
  patch-validate-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-phase2-chase-eligibility-20260911
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin chatgpt-phase2-chase-eligibility-20260911

      - name: Apply corrected Phase 2 patch
        run: python .github/scripts/chatgpt_phase2_chase_patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run targeted deterministic race regressions
        run: |
          npm install --no-save --package-lock=false vitest@3.2.4
          npx vitest run src/universal-race-engine/runRaceEngine.test.ts -t "Phase 11L V5.5|limits role-default late chasing|keeps an explicit Phase 3 chase|does not promote a Phase 3 race-control|does not let Phase 3 race-control|keeps the automatic late chase|makes flat, hilly, medium-mountain and hard-summit profiles|keeps finish commentary locked"

      - name: Commit validated engine and tests
        run: |
          rm -f .github/workflows/chatgpt-phase2-chase-eligibility-20260911.yml
          rm -f .github/workflows/chatgpt-phase2-chase-eligibility-v2-20260911.yml
          rm -f .github/scripts/chatgpt_phase2_chase_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restrict automatic late chase eligibility"
          ENGINE_SHA=$(git rev-parse HEAD)
          echo "ENGINE_SHA=$ENGINE_SHA" >> "$GITHUB_ENV"

      - name: Pin race runner to validated Phase 2 engine
        shell: python
        run: |
          from pathlib import Path
          import os

          path = Path('supabase/functions/universal-race-stage-runner/index.ts')
          text = path.read_text()
          old = 'ee143a20cd74b7fe371ede346aca2b1583dc3306'
          new = os.environ['ENGINE_SHA']
          if text.count(old) != 4:
              raise SystemExit(f'Expected exactly four Phase 1 source pins, found {text.count(old)}')
          text = text.replace(old, new)
          if text.count(new) != 4 or old in text:
              raise SystemExit('Phase 2 source pin replacement did not complete cleanly')
          if text.count('90fc6ce06197f4537b6088d30252b60025f39253') < 4:
              raise SystemExit('Emergency V5.2 fallback pin changed unexpectedly')
          if f'const SOURCE_COMMIT = "{new}";' not in text:
              raise SystemExit('SOURCE_COMMIT does not match validated Phase 2 engine')
          path.write_text(text)

      - name: Commit runner pin and push
        run: |
          git add supabase/functions/universal-race-stage-runner/index.ts
          git commit -m "Pin race runner to Phase 2 chase eligibility engine"
          git pull --rebase origin chatgpt-phase2-chase-eligibility-20260911
          git push origin HEAD:chatgpt-phase2-chase-eligibility-20260911
