          error: errorPayload(primaryError),
        });
        useFallback = true;
      }
    }

    if (useFallback) {'''
          new = '''        await heartbeat(supabase, stageId, simulationRunId, "primary_engine_failed_switching_to_fallback", {
          error: errorPayload(primaryError),
        });
        if (scenarioReservationActive) {
          await abandonRoadScenario(supabase, stageId, simulationRunId, "primary_engine_or_output_exception");
          scenarioReservationActive = false;
        }
        useFallback = true;
      }
    }

    if (useFallback) {
      if (scenarioReservationActive) {
        await abandonRoadScenario(supabase, stageId, simulationRunId, fallbackReason || "emergency_fallback_selected");
        scenarioReservationActive = false;
      }'''
          assert s.count(old) == 1, 'fallback transition anchor'
          s = s.replace(old, new)

          old = '''    const submit = await rpc<unknown>(supabase, "universal_race_stage_submit_calculation_v1", {
      p_stage_id: stageId,
      p_simulation_run_id: simulationRunId,
      p_input_snapshot: input,
      p_universal_result: output,
    });

    const calculationCpuMs = performance.now() - started;'''
          new = '''    const submit = await rpc<unknown>(supabase, "universal_race_stage_submit_calculation_v1", {
      p_stage_id: stageId,
      p_simulation_run_id: simulationRunId,
      p_input_snapshot: input,
