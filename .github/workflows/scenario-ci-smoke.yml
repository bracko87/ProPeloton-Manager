      submit_result: submit,
    };'''
          new = '''      degraded_components: degradedComponents,
      road_scenario_type: scenarioAudit?.scenarioType ?? null,
      road_scenario_template_id: scenarioAudit?.templateId ?? null,
      road_scenario_family: scenarioAudit?.templateFamily ?? null,
