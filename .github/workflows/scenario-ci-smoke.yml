        degradedComponents.push(`scenario_finalize:${String(details.message ?? "unknown")}`);
      }
    }

    const calculationCpuMs = performance.now() - started;'''
          assert s.count(old) == 1, 'submit anchor'
          s = s.replace(old, new)

