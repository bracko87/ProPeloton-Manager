      - run: npm ci
      - name: Wire authoritative runner to road scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/universal-race-stage-runner/index.ts')
          s = p.read_text()
          old_commit = '79dd5f231c0677441eeaf7a4b3830c82fa461904'
          engine_commit = '920412011b285a96787e36becdfe19287bc05a44'
          s = s.replace(old_commit, engine_commit)

          old = '''import {
  buildProductionUniversalRaceEngineInput,
  type ProductionUniversalRaceSources,
} from "https://raw.githubusercontent.com/bracko87/ProPeloton-Manager/920412011b285a96787e36becdfe19287bc05a44/src/universal-race-engine/buildProductionRaceInput.ts";'''
          new = '''import {
  buildScenarioProductionUniversalRaceEngineInput as buildProductionUniversalRaceEngineInput,
  getRoadScenarioAuditV1,
  type ScenarioProductionUniversalRaceSources as ProductionUniversalRaceSources,
} from "https://raw.githubusercontent.com/bracko87/ProPeloton-Manager/920412011b285a96787e36becdfe19287bc05a44/src/universal-race-engine/buildProductionRaceInputScenarioV1.ts";'''
          assert s.count(old) == 1, 'primary adapter import anchor'
          s = s.replace(old, new)
          s = s.replace(
              'const WORKER_BUILD = "supabase_race_calculation_survival_v1";',
              'const WORKER_BUILD = "road_scenario_v1_flat_hilly_2026_09_13";',
          )

          anchor = '''function buildSources(payloadValue: unknown, simulationRunId: string, preStageStandings: unknown): ProductionUniversalRaceSources {'''
          helpers = '''function scenarioEligibleSources(sources: ProductionUniversalRaceSources): boolean {
  const stage = object(sources.stage as unknown);
  const format = String(stage.stage_format ?? stage.format ?? "road_race").trim().toLowerCase();
  const terrain = String(stage.terrain_type ?? "").trim().toLowerCase();
  return format === "road_race" && (terrain === "flat" || terrain === "hilly");
}

function scenarioRaceId(sources: ProductionUniversalRaceSources): string {
  const race = object(sources.race as unknown);
  return typeof race.id === "string" ? race.id : "";
}

function scenarioGameDate(sources: ProductionUniversalRaceSources): string {
  const stage = object(sources.stage as unknown);
  const race = object(sources.race as unknown);
  return String(stage.stage_date ?? race.start_date ?? "").slice(0, 10);
}

async function loadRoadScenarioHistory(
  supabase: SupabaseClient,
  sources: ProductionUniversalRaceSources,
): Promise<JsonObject[]> {
  if (!scenarioEligibleSources(sources)) return [];
  const raceId = scenarioRaceId(sources);
  const gameDate = scenarioGameDate(sources);
  if (!raceId || !gameDate) throw new Error("Road scenario context is missing race/date identity.");
  return rows(await rpc<unknown>(supabase, "universal_race_stage_scenario_history_v1", {
    p_race_id: raceId,
    p_game_date: gameDate,
  }));
}

async function preparePrimaryScenarioInput(
  supabase: SupabaseClient,
  sources: ProductionUniversalRaceSources,
  stageId: string,
  simulationRunId: string,
): Promise<{ input: any; audit: JsonObject | null; reserved: boolean }> {
  if (!scenarioEligibleSources(sources)) {
    return { input: buildProductionUniversalRaceEngineInput(sources), audit: null, reserved: false };
  }

  let scenarioHistory = await loadRoadScenarioHistory(supabase, sources);
  const raceId = scenarioRaceId(sources);
  const gameDate = scenarioGameDate(sources);

  for (let attempt = 0; attempt < 20; attempt += 1) {
    const scenarioSources = { ...sources, scenarioHistory } as ProductionUniversalRaceSources;
    const input = buildProductionUniversalRaceEngineInput(scenarioSources);
    const audit = getRoadScenarioAuditV1(input) as JsonObject | null;
    if (!audit) return { input, audit: null, reserved: false };

    const reservation = object(await rpc<unknown>(supabase, "universal_race_stage_reserve_scenario_v1", {
      p_stage_id: stageId,
      p_simulation_run_id: simulationRunId,
      p_audit: audit,
    }));
    const status = String(reservation.status ?? "");
    const reservedTemplateId = String(reservation.template_id ?? "");
    const selectedTemplateId = String(audit.templateId ?? "");

    if (status === "reserved") {
      return { input, audit, reserved: true };
    }
    if (status === "existing" && (!reservedTemplateId || reservedTemplateId === selectedTemplateId)) {
      return { input, audit, reserved: true };
    }
    if (status !== "collision" && status !== "existing") {
      throw new Error(`Scenario reservation returned unexpected status ${status || "unknown"}.`);
    }

    const blockedTemplateId = reservedTemplateId || selectedTemplateId;
    if (!blockedTemplateId) throw new Error("Scenario reservation conflict did not identify a template.");
    scenarioHistory = await loadRoadScenarioHistory(supabase, sources);
    // Force the deterministic selector away from a concurrently reserved or
    // already authoritative template on the retry. Using current raceId here
    // intentionally activates the selector's strongest exact-template guard.
    scenarioHistory.push({
      raceId,
      stageId: `scenario-conflict-${attempt}-${blockedTemplateId}`,
      gameDate,
      templateId: blockedTemplateId,
      family: String(audit.templateFamily ?? "conflict"),
      status: "reserved",
    });
  }

  throw new Error("Road scenario reservation exhausted 20 alternative attempts.");
}

async function abandonRoadScenario(
  supabase: SupabaseClient,
  stageId: string,
  simulationRunId: string,
  reason: string,
): Promise<void> {
  try {
    await rpc<unknown>(supabase, "universal_race_stage_abandon_scenario_v1", {
      p_stage_id: stageId,
      p_simulation_run_id: simulationRunId,
      p_reason: reason,
    });
  } catch {
    // Scenario audit cleanup must never block the emergency sporting fallback.
  }
}

function roadScenarioActualOutcome(result: any): JsonObject {
  const classification = Array.isArray(result?.finishResolution?.classification)
    ? result.finishResolution.classification
    : [];
  const winner = classification[0] ?? {};
  const winnerTime = finiteNumber(winner.officialTimeSeconds, finiteNumber(winner.elapsedSeconds, 0));
  const sameTimeCount = winnerTime > 0
    ? classification.filter((row: any) => Math.abs(finiteNumber(row.officialTimeSeconds, finiteNumber(row.elapsedSeconds, 0)) - winnerTime) < 0.001).length
    : 0;
  const gaps = classification.map((row: any) => finiteNumber(row.gapSeconds, 0));
  return {
    winner_rider_id: typeof winner.riderId === "string" ? winner.riderId : null,
    classification_count: classification.length,
    winner_official_time_seconds: winnerTime || null,
    same_time_with_winner_count: sameTimeCount,
    max_official_gap_seconds: gaps.length > 0 ? Math.max(...gaps) : 0,
    replay_checkpoint_count: Array.isArray(result?.replayTimeline?.checkpoints) ? result.replayTimeline.checkpoints.length : 0,
  };
}

async function finalizeRoadScenario(
  supabase: SupabaseClient,
  stageId: string,
  simulationRunId: string,
  result: any,
): Promise<void> {
  await rpc<unknown>(supabase, "universal_race_stage_finalize_scenario_v1", {
    p_stage_id: stageId,
    p_simulation_run_id: simulationRunId,
    p_actual_outcome: roadScenarioActualOutcome(result),
    p_deviations: [],
  });
}

function buildSources(payloadValue: unknown, simulationRunId: string, preStageStandings: unknown): ProductionUniversalRaceSources {'''
          assert s.count(anchor) == 1, 'helper insertion anchor'
          s = s.replace(anchor, helpers)

          old = '''    const sources = buildSources(claim.payload, simulationRunId, preStageStandings);

    let currentBaseInput: any = null;
    try {
      currentBaseInput = buildProductionUniversalRaceEngineInput(sources);
    } catch (error) {'''
          new = '''    const sources = buildSources(claim.payload, simulationRunId, preStageStandings);

    let currentBaseInput: any = null;
    let scenarioAudit: JsonObject | null = null;
    let scenarioReservationActive = false;
    try {
      if (useFallback) {
        currentBaseInput = buildFallbackProductionUniversalRaceEngineInput(sources as any);
      } else {
        const scenarioPackage = await preparePrimaryScenarioInput(supabase, sources, stageId, simulationRunId);
        currentBaseInput = scenarioPackage.input;
        scenarioAudit = scenarioPackage.audit;
        scenarioReservationActive = scenarioPackage.reserved;
        if (scenarioAudit) {
          await heartbeat(supabase, stageId, simulationRunId, "road_scenario_reserved", {
            scenario_type: scenarioAudit.scenarioType ?? null,
