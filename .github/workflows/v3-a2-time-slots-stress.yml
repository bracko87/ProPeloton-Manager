name: V3 A2 before-after time slots 2-6 rider stress
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-time-slots-v3.mjs'
      - '.github/workflows/v3-a2-time-slots-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Micro physics consent and pass regression
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-timed-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-fair-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Six policy comparisons across four widths and two gap and speed classes
        env:
          V3_A2_SLOT_SIZE: ${{ matrix.riders }}
          V3_A2_SLOT_DIR: ${{ runner.temp }}/a2-slots-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-time-slots-v3.mjs
      - name: Preserve all rider pass, fairness and checkpoint data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-time-slots-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-slots-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent production application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
