name: Verify universal breakaway recovery V2
on:
  pull_request:
    paths:
      - 'src/universal-race-engine/applyUniversalBreakawayRecoveryV2.mjs'
      - 'scripts/verify-universal-breakaway-recovery-v2.mjs'
      - 'supabase/functions/universal-race-stage-safe-resume/index.ts'
      - 'scripts/operations/universal_breakaway_recovery_rider_state_writer_v2.sql'
      - '.github/workflows/verify-universal-breakaway-recovery-v2.yml'
  push:
    branches: [main]
    paths:
      - 'src/universal-race-engine/applyUniversalBreakawayRecoveryV2.mjs'
      - 'scripts/verify-universal-breakaway-recovery-v2.mjs'
      - 'supabase/functions/universal-race-stage-safe-resume/index.ts'
      - '.github/workflows/verify-universal-breakaway-recovery-v2.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test real physical breakaway duration, tier fatigue, and repeated-stage recovery
        run: node scripts/verify-universal-breakaway-recovery-v2.mjs
      - name: Verify prior frozen source and all race worker pins
        run: |
          node scripts/verify-pinned-replay-cpu-fork.mjs
          node scripts/verify-breakaway-tier-pilot-v1.mjs
          node scripts/verify-v1-clock-production-rollout.mjs
          node scripts/verify-summit-worker-pins.mjs
