name: Overview footer localization follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-overview-footer-followup-20260828.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply localization fixes
        run: python .github/scripts/chatgpt_overview_footer_followup_20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/MyProfile.tsx \
            src/components/layout/Footer.tsx \
            src/pages/dashboard/Overview.tsx \
            src/i18n/locales/en/overview.json \
            src/i18n/locales/sr-Latn/overview.json
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Fix remaining Serbian overview and footer localization"
          git push origin main
