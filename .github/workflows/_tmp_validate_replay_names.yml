name: Temporary replay names build validation

on:
  push:
    paths:
      - '.github/workflows/_tmp_validate_replay_names.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
