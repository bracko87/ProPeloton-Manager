name: V3 Step84 multi-neighborhood crossing consensus true body
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step84CrossingConsensusV3.mjs'
      - 'scripts/v3/verify-a2-step84-crossing-consensus-v3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - '.github/workflows/v3-step84-crossing-consensus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossing-consensus-true-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step84 geometry symmetry, conflict-order neutrality, 16 real full bicycle 8/32/106/168 cases
        env:
          V3_A2_STEP84_DIR: ${{ runner.temp }}/step84
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step84-crossing-consensus-v3.mjs
      - name: Protected Step83 physical 16 cases and correctly rejected large five-abreast
        env:
          V3_A2_STEP83_DIR: ${{ runner.temp }}/step83
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step83-joint-tubes-v3.mjs
      - name: Protected Step82 32r five-abreast 180s 85 true passes plus exact recovery
        env:
          V3_A2_STEP82_LONG_DIR: ${{ runner.temp }}/step82
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step82-parity-full-races-v3.mjs
      - name: Protected Step78 32r five-abreast 180s 87 true passes plus exact recovery
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/step78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protected Step76 32 106 168 three-abreast 180s 58 151 198 independent passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/step76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Upload real synchronized original-swept outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a84-original-physical-consensus-matrix
          path: |
            ${{ runner.temp }}/step84/*.json
            ${{ runner.temp }}/step83/*.json
            ${{ runner.temp }}/step82/*.json
            ${{ runner.temp }}/step78/*.json
            ${{ runner.temp }}/step76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
