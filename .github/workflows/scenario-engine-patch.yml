name: Apply scenario physical director
on:
  push:
    branches:
      - chatgpt-scenario-core-v1-20260913
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch universal race engine
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile physical director and engine
        run: |
          npx esbuild src/universal-race-engine/roadScenarioPhysicalDirectorV1.ts --bundle --platform=node --format=esm --outfile=/tmp/roadScenarioPhysicalDirectorV1.mjs
          npx esbuild src/universal-race-engine/runRaceEngine.ts --bundle --platform=node --format=esm --outfile=/tmp/runRaceEngine.mjs
      - name: Production build
        run: npm run build
      - name: Commit physical director integration
        shell: bash
        run: |
          if git diff --quiet -- src/universal-race-engine/runRaceEngine.ts; then
            echo "No engine patch to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/universal-race-engine/runRaceEngine.ts
          git commit -m "Integrate road scenario physical director"
          git push origin HEAD:chatgpt-scenario-core-v1-20260913
