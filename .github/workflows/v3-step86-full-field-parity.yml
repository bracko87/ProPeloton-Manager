name: V3 Step86 full field mirror parity and 8 32 rider sporting checkpoint
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/verify-a2-step86-physical-parity-replay-v3.mjs'
      - '.github/workflows/v3-step86-full-field-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-mirror-and-racing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step86 16 actual physical mirror and rider name cases plus full 8 and 32 rider 180s original bike and overtaking replay
        env:
          V3_A2_STEP86_PARITY_DIR: ${{ runner.temp }}/a86parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-physical-parity-replay-v3.mjs
      - name: Preserve Step85 32 five-wide double 180s true 66 passing events and zero stops
        env:
          V3_A2_STEP85_PARITY_DIR: ${{ runner.temp }}/a85parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step85-physical-parity-replay-v3.mjs
      - name: Upload independent physics and observer replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a86-real-eight-thirtytwo-long-sporting-parity
          path: |
            ${{ runner.temp }}/a86parity/*.json
            ${{ runner.temp }}/a85parity/*.json
          if-no-files-found: warn
          retention-days: 30
