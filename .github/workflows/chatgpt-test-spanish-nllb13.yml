name: Test NLLB 1.3B Spanish quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-test-spanish-nllb13.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install translation dependencies
        run: pip install --disable-pip-version-check 'transformers<5' sentencepiece 'torch==2.6.0' safetensors
      - name: Test representative strings
        shell: bash
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          import torch
          model_name='facebook/nllb-200-1.3B'
          tok=AutoTokenizer.from_pretrained(model_name,src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval(); torch.set_num_threads(4)
          target=tok.convert_tokens_to_ids('spa_Latn')
          samples=[
            'Failed to load finance data.','Tab crashed.','Competition reward','Training camp refund','Training camp booking','Staff release cost','Free-agent signing cost paid','+5 morale','Net operating: €12,000','Emergency debt movement','Hover a bar to see details.','Hover a dot to see details.','Your main seasonal partner and largest sponsorship income.','Equipment partner providing cash support and sponsor-brand equipment discounts.','This deal pays guaranteed money immediately when signed. The bonus pool is paid later only if your team completes sponsor objectives such as race starts, wins, podiums, top-5 results, or GC targets.','Stage top 5','Stage win','The race engine can later choose any available unit of the selected type and fall back to the next available type if needed.','One game day equals 12 real-life hours. Use this when checking deadlines, race-preparation windows and Stage Plan locks.','Race Plans, rider submissions and Stage Plans have deadlines. Missing them can leave your team badly prepared or unable to race correctly.','Rider and staff market, shortlist, and negotiations.','Rider market tabs','All roles','Active only','Overall high-low','Price high-low','Transfer-listed riders','Full-width transfer market. The active user offer stays pinned at the top and highlighted.','Rider is currently published on the transfer market.','Rider refused contract','Declined','Free-agent signing completed successfully.','Shortlisted riders','Two free additions per real day are included; later additions cost 1 Coin each.','Role at capacity (2/2).','Open slots left: 2.'
          ]
          for start in range(0,len(samples),8):
            batch=samples[start:start+8]
            enc=tok(batch,return_tensors='pt',padding=True,truncation=True,max_length=512)
            with torch.inference_mode():
              out=model.generate(**enc,forced_bos_token_id=target,max_new_tokens=256,num_beams=4)
            dec=tok.batch_decode(out,skip_special_tokens=True)
            for s,t in zip(batch,dec):
              print('EN:',s); print('ES:',t); print()
          PY
