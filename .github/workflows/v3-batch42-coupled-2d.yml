name: V3 Batch 42 truly coupled 2D research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/coupled2DMicroV3.mjs'
      - 'scripts/v3/verify-batch42-2d-v3.mjs'
      - 'scripts/v3/audit-batch42-2d-v3.mjs'
      - '.github/workflows/v3-batch42-coupled-2d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coupled-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Continuous collision, W-prime and JSON-resume microfixtures
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
      - name: Full-size field coupled pilot and unmodified reference race
        env:
          V3_BATCH42_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH42_OUT_DIR: ${{ runner.temp }}/batch42-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch42-2d-v3.mjs
      - name: Save every field-level pilot and complete checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch42-${{ matrix.fixture }}
          path: ${{ runner.temp }}/batch42-${{ matrix.fixture }}/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify production application build
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
