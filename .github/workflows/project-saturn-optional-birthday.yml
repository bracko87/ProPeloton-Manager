name: Project Saturn - optional birthday registration verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pages/Register.tsx'
      - 'src/i18n/locales/**/auth.json'
      - '.github/workflows/project-saturn-optional-birthday.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Build and audit optional birthday form in all 8 languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete production build and existing translation checks
        run: npm run build
      - name: Assert no birthday required when left blank
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const form = fs.readFileSync('src/pages/Register.tsx','utf8');
          const expectations = [
            'const birthdayProvided = Boolean(',
            'if (birthdayProvided && (!birthdayMonth',
            'if (birthdayProvided && !birthdayDay)',
            'birthday_month: birthdayProvided ? birthdayMonth : null',
            'birthday_day: birthdayProvided ? birthdayDay : null',
            'birthday_year: birthdayProvided ? birthdayYear : null',
            "t('register.birthdayOptional')",
            'supabase.auth.signUp({',
          ];
          for(const needle of expectations){
            if(!form.includes(needle)) throw new Error('Missing optional birthday rule: '+needle);
          }
          for(const lang of ['en','de','sr-Latn','hr','es','fr','it','ru']){
            const path = 'src/i18n/locales/'+lang+'/auth.json';
            const json = JSON.parse(fs.readFileSync(path,'utf8'));
            const r = json.register;
            if(!r.birthdayOptional || !r.birthdayHelp || !r.birthdayMonthRequired ||
              !r.birthdayDayRequired || !r.invalidBirthdayDay){
              throw new Error('Missing birthday translations for '+lang);
            }
            if(r.birthdayHelp.length<65) throw new Error('Birthday explanation too short for '+lang);
          }
          console.log('Registration permits omitted birthdays, rejects partial dates, sends null metadata, and has localized explanations in all 8 languages.');
          NODE
