name: V3 A2 affine time ordering and three-grid claimant completion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-subtick-grid-v3.mjs'
      - '.github/workflows/v3-a2-subtick-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fractional-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fractional event, micro and full-stage technical regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-subtick-observer-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-intent-aware-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Compare model-time ordering on three start grids
        env:
          V3_A2_SUBTICK_SIZE: ${{ matrix.riders }}
          V3_A2_SUBTICK_DIR: ${{ runner.temp }}/subtick-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-subtick-grid-v3.mjs
      - name: Preserve per-rider movement and time-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-subtick-grid-${{ matrix.riders }}
          path: ${{ runner.temp }}/subtick-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent production app build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
