name: National Championship rider list QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/national-championship-rider-list-qa.yml'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - 'src/pages/dashboard/NationalChampionshipRacePage.tsx'
      - 'src/i18n/locales/**/raceDetail.json'
      - 'supabase/migrations/*national_championship_rider_current_club_lookup.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Check NC-specific rider presentation and language keys
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const source = fs.readFileSync('src/pages/dashboard/RaceDetailPage.tsx', 'utf8')
          for (const fragment of [
            "race.category?.trim().toUpperCase() === 'NC'",
            'NationalChampionshipRidersList',
            "'get_nc_participant_current_clubs_v1'",
            "loadParticipantTeamLogos(kitTeams, raceId)",
            'NATIONAL_FREE_AGENT_JERSEY_URL',
            "t('participants.individualRiders')",
          ]) {
            if (!source.includes(fragment)) throw new Error('NC rider list regression: ' + fragment)
          }
          // Protect every result view against using the temporary one-rider
          // National Championship team entry instead of rider-to-club jerseys.
          for (const name of ['RaceClassificationTable', 'StageResultsTable', 'StagePointResultsTable']) {
            const start = source.indexOf('function ' + name + '({')
            const end = source.indexOf('\nfunction ', start + 10)
            const table = start >= 0 && end > start ? source.slice(start, end) : ''
            if (!table.includes('<RaceResultRiderKit') || !table.includes('ncClubKits')) {
              throw new Error('NC result kit regression in ' + name)
            }
          }
          if (!source.includes('useNationalChampionshipClubKits(race.id, isNationalChampionshipRace(race))')) {
            throw new Error('NC participant and result kits no longer use a shared lookup')
          }
          // General classification must follow stage timing: winner total time,
          // every rider at the same time "s.t.", actual gaps "+...".
          for (const fragment of [
            'function formatGeneralClassificationTime(',
            "if (row.rank === 1) return formatRaceClock(row.total_time_seconds)",
            "if (gap === 0) return 's.t.'",
            'if (gap !== null) return',
            "const isGeneralView = view === 'general'",
            'isPointsView || isGeneralView ? 4 : 5',
            'formatGeneralClassificationTime(row,',
          ]) {
            if (!source.includes(fragment)) throw new Error('General classification timing regression: ' + fragment)
          }
          const migration = fs.readFileSync('supabase/migrations/20261010060000_national_championship_rider_current_club_lookup.sql', 'utf8')
          for (const fragment of ['SECURITY DEFINER', 'REVOKE ALL', 'GRANT EXECUTE', 'public.race_participant_riders', 'public.club_riders']) {
            if (!migration.includes(fragment)) throw new Error('NC safe-lookup migration regression: ' + fragment)
          }
          const keys = ['individualRiders', 'nationalRiderCount', 'noNationalRiders', 'riderKit', 'freeAgent']
          const placeholders = str => [...str.matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)]
            .map(match => match[1]).sort().join(',')
          const english = JSON.parse(fs.readFileSync('src/i18n/locales/en/raceDetail.json', 'utf8'))
          for (const lang of ['en','sr-Latn','hr','de','es','it','fr','ru']) {
            const locale = JSON.parse(fs.readFileSync('src/i18n/locales/'+lang+'/raceDetail.json', 'utf8'))
            for (const key of keys) {
              const text = locale.participants?.[key]
              const expected = english.participants?.[key]
              if (typeof text !== 'string' || text.trim() === '') {
                throw new Error(lang + ': missing participants.' + key)
              }
              if (placeholders(text) !== placeholders(expected)) {
                throw new Error(lang + ': interpolation mismatch in participants.' + key)
              }
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
