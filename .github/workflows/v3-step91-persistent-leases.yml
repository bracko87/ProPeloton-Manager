name: V3 Step91 persistent achieved corridor leases
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step91PersistentCorridorLeaseV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step91-*.mjs'
      - '.github/workflows/v3-step91-persistent-leases.yml'
  workflow_dispatch:
jobs:
  pure-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step91-leases-v3.mjs
      - run: node scripts/v3/verify-a2-step90-row-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step85-throughput-v3.mjs
      - run: node scripts/v3/verify-a2-step78-joint-viability-v3.mjs
  original-a64-106-168:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step91-large-full-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a91-large-original-physical
          path: /tmp/a91large
          if-no-files-found: warn
  physical-parity-sporting-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step91-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a91-8-32-physical-sporting-replay
          path: /tmp/a91parity
          if-no-files-found: warn
  production-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
