name: V3 Step100 time-expanded two-gate occupancy research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step100TimeExpandedOccupancyV3.mjs'
      - 'scripts/v3/verify-a2-step100-*.mjs'
      - '.github/workflows/v3-step100-time-expanded-occupancy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lattice-and-real-field-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identity-neutral time-expanded lattice invariants
        run: node scripts/v3/verify-a2-step100-time-expanded-v3.mjs
      - name: Real original A64 initial five-wide geometry, necessary-only screen
        env:
          V3_A2_STEP100_DIR: ${{ runner.temp }}/step100
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step100-real-fields-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step100-two-gate-occupancy-screen
          path: ${{ runner.temp }}/step100/*.json
          if-no-files-found: warn
  protected-prior-sporting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step99 persistent claims still pass
        run: node scripts/v3/verify-a2-step99-persistent-reservations-v3.mjs
      - name: Protected Step86 original A64 physical control
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  production-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
