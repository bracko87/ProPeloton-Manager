name: V3 A2 seconds-normalized 5s full stages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/coupled2DMicroV3.mjs'
      - 'scripts/v3/verify-a2-normalized-dt-v3.mjs'
      - 'scripts/v3/audit-a2-normalized-dt-v3.mjs'
      - '.github/workflows/v3-a2-normalized-dt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-stage-time-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety, finish and normalized timing invariants
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-normalized-dt-v3.mjs
      - name: Three 5s and 10s timing policies across three full-stage grids
        env:
          V3_A2_NORMALIZED_FIXTURE: ${{ matrix.fixture }}
          V3_A2_NORMALIZED_DIR: ${{ runner.temp }}/a2-normalized-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-normalized-dt-v3.mjs
      - name: Archive complete simulations and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-normalized-dt-${{ matrix.fixture }}
          path: ${{ runner.temp }}/a2-normalized-${{ matrix.fixture }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Production build
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
