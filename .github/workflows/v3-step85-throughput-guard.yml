name: V3 Step85 true group throughput and zero-near-stop guard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step85ThroughputGuardV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step85-throughput-v3.mjs'
      - '.github/workflows/v3-step85-throughput-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-physical-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A85 strict zero-stop proposal proof and real 8 32 106 168 original swept physical tests
        env:
          V3_A2_STEP85_DIR: ${{ runner.temp }}/a85
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step85-throughput-v3.mjs
      - name: Protected Step84 original full body 16 case crossing consensus matrix
        env:
          V3_A2_STEP84_DIR: ${{ runner.temp }}/a84
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step84-crossing-consensus-v3.mjs
      - name: Protected Step78 32 five-abreast full 180s 87 three-second passes and exact replay
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protected Step76 full 180s 32 106 168 three-abreast 58 151 198 passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Publish physical throughput and preserved sporting benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a85-no-stop-true-full-body-physical-evidence
          path: |
            ${{ runner.temp }}/a85/*.json
            ${{ runner.temp }}/a84/*.json
            ${{ runner.temp }}/a78/*.json
            ${{ runner.temp }}/a76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
