name: V3 Step87 true full-field 180 second racing and parity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step87CorridorOrderV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step87-physical-parity-replay-v3.mjs'
      - '.github/workflows/v3-step87-sporting-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-mirrored-physics-and-complete-sport:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 16 full-field mirrored and renamed true physical checks plus original A64 8 32 full 180s and independent ≥3s pair passing observer
        env:
          V3_A2_STEP87_PARITY_DIR: ${{ runner.temp }}/a87parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step87-physical-parity-replay-v3.mjs
      - name: Protected Step86 32 five-wide double 180s 70 sustained overtakes and 678 physical lanes
        env:
          V3_A2_STEP86_PARITY_DIR: ${{ runner.temp }}/a86parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-physical-parity-replay-v3.mjs
      - name: Publish true Step87 full-race observer and exact 90 90 checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a87-actual-8-32-180-physical-mirror-and-overtakes
          path: |
            ${{ runner.temp }}/a87parity/*.json
            ${{ runner.temp }}/a86parity/*.json
          if-no-files-found: warn
          retention-days: 30
