name: Final German localization build gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-finalize-german-remaining-retry2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final German fixes
        run: |
          python .github/scripts/finalize_german_remaining_20260830.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/i18n/locales/sr-Latn/customizeTeam.json'); d=json.loads(p.read_text()); d['kitDesigner']['collar']='Kragna'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate locale structure and German semantics
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('src/i18n/locales'); ph=re.compile(r'\{\{[^{}]+\}\}')
          def check(a,b,path):
              assert type(a) is type(b),f'{path}: type mismatch'
              if isinstance(a,dict):
                  assert list(a)==list(b),f'{path}: key/order mismatch'
                  for k in a: check(a[k],b[k],f'{path}.{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b),f'{path}: length mismatch'
                  for i,(x,y) in enumerate(zip(a,b)): check(x,y,f'{path}[{i}]')
              elif isinstance(a,str): assert sorted(ph.findall(a))==sorted(ph.findall(b)),f'{path}: placeholders'
          en=sorted(p.name for p in (root/'en').glob('*.json')); assert en==sorted(p.name for p in (root/'de').glob('*.json'))
          for n in en: check(json.loads((root/'en'/n).read_text()),json.loads((root/'de'/n).read_text()),'de:'+n)
          for n in ['customizeTeam.json','developingTeam.json']: check(json.loads((root/'en'/n).read_text()),json.loads((root/'sr-Latn'/n).read_text()),'sr:'+n)
          bad=[r'\bJahreszeiten?\b',r'\bSchulungslager\b',r'\bPfadfinder(?:n|s)?\b',r'\bRassen?\b',r'\bReiter(?:in(?:nen)?|n|s)?\b',r'\bBühnen?\b',r'\bÜbertragungsgebühr\b',r'\bSignierbonus\b',r'\bHauptfach\b',r'\bVertragsglück\b',r'\bSaisonbeschäftigte\b',r'\bVermißt\b',r'Fahrrad-Vermächtnis',r'Ich unterschreibe',r'L 347 vom',r'Ich lege eine Bar',r'kostenlose Vermittlung von Agenten',r'Reiten als eins',r'Generika-Kit',r'Speicherkübel',r'Vierteljährlich']
          informal=re.compile(r'\b(?:du|dich|dir|dein|deine|deinen|deinem|deiner|deines)\b',re.I); cyr=re.compile(r'[\u0400-\u04ff]'); failures=[]
          def walk(x,path):
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,f'{path}.{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              elif isinstance(x,str):
                  if informal.search(x): failures.append(f'{path}: informal {x!r}')
                  if cyr.search(x): failures.append(f'{path}: Cyrillic {x!r}')
                  if any(re.search(p,x,re.I) for p in bad): failures.append(f'{path}: bad term {x!r}')
          for f in sorted((root/'de').glob('*.json')): walk(json.loads(f.read_text()),f.name)
          if failures: raise SystemExit('\n'.join(failures[:300]))
          print('German semantic and locale structure gate passed.')
          PY
      - name: Verify rendered hardcoded gaps are removed
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'src/components/layout/MainLayout.tsx':['                You will be logged out soon\n','            Stay logged in\n'],
            'src/components/team/RestartTeamModal.tsx':['                Confirm Team Restart\n','<div className="font-semibold text-gray-900">You will keep</div>','<div className="font-semibold text-gray-900">You will lose/reset</div>','setError(\'You must type RESTART exactly to confirm this action.\')'],
            'src/components/ui/KitDesigner.tsx':['>Kit name</label>','>Pattern</label>','>Sponsor text</label>','>Shirt number</label>','>Live preview</div>','setMessage(\'Team kits table not ready yet.'],
            'src/components/ui/JerseyPreview.tsx':['aria-label="Team jersey preview"'],
            'src/pages/dashboard/DevelopingTeam.tsx':['title="Unlock Developing Team in Preferences first."'],
          }
          failures=[]
          for f,needles in checks.items():
              text=Path(f).read_text()
              for n in needles:
                  if n in text: failures.append(f'{f}: {n!r}')
          if failures: raise SystemExit('Rendered hardcoded English remains:\n'+'\n'.join(failures))
          print('Rendered source localization gate passed.')
          PY
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit completed German localization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/MainLayout.tsx src/components/team/RestartTeamModal.tsx src/components/ui/KitDesigner.tsx src/components/ui/JerseyPreview.tsx src/pages/dashboard/DevelopingTeam.tsx src/i18n/locales/de/*.json src/i18n/locales/en/customizeTeam.json src/i18n/locales/sr-Latn/customizeTeam.json src/i18n/locales/en/developingTeam.json src/i18n/locales/sr-Latn/developingTeam.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Finish remaining German localization gaps'
          git pull --rebase origin main
          git push origin main
