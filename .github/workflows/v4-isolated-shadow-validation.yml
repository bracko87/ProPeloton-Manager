name: V4 isolated shadow validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v4/**'
      - 'src/race-engine-v4/**'
      - 'src/universal-race-engine/runRaceEngine.ts'
      - '.github/workflows/v4-isolated-shadow-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v4/**'
      - 'src/race-engine-v4/**'
      - 'src/universal-race-engine/runRaceEngine.ts'
      - '.github/workflows/v4-isolated-shadow-validation.yml'
permissions:
  contents: read
jobs:
  offline-shadow:
    name: Compile offline V4 shadow without production data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify strict zero-write shadow gate
        run: node --test scripts/v4/isolatedShadowGateV4.test.mjs
      - name: Validate read-only real-stage lock provenance and zero-write preflight
        run: node --test scripts/v4/realLockedStageEvidenceV4.test.mjs
      - name: Validate read-only real-stage capture and private shadow isolation
        run: node --test scripts/v4/privateReadOnlyLockedCaptureV4.test.mjs
      - name: Validate credential-free admin read-only SQL source export
        run: node --test scripts/v4/adminReadOnlyStageExportV4.test.mjs
      - name: Compile isolated calibrated V4 physical executable and reject invalid envelope
        run: node --test scripts/v4/isolatedShadowBuildV4.test.mjs
      - name: Check independent template planner (no simulation writes)
        run: npx esbuild src/race-engine-v4/templateFirstPlannerV4.test.ts --bundle --platform=node --format=esm --outfile=/tmp/v4-template-first-test.mjs && node /tmp/v4-template-first-test.mjs
      - name: Assert unchanged production worker source and stage routing
        run: node scripts/verify-mountain-pilot-worker-routing.mjs
