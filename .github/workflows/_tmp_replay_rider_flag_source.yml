name: Temporary replay rider flag source patch

on:
  push:
    paths:
      - '.github/workflows/_tmp_replay_rider_flag_source.yml'

permissions:
  contents: write

jobs:
  patch-replay-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure replay flags only use rider nationality
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RaceDetailPage.tsx')
          text = path.read_text()

          old = """        countryCode:\n          participantRider?.country_code ??\n          participantRider?.country_code_snapshot ??\n          rider.snapshot.countryCode,\n"""
          new = """        countryCode: participantRider?.country_code ?? null,\n"""
          if old not in text:
              raise SystemExit('road replay rider-country snippet not found')
          text = text.replace(old, new, 1)

          old_tt = """        countryCode:\n          firstMemberRow?.countryCode ??\n          participantRecord?.rider.country_code_snapshot ??\n          null,\n"""
          new_tt = """        countryCode:\n          firstMemberRow?.countryCode ??\n          participantRecord?.rider.country_code ??\n          null,\n"""
          if old_tt not in text:
              raise SystemExit('time trial rider-country fallback snippet not found')
          text = text.replace(old_tt, new_tt, 1)

          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/RaceDetailPage.tsx
          git commit -m "Use rider nationality only in race replay"
          git push origin HEAD:main
