name: Report Croatian Manual family wording

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-report-croatian-manual-family.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate Croatian Manual report
        run: |
          python .github/scripts/audit_croatian_manual_family_20260830.py > .github/croatian_manual_report.txt
          head -60 .github/croatian_manual_report.txt
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/croatian_manual_report.txt
          git commit -m 'Record Croatian Manual diagnostics'
          git pull --rebase origin main
          git push origin main
