name: V3 A2 Step32 600s sustained overtake validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-step32-duration-v3.mjs'
      - 'scripts/v3/a2ObservedEscapeV3.mjs'
      - 'scripts/v3/a2BoundedSlotEscapeV3.mjs'
      - 'scripts/v3/verify-a2-bounded-slot-v3.mjs'
      - 'scripts/v3/verify-a2-observed-escape-v3.mjs'
      - '.github/workflows/v3-a2-step32-duration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rival3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        riders: [4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing intent/physical-solver safety checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-claim-continuity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-observed-escape-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
      - name: Trace 400 480 600 second physical pass persistence and replay
        env:
          V3_A2_STEP32_DURATION_SIZE: ${{ matrix.riders }}
          V3_A2_STEP32_DURATION_DIR: ${{ runner.temp }}/step32-duration-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step32-duration-v3.mjs
      - name: Preserve full fixture trajectories and censoring classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-step32-duration-${{ matrix.riders }}
          path: ${{ runner.temp }}/step32-duration-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
