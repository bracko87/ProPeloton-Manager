name: Apply Serbian localization sweep

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-localization-sweep-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply localization codemod
        shell: bash
        run: |
          sed -i 's/export default function AssetsSection/export function AssetsSection/' .github/scripts/chatgpt_localization_sweep.py
          python .github/scripts/chatgpt_localization_sweep.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit localization changes
        shell: bash
        run: |
          if git diff --quiet -- src/pages/dashboard/Training.tsx src/pages/dashboard/infrastructure/AssetsSection.tsx src/i18n/locales/en/training.json src/i18n/locales/sr-Latn/training.json; then
            echo 'No localization changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/Training.tsx \
                  src/pages/dashboard/infrastructure/AssetsSection.tsx \
                  src/i18n/locales/en/training.json src/i18n/locales/sr-Latn/training.json
          git commit -m 'Localize training camps and infrastructure assets'
          git push origin HEAD:main
