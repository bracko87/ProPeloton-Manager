          replace(race_path, "aria-label={fullStandingModal === 'race' ? 'Full race standing' : 'Full stage standing'}", "aria-label={fullStandingModal === 'race' ? t('results.fullRaceStanding') : t('results.fullStageStanding')}")
          replace(race_path, "? 'General classification'", "? t('results.general')")
          replace(race_path, "? `Stage ${selectedStage.stage_number}`", "? t('stage.stageNumber', { stage: selectedStage.stage_number })")
          replace(race_path, ": 'Stage'}", ": t('stage.stage')}")
          replace(race_path, "{fullStandingModal === 'race' ? 'Full race standing' : 'Full stage standing'}", "{fullStandingModal === 'race' ? t('results.fullRaceStanding') : t('results.fullStageStanding')}")

          print('Localization source/resource patch complete.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit localization sweep
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/Staff.tsx \
                  src/pages/dashboard/Training.tsx \
                  src/pages/dashboard/infrastructure/AssetsSection.tsx \
                  src/features/squad/components/RiderStatisticsSection.tsx \
                  src/features/squad/components/TeamStatisticsSection.tsx \
                  src/pages/dashboard/RaceDetailPage.tsx \
                  src/i18n/locales/en/staff.json src/i18n/locales/sr-Latn/staff.json \
                  src/i18n/locales/en/training.json src/i18n/locales/sr-Latn/training.json \
                  src/i18n/locales/en/statistics.json src/i18n/locales/sr-Latn/statistics.json \
                  src/i18n/locales/en/raceDetail.json src/i18n/locales/sr-Latn/raceDetail.json
          git commit -m 'Localize staff training assets statistics and race detail'
          git push origin HEAD:main
