name: Apply Serbian localization sweep

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-localization-sweep-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply localization codemod
        run: python .github/scripts/chatgpt_localization_sweep.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit localization changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No localization changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/Staff.tsx \
                  src/features/squad/components/RiderStatisticsSection.tsx \
                  src/features/squad/components/TeamStatisticsSection.tsx \
                  src/pages/dashboard/RaceDetailPage.tsx \
                  src/i18n/locales/en/staff.json src/i18n/locales/sr-Latn/staff.json \
                  src/i18n/locales/en/statistics.json src/i18n/locales/sr-Latn/statistics.json \
                  src/i18n/locales/en/raceDetail.json src/i18n/locales/sr-Latn/raceDetail.json
          git commit -m 'Localize staff statistics and race detail leftovers'
          git push origin HEAD:main
