name: V3 A2 targeted yielding sustained mobility comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-targeted-stress-v3.mjs'
      - 'scripts/v3/compare-a2-targeted-stress-v3.mjs'
      - '.github/workflows/v3-a2-targeted-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        riders: [12, 24, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline, candidate and canonical 2D micro invariants
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-targeted-yield-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Symmetric 90-tick reference
        env:
          V3_A2_STRESS_RIDERS: ${{ matrix.riders }}
          V3_A2_STRESS_DIR: ${{ runner.temp }}/symmetric-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-simultaneous-stress-v3.mjs
      - name: Targeted 90-tick counterfactual
        env:
          V3_A2_STRESS_RIDERS: ${{ matrix.riders }}
          V3_A2_TARGETED_DIR: ${{ runner.temp }}/targeted-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-targeted-stress-v3.mjs
      - name: Reconcile mobility and sporting acceptance signals
        env:
          V3_A2_STRESS_RIDERS: ${{ matrix.riders }}
          V3_A2_STRESS_DIR: ${{ runner.temp }}/symmetric-${{ matrix.riders }}
          V3_A2_TARGETED_DIR: ${{ runner.temp }}/targeted-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/compare-a2-targeted-stress-v3.mjs
      - name: Archive all evidence even if candidate is unsafe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-targeted-comparison-${{ matrix.riders }}
          path: |
            ${{ runner.temp }}/symmetric-${{ matrix.riders }}/*.json
            ${{ runner.temp }}/targeted-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: App build regression
        if: matrix.riders == 12
        run: npm ci --no-audit --no-fund && npm run build
