name: Apply Race Sharpness rider-card layout fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-race-sharpness-ui-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-race-sharpness-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted Race Preparation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RacePreparation.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'className={`shrink-0 text-xs font-semibold ${getRaceSharpnessInlineClass(sharpness.badge_tone)}`}',
              'className={`max-w-full text-right text-xs font-semibold leading-4 whitespace-normal break-words ${getRaceSharpnessInlineClass(sharpness.badge_tone)}`}',
          )
          text = text.replace(
              'Race Sharpness: {percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}',
              '{percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}',
          )
          text = text.replace(
              'className="mt-1 flex items-center justify-between gap-3 text-xs text-slate-500"',
              'className="mt-1 flex min-w-0 flex-wrap items-start justify-between gap-x-3 gap-y-1 text-xs text-slate-500"',
          )
          text = text.replace(
              '<span>{racePrepText("screen.role")}: {localizeRacePrepBackendText(option.assigned_role ?? "—")}</span>',
              '<span className="min-w-0 flex-1 break-words">{racePrepText("screen.role")}: {localizeRacePrepBackendText(option.assigned_role ?? "—")}</span>',
          )

          required = [
              'max-w-full text-right text-xs font-semibold leading-4 whitespace-normal break-words',
              '{percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}',
              'flex min-w-0 flex-wrap items-start justify-between gap-x-3 gap-y-1',
              'className="min-w-0 flex-1 break-words">{racePrepText("screen.role")}',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Expected patched tokens missing: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/RacePreparation.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Race Sharpness UI changes to commit.'
            exit 0
          fi
          git commit -m 'Fix Race Sharpness rider card layout'
          git pull --rebase origin main
          git push origin main
