name: One-off Race Sharpness UI fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-fix-race-sharpness-ui-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Race Preparation sharpness layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RacePreparation.tsx')
          text = path.read_text(encoding='utf-8')

          old_inline = '''    <span
              className={`shrink-0 text-xs font-semibold ${getRaceSharpnessInlineClass(sharpness.badge_tone)}`}
            >
              Race Sharpness: {percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}
            </span>'''
          if old_inline not in text:
              old_inline = '''    <span
      className={`shrink-0 text-xs font-semibold ${getRaceSharpnessInlineClass(sharpness.badge_tone)}`}
    >
      Race Sharpness: {percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}
    </span>'''

          new_inline = '''    <span
      className={`max-w-full text-right text-xs font-semibold leading-4 whitespace-normal break-words ${getRaceSharpnessInlineClass(sharpness.badge_tone)}`}
      title={`Race Sharpness: ${percent}/100 · ${localizeRacePrepBackendText(sharpness.race_sharpness_label)}`}
    >
      {percent}/100 · {localizeRacePrepBackendText(sharpness.race_sharpness_label)}
    </span>'''

          old_row = '''            <div className="mt-1 flex items-center justify-between gap-3 text-xs text-slate-500">
              <span>{racePrepText("screen.role")}: {localizeRacePrepBackendText(option.assigned_role ?? "—")}</span>
              <RaceSharpnessInlineText sharpness={raceSharpness} />
            </div>'''
          new_row = '''            <div className="mt-1 flex min-w-0 flex-wrap items-start justify-between gap-x-3 gap-y-1 text-xs text-slate-500">
              <span className="min-w-0 flex-1 break-words">{racePrepText("screen.role")}: {localizeRacePrepBackendText(option.assigned_role ?? "—")}</span>
              <RaceSharpnessInlineText sharpness={raceSharpness} />
            </div>'''

          if text.count(old_inline) != 1:
              raise SystemExit(f'Expected one RaceSharpnessInlineText block, found {text.count(old_inline)}')
          if text.count(old_row) != 1:
              raise SystemExit(f'Expected one rider role/sharpness row, found {text.count(old_row)}')

          text = text.replace(old_inline, new_inline, 1)
          text = text.replace(old_row, new_row, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit UI fix
        run: |
          git config user.name ChatGPT
          git config user.email actions@users.noreply.github.com
          git add src/pages/dashboard/RacePreparation.tsx
          git diff --cached --check
          git commit -m "Fix Race Sharpness rider card layout"
          git push origin main
