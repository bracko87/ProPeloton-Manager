name: V3 Step88 full 180s coupled row sporting and large five-wide audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step88CoupledRowFlowV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step88-physical-parity-replay-v3.mjs'
      - 'scripts/v3/verify-a2-step88-large-full-v3.mjs'
      - '.github/workflows/v3-step88-full-180-sporting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-a64-8-32-sporting-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step88 16 real mirrored/renamed full-body fields plus complete 8/32 180s independent ≥3s passing and exact physical observer replay
        env:
          V3_A2_STEP88_PARITY_DIR: ${{ runner.temp }}/a88parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step88-physical-parity-replay-v3.mjs
      - name: Preserve Step86 full 32 five-wide staged and double 180s verified sport
        env:
          V3_A2_STEP86_PARITY_DIR: ${{ runner.temp }}/a86parity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-physical-parity-replay-v3.mjs
      - name: Upload truthfully accepted and rejected original physical sporting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a88-8-32-full-racing-and-identity-evidence
          path: |
            ${{ runner.temp }}/a88parity/*.json
            ${{ runner.temp }}/a86parity/*.json
          retention-days: 30
          if-no-files-found: warn
  true-a64-106-168-full-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step88 eight 106 and 168 five-wide actual 180s complete attempts, full A64 collision road and W-prime authority
        env:
          V3_A2_STEP88_LARGE_DIR: ${{ runner.temp }}/a88large
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step88-large-full-v3.mjs
      - name: Upload honest first rejected contact or true 180s full finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a88-106-168-full-180-true-a64-collisions
          path: ${{ runner.temp }}/a88large/*.json
          retention-days: 30
          if-no-files-found: warn
