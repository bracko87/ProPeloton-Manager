name: V3 legacy isolation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'scripts/v3/**'
      - '.github/workflows/v3-legacy-isolation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'scripts/v3/**'
      - '.github/workflows/v3-legacy-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy production cannot import unfinished V3 modules
        run: node scripts/v3/verify-legacy-isolation.mjs
      - name: Verify fail-closed isolation test
        run: node scripts/v3/verify-legacy-isolation.test.mjs
      - name: Validate V3 research-only physical groups and route completeness
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-route-and-groups-v3.mjs

      - name: Verify checkpointed V3 synthetic physics
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-physical-race-engine-v3.mjs
      - name: Verify attack retirement after physical catch and deterministic checkpoints
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-breakaway-catch-lifecycle-v3.mjs
      - name: Verify physical former-attack catch and checkpoint life cycle
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-physical-attack-lifecycle-v3.mjs
      - name: Verify isolated physically grounded cooperative pursuit bounds
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-cooperative-pursuit-v3.mjs
      - name: Shadow-check cooperation against frozen 106-rider historical replay
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-cooperative-pursuit-real-roster-v3.mjs
      - name: Verify frozen 106-rider Dordrecht calculation without official writes
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-dordrecht-real-roster-v3.mjs > /tmp/v3-dordrecht-audit.json
      - name: Verify frozen 168-rider Guangxi mountain calculation without official writes
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-guangxi-real-roster-v3.mjs > /tmp/v3-guangxi-audit.json
      - name: Validate authoritative saved group lineage across both 106- and 168-rider race checkpoints
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-authoritative-group-checkpoints-v3.mjs
      - name: Verify continuous B1 group identity, finishers and real-roster replay lineage
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-physical-group-timeline-v3.mjs
      - name: Validate route-relative wind exposure without invented bearings
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-wind-exposure-v3.mjs
      - name: Compare frozen flat and mountain research results across wind assumptions
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/report-calibration-sensitivity-v3.mjs > /tmp/v3-sensitivity-audit.json
      - name: Verify continuous research-only slipstream response and bounded attack following
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-slipstream-response-candidate-v3.mjs
      - name: Verify bounded collective power and energy-paid attack response
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-pack-power-v3.mjs
      - name: Audit power candidate on both frozen rosters in shadow only
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-pack-power-real-roster-v3.mjs > /tmp/v3-power-shadow-audit.json
      - name: Verify source input completeness, research-only power mapping and repeated attack reserve
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-rider-power-adapter-v3.mjs
      - name: Audit power input completeness across frozen 106- and 168-rider research races
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-rider-power-source-coverage-v3.mjs > /tmp/v3-power-source-coverage.json
      - name: Verify explicitly gated offline power motion, attacks and checkpoint replay
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-offline-power-v3.mjs
      - name: Confirm Guangxi proxy-only mountain stress remains sporting unapproved
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-guangxi-synthetic-power-v3.mjs > /tmp/v3-guangxi-power-unapproved.json
      - name: Fail closed on incomplete operator-only original-source rider fixture
        run: node --disable-warning=ExperimentalWarning scripts/v3/verify-private-energy-fixture-contract-v3.mjs
      - name: Verify real source-covered mountain still fails incomplete elevation-geometry gate
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-third-stage-source-quality-v3.mjs
      - name: Record known endurance threshold physics discontinuity without approving racing
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-exhaustion-cliff-v3.mjs > /tmp/v3-energy-threshold-no-go.json
      - name: Verify continuous low-energy physical power and prevent 13 percent speed cliff
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-fatigue-continuity-v3.mjs
      - name: Verify opt-in neutral start formation, control-path invariance and resumed groups
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-neutral-start-formation-v3.mjs
      - name: Audit research-only physical finish clusters under hypothesized start grids
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-neutral-start-grid-v3.mjs > /tmp/v3-synthetic-neutral-start-no-go.json
      - name: Audit explicitly hypothetical Guangxi four-abreast grid (sporting NO-GO)
        run: V3_EXPERIMENTAL_START_GRID=4x2 node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-guangxi-synthetic-power-v3.mjs > /tmp/v3-guangxi-start-grid-research.json
      - name: Verify independent wheel-following, passing and spatial drafting exposure
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-spatial-motion-v3.mjs
      - name: Stress-test physical wheel clearance at 106 and 168 riders
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/stress-spatial-motion-v3.mjs
      - name: Verify offline spatial full-race calculations and checkpoint resumption
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-spatial-offline-full-v3.mjs
      - name: Flag uncalibrated Dordrecht positional race outcomes as research only
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-spatial-peloton-v3.mjs > /tmp/v3-spatial-research-no-go.json
      - name: Type-check V3 research modules
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict --allowImportingTsExtensions --target ES2022 --module nodenext --moduleResolution nodenext src/race-engine-v3/physicalRaceEngineV3.ts src/race-engine-v3/physicalGroupsV3.ts src/race-engine-v3/physicalGroupTimelineV3.ts src/race-engine-v3/routeFidelityV3.ts src/race-engine-v3/windExposureV3.ts src/race-engine-v3/slipstreamResponseCandidateV3.ts src/race-engine-v3/physicalAttackLifecycleV3.ts src/race-engine-v3/cooperativePursuitV3.ts src/race-engine-v3/pelotonPowerBalanceV3.ts src/race-engine-v3/riderPowerAdapterV3.ts src/race-engine-v3/experimentalPowerRaceV3.ts src/race-engine-v3/fatiguePowerEnvelopeV3.ts src/race-engine-v3/neutralStartFormationV3.ts src/race-engine-v3/pelotonSpatialMotionV3.ts
