name: V3 Milestone A complete 2D stage gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/coupled2DMicroV3.mjs'
      - 'scripts/v3/verify-batch43-complete-stage-v3.mjs'
      - 'scripts/v3/audit-batch43-complete-stage-v3.mjs'
      - '.github/workflows/v3-milestone-a-complete-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Micro-peloton collision and recovery regression
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
      - name: Exactly interpolated finish-line regression
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Three complete 2D races, precise classifications and restarts
        env:
          V3_MILESTONE_A_FIXTURE: ${{ matrix.fixture }}
          V3_MILESTONE_A_DIR: ${{ runner.temp }}/milestone-a-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch43-complete-stage-v3.mjs
      - name: Retain complete rider-level, gap and checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-milestone-a-full-${{ matrix.fixture }}
          path: ${{ runner.temp }}/milestone-a-${{ matrix.fixture }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Production application build (not V3 activation)
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
