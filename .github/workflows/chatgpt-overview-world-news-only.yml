name: Make Overview news world-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-overview-world-news-only.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Overview news board world-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          overview_path = Path('src/pages/dashboard/Overview.tsx')
          text = overview_path.read_text(encoding='utf-8')

          old_candidates = '''  const candidates: OverviewNewsSortableItem[] = [
            ...teamItems,
            ...worldItems,
          ].map((item, sourceOrder) => ({'''
          new_candidates = '''  // The Overview news board is intentionally world-only. Team alerts and
          // club activity stay in Attention/Notifications and are not mixed into this feed.
          void teamItems;
          const candidates: OverviewNewsSortableItem[] = [
            ...worldItems,
          ].map((item, sourceOrder) => ({'''

          if text.count(old_candidates) != 1:
              raise SystemExit(f'Expected exactly one news candidate block, found {text.count(old_candidates)}')
          text = text.replace(old_candidates, new_candidates, 1)

          old_doc = '''/**
           * NewsCommandCenter
           * Newsletter-style panel. Team news combines alerts and activity feed; world news uses game/news data.
           */'''
          new_doc = '''/**
           * NewsCommandCenter
           * World-peloton news panel. Team alerts/activity are deliberately excluded from this board.
           */'''
          if old_doc in text:
              text = text.replace(old_doc, new_doc, 1)

          overview_path.write_text(text, encoding='utf-8')

          translations = {
              'en': {
                  'boardSubtitle': 'Latest in-game world news. Click a row for more details.',
                  'noNewsSubtitle': 'Race results, rankings and other world-peloton news will appear here.',
              },
              'de': {
                  'boardSubtitle': 'Die neuesten Nachrichten aus der Spielwelt. Klicke auf eine Zeile für weitere Details.',
                  'noNewsSubtitle': 'Rennergebnisse, Ranglisten und weitere Nachrichten aus dem Welt-Peloton erscheinen hier.',
              },
              'es': {
                  'boardSubtitle': 'Las últimas noticias del mundo del juego. Haz clic en una fila para ver más detalles.',
                  'noNewsSubtitle': 'Aquí aparecerán resultados de carreras, clasificaciones y otras noticias del pelotón mundial.',
              },
              'fr': {
                  'boardSubtitle': 'Les dernières nouvelles du monde du jeu. Cliquez sur une ligne pour plus de détails.',
                  'noNewsSubtitle': 'Les résultats de course, classements et autres nouvelles du peloton mondial apparaîtront ici.',
              },
              'hr': {
                  'boardSubtitle': 'Najnovije vijesti iz svijeta igre. Kliknite na red za više detalja.',
                  'noNewsSubtitle': 'Ovdje će se prikazivati rezultati utrka, vijesti s rang-lista i druge vijesti iz svjetskog pelotona.',
              },
              'it': {
                  'boardSubtitle': 'Le ultime notizie dal mondo di gioco. Fai clic su una riga per maggiori dettagli.',
                  'noNewsSubtitle': 'Qui compariranno risultati delle gare, classifiche e altre notizie dal gruppo mondiale.',
              },
              'ru': {
                  'boardSubtitle': 'Последние новости игрового мира. Нажмите на строку, чтобы увидеть подробности.',
                  'noNewsSubtitle': 'Здесь будут появляться результаты гонок, рейтинги и другие новости мирового пелотона.',
              },
              'sr-Latn': {
                  'boardSubtitle': 'Najnovije vesti iz sveta igre. Kliknite na red za više detalja.',
                  'noNewsSubtitle': 'Ovde će se prikazivati rezultati trka, vesti sa rang-lista i druge vesti iz svetskog pelotona.',
              },
          }

          for locale, values in translations.items():
              path = Path(f'src/i18n/locales/{locale}/overview.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              if 'news' not in data or not isinstance(data['news'], dict):
                  raise SystemExit(f'Missing news object in {path}')
              data['news']['boardSubtitle'] = values['boardSubtitle']
              data['news']['noNewsSubtitle'] = values['noNewsSubtitle']
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify Overview no longer mixes team items into board
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/pages/dashboard/Overview.tsx').read_text(encoding='utf-8')
          marker = '''const candidates: OverviewNewsSortableItem[] = [
            ...worldItems,
          ].map'''
          if marker not in text:
              raise SystemExit('World-only news candidate marker missing')
          if '...teamItems,\n    ...worldItems,' in text:
              raise SystemExit('Team/world mixed candidate block still present')
          print('Overview news board is world-only.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push world-only Overview news
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/Overview.tsx src/i18n/locales/*/overview.json
          if git diff --cached --quiet; then
            echo 'No Overview news changes to commit.'
            exit 0
          fi
          git commit -m 'Make Overview news board world-only'
          git pull --rebase origin main
          git push origin main
