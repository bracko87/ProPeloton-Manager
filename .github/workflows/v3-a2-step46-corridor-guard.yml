name: V3 A2 Step46 follower corridor guard (offline sporting gate)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2CollisionPriorityResearchV3.mjs'
      - 'scripts/v3/a2SubstepPhysicalResearchV3.mjs'
      - 'scripts/v3/verify-a2-step46-corridor-guard-v3.mjs'
      - '.github/workflows/v3-a2-step46-corridor-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 800 matched time-grid trials plus ID and mirror fairness cases
        env:
          V3_A2_STEP46_DIR: ${{ runner.temp }}/step46
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step46-corridor-guard-v3.mjs
      - name: Preserve individual 160 scenario regressions and fallbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step46-corridor-results
          path: ${{ runner.temp }}/step46/*.json
          retention-days: 30
          if-no-files-found: warn
  prior-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prior A45 and A44 A43 A42 A41 A40 A39 collision and energy gates
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step45-fallback-fixtures-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step44-priority-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step43-trapezoid-trial-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step42-fixed-quantum-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step41-canonical-mirror-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step40-normalized-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step39-fairness-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Production application build
        run: npm ci --no-audit --no-fund && npm run build
