name: V3 Step71 two-slot bicycle-body pinch research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2LaneCapacityPlannerV3.mjs'
      - 'scripts/v3/a2NormalStartPelotonV3.mjs'
      - 'scripts/v3/verify-a2-step71-two-slot-stagger-v3.mjs'
      - '.github/workflows/v3-step71-two-slot-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-slot-physical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'A71 2-slot 32/106/168 bicycle-width swept, mirror, ID, energy, checkpoint and impossible-row tests'
        env:
          V3_A2_STEP71_DIR: ${{ runner.temp }}/step71
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step71-two-slot-stagger-v3.mjs
      - name: Save A71 stagger physical safety and first failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step71-bicycle-wide-two-slot
          path: ${{ runner.temp }}/step71/*.json
          retention-days: 30
          if-no-files-found: warn
