name: V4 fast mountain winner-finish replay forensic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v4/terrainDistanceWorkforceV4.test.mjs'
      - 'src/race-engine-v4/privateHistoricalDiagnosticsV4.mjs'
      - 'src/race-engine-v4/finishTransitionV4.ts'
      - 'src/race-engine-v4/mountainWinnerLineageAuditV4.mjs'
      - 'src/race-engine-v4/mountainWinnerLineageAuditV4.test.mjs'
      - 'src/race-engine-v4/mountainWinnerDetachmentCandidateV4.mjs'
      - 'src/race-engine-v4/mountainWinnerDetachmentCandidateV4.test.mjs'
      - 'src/race-engine-v4/mountainPostCatchTransferAuditV4.mjs'
      - 'src/race-engine-v4/mountainPostCatchTransferAuditV4.test.mjs'
      - 'scripts/v4/mountainChaseSplitResearchPatchV4.mjs'
      - 'scripts/v4/mountainChaseSplitResearchPatchV4.test.mjs'
      - 'scripts/v4/mountainChaseContactResearchPatchV4.mjs'
      - 'scripts/v4/mountainFrontCodeCollisionPatchV4.mjs'
      - 'scripts/v4/mountainFrontCodeCollisionPatchV4.test.mjs'
      - 'src/race-engine-v4/mountainChaseContactCohesionV4.mjs'
      - 'src/race-engine-v4/mountainChaseContactCohesionV4.test.mjs'
      - 'scripts/v4/finishTransitionResearchPatchV4.mjs'
      - '.github/workflows/v4-mountain-finish-forensic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-flat-mountain-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compare optional V4 candidate across 120 and 220 km flat and mountain scenarios
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  targeted-mountain-seed-2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify provenance- and tolerance-guarded contact cohesion helper
        run: node src/race-engine-v4/mountainChaseContactCohesionV4.test.mjs
      - name: Check front-label collision patch anchor without altering physical group models
        run: node scripts/v4/mountainFrontCodeCollisionPatchV4.test.mjs
      - name: Check both known mountain split failures with untouched strict validator
        env:
          V4_MOUNTAIN_WINNER_FORENSIC: '1'
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_TARGET_SEED: '2'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  full-contact-cohesion-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require 192 of 192 strict V4 replays with research-only chase contact correction
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-200km-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Diagnose 200 km mountain V4 replay exclusions with strict validation intact
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_STRESS_200_ONLY: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-eight-seed-replay-realism-first-half:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate 48 mountain replays for seeds 0-3 (one half of 96)
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '0'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-controlled-human-200km-seed5-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Trace physical chasing groups for controlled 200 km seed 5 no-chase replay issue
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '4'
          V4_MOUNTAIN_HUMAN_ATTACK_CONTROL: '1'
          V4_MOUNTAIN_HUMAN_ATTACK_FORENSIC: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-controlled-human-chase-middle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compare one vs three explicit human chasers in 24 independently validated mountain replays
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '4'
          V4_MOUNTAIN_HUMAN_ATTACK_CONTROL: '1'
          V4_MOUNTAIN_HUMAN_CHASE_MIDDLE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-controlled-human-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compare human attack initiators and zero-versus-five chasers on 24 mountain cases
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '4'
          V4_MOUNTAIN_HUMAN_ATTACK_CONTROL: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-opening-forensic-no-chase:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit nonlaunching mountain seeds 4-7, zero human chasing, unchanged physical solver
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '4'
          V4_MOUNTAIN_OPENING_FORENSIC: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-eight-seed-replay-realism-second-half:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate 48 mountain replays for seeds 4-7 (one half of 96)
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
          V4_MOUNTAIN_REALISM_EIGHT_SEEDS: '1'
          V4_MOUNTAIN_STRESS_SEED_OFFSET: '4'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  mountain-distance-breakaway-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run 170 200 240 km V4 mountain breakaway and chase simulations with strict replays
        env:
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
          V4_MOUNTAIN_CONTACT_COHESION_CANDIDATE: '1'
          V4_MOUNTAIN_FRONT_CODE_COLLISION_CANDIDATE: '1'
          V4_MOUNTAIN_DISTANCE_STRESS: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
  isolated-mountain-220-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test rider-membership lineage audit on synthetic groups
        run: node src/race-engine-v4/mountainWinnerLineageAuditV4.test.mjs
      - name: Test measured C-group split patch is tightly anchored
        run: node scripts/v4/mountainChaseSplitResearchPatchV4.test.mjs
      - name: Test C-to-C provenance on synthetic groups
        run: node src/race-engine-v4/mountainPostCatchTransferAuditV4.test.mjs
      - name: Test physical detachment consolidation candidate on synthetic groups
        run: node src/race-engine-v4/mountainWinnerDetachmentCandidateV4.test.mjs
      - name: Forensic 220 km mountain with 0 1 3 5 chasing riders and unchanged replay validator
        env:
          V4_MOUNTAIN_WINNER_FORENSIC: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
      - name: Evaluate OPTIONAL V4 detachment candidate with original strict replay
        env:
          V4_MOUNTAIN_WINNER_FORENSIC: '1'
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
      - name: Evaluate V4 measured C-to-C physical splits without validator relaxation
        env:
          V4_MOUNTAIN_WINNER_FORENSIC: '1'
          V4_MOUNTAIN_WINNER_COALESCE_CANDIDATE: '1'
          V4_MOUNTAIN_C_SPLIT_CANDIDATE: '1'
        run: node scripts/v4/terrainDistanceWorkforceV4.test.mjs
