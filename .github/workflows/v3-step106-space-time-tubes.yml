name: V3 Step106 conflict-directed original A64 space-time tubes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step106PhysicalSpaceTimeTubesV3.mjs'
      - 'scripts/v3/verify-a2-step106-*.mjs'
      - '.github/workflows/v3-step106-space-time-tubes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-original-a64-micro-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conditional collision graph, physical resweep, exact replay and 8s group
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step106-micro-v3.mjs
  original-106-168-physical-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eight 106/168 actual A64 6-12s conflict-directed tube witnesses
        env:
          V3_A2_STEP106_DIR: ${{ runner.temp }}/step106
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step106-large-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step106-a64-conflict-directed-space-time-evidence
          path: ${{ runner.temp }}/step106/*.json
          if-no-files-found: error
  protect-original-step86-and-eight-second-peloton:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eight-second race group breakaway and reunion rules
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - name: Step86 physically safe 32-rider full 180-second baseline
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  production-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
