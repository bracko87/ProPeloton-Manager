name: V3 Step86 106 168 five-abreast complete 180 second attempts
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/verify-a2-step86-large-full-v3.mjs'
      - '.github/workflows/v3-step86-106-168-full-180.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  large-peloton-full-attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all eight 106 and 168 five-abreast real physical 180s attempts through both gates, preserving first rejection
        env:
          V3_A2_STEP86_LARGE_DIR: ${{ runner.temp }}/a86large
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-large-full-v3.mjs
      - name: Upload truthful 106 168 full-horizon passes or rejected swept evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a86-large-106-168-five-abreast-180s-honest-results
          path: ${{ runner.temp }}/a86large/*.json
          if-no-files-found: warn
          retention-days: 30
