name: V3 Batch 40 road-width corridor lookahead
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/roadWidthLookaheadV3.mjs'
      - 'scripts/v3/verify-batch40-road-width-v3.mjs'
      - 'scripts/v3/audit-batch40-road-corridors-v3.mjs'
      - '.github/workflows/v3-batch40-road-width.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calibration envelopes, nonclairvoyant forecast, swept collision and checkpoint safety
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch40-road-width-v3.mjs
      - name: Full research control and bounded multi-profile lateral experiments
        env:
          V3_BATCH40_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH40_MODE: ${{ matrix.mode }}
          V3_BATCH40_OUT_DIR: ${{ runner.temp }}/batch40-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch40-road-corridors-v3.mjs
      - name: Retain full profiles and rider-level contextual results
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch40-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch40-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify production application build
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
