name: Build Staff Advisory game-month release

on:
  push:
    branches:
      - chatgpt/staff-advisory-game-month-release
    paths:
      - '.github/workflows/chatgpt-staff-advisory-game-month-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/staff-advisory-game-month-release
          fetch-depth: 0

      - name: Apply verified Staff Advisory files
        shell: bash
        run: |
          source_sha='8ea36649315660456462cc6b97f81b77a38f301e'
          git cat-file -e "$source_sha^{commit}"
          git show "$source_sha:src/pages/dashboard/Overview.tsx" > src/pages/dashboard/Overview.tsx
          git show "$source_sha:src/i18n/locales/en/overview.json" > src/i18n/locales/en/overview.json
          git show "$source_sha:src/i18n/locales/sr-Latn/overview.json" > src/i18n/locales/sr-Latn/overview.json

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/i18n/locales/en/overview.json' \
            'src/i18n/locales/sr-Latn/overview.json' \
            'src/pages/dashboard/Overview.tsx' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify release assertions
        shell: bash
        run: |
          grep -q 'staff_advisory_get_overview_v2' src/pages/dashboard/Overview.tsx
          grep -q 'staff_advisory_quote_v2' src/pages/dashboard/Overview.tsx
          grep -q 'staff_advisory_get_role_renewal_quote_v2' src/pages/dashboard/Overview.tsx
          grep -q 'duration_game_months' src/pages/dashboard/Overview.tsx
          grep -q 'remaining_game_seconds' src/pages/dashboard/Overview.tsx
          grep -q 'proposed_remaining_paid_game_seconds' src/pages/dashboard/Overview.tsx
          grep -q '"withTitle": "With Staff Advisory — 5 coins / 1 in-game month"' src/i18n/locales/en/overview.json
          grep -q '"withTitle": "Sa Staff Advisory uslugom — 5 novčića / 1 mesec u igri"' src/i18n/locales/sr-Latn/overview.json
          ! grep -q '30 real-life days' src/pages/dashboard/Overview.tsx
          ! grep -q 'duration_real_days' src/pages/dashboard/Overview.tsx
          git diff --check

      - name: Commit release patch
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-staff-advisory-game-month-release.yml
          git add src/pages/dashboard/Overview.tsx src/i18n/locales/en/overview.json src/i18n/locales/sr-Latn/overview.json
          git commit -m 'Use in-game months for Staff Advisory access'
          git push origin HEAD:chatgpt/staff-advisory-game-month-release
