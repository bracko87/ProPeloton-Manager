name: ChatGPT Flat Scenario V1 validate
on:
  push:
    branches: [chatgpt-flat-scenario-v1-20260913]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync branch
        run: git pull --ff-only origin chatgpt-flat-scenario-v1-20260913
      - name: Integrate Flat Scenario V1 into production input adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scenario = Path('src/universal-race-engine/flatScenarioV1.ts')
          text = scenario.read_text()
          text = text.replace("attackDensity:.86, aggressiveTeamCount:.0 as never, breakawayQuality:.62", "attackDensity:.86, breakawayQuality:.62")
          text = text.replace("const selectionSeed=`${input.engine.deterministicSeed}:${input.stage.stageId}:${FLAT_SCENARIO_CATALOG_VERSION}`", "const selectionSeed=`flat-scenario:${input.race.raceId}:${input.stage.stageId}:${FLAT_SCENARIO_CATALOG_VERSION}`")
          old = """  const selected=selectTemplate(context,selectionSeed)\n  if(!selected) return {input,audit:null}\n  const parameters=instantiateTemplate(selected.template,selectionSeed)"""
          new = """  const persistedTemplateId=(options.history ?? []).find((entry)=>entry.stageId===input.stage.stageId)?.templateId ?? null\n  const selected=persistedTemplateId ? (()=>{\n    const template=FLAT_SCENARIO_TEMPLATES_V1.find((entry)=>entry.id===persistedTemplateId)\n    if(!template) return null\n    const scores=scoreFlatScenarioTemplatesV1(context)\n    const selectedScore=scores.find((entry)=>entry.templateId===template.id) ?? {templateId:template.id,family:template.family,rawScore:rawTemplateScore(template,context),repetitionPenalty:0,finalScore:rawTemplateScore(template,context),excluded:false,exclusionReason:null}\n    return {template,selectedScore,scores,repeatAllowedRace:true,repeatAllowedDay:true}\n  })() : selectTemplate(context,selectionSeed)\n  if(!selected) return {input,audit:null}\n  const parameters=instantiateTemplate(selected.template,selectionSeed)"""
          assert text.count(old) == 1, f'persisted selection hook count={text.count(old)}'
          text = text.replace(old,new)
          scenario.write_text(text)

          path = Path('src/universal-race-engine/buildProductionRaceInput.ts')
          text = path.read_text()
          import_anchor = """} from './runRaceEngine.ts'\n\ntype Row = Record<string, unknown>"""
          import_replacement = """} from './runRaceEngine.ts'\nimport {\n  applyFlatScenarioV1,\n  type FlatScenarioHistoryEntryV1,\n} from './flatScenarioV1.ts'\n\ntype Row = Record<string, unknown>"""
          assert text.count(import_anchor) == 1, f'import anchor count={text.count(import_anchor)}'
          text = text.replace(import_anchor,import_replacement)

          interface_anchor = """  readonly phase9Payload?: ProductionPhase9Payload | null\n  readonly deterministicSeed: string\n}"""
          interface_replacement = """  readonly phase9Payload?: ProductionPhase9Payload | null\n  readonly scenarioHistory?: readonly FlatScenarioHistoryEntryV1[]\n  readonly deterministicSeed: string\n}"""
          assert text.count(interface_anchor) == 1, f'interface anchor count={text.count(interface_anchor)}'
          text = text.replace(interface_anchor,interface_replacement)

          return_anchor = """  return {\n    engine: { engineKey: PPM_UNIVERSAL_RACE_ENGINE_KEY, engineVersion: PPM_UNIVERSAL_RACE_ENGINE_VERSION, deterministicSeed: sources.deterministicSeed },"""
          return_replacement = """  const baseInput: UniversalRaceEngineInput = {\n    engine: { engineKey: PPM_UNIVERSAL_RACE_ENGINE_KEY, engineVersion: PPM_UNIVERSAL_RACE_ENGINE_VERSION, deterministicSeed: sources.deterministicSeed },"""
          assert text.count(return_anchor) == 1, f'return anchor count={text.count(return_anchor)}'
          text = text.replace(return_anchor,return_replacement)

          tail_anchor = """    preStageStandings: normalizePreStageStandings(\n      sources.preStageStandings,\n      acceptedRiderIds,\n      acceptedTeamIds,\n    ),\n  }\n}"""
          tail_replacement = """    preStageStandings: normalizePreStageStandings(\n      sources.preStageStandings,\n      acceptedRiderIds,\n      acceptedTeamIds,\n    ),\n  }\n\n  return applyFlatScenarioV1(baseInput, {\n    gameDate: text(stage.stage_date ?? race.start_date),\n    phaseCommandRows: sources.phaseCommandRows as readonly Row[],\n    history: sources.scenarioHistory ?? [],\n  }).input\n}"""
          assert text.count(tail_anchor) == 1, f'tail anchor count={text.count(tail_anchor)}'
          text = text.replace(tail_anchor,tail_replacement)
          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile scenario and production adapter
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/universal-race-engine/flatScenarioV1.ts --bundle --platform=node --format=esm --outfile=/tmp/flatScenarioV1.mjs
          npx esbuild src/universal-race-engine/buildProductionRaceInput.ts --bundle --platform=node --format=esm --outfile=/tmp/buildProductionRaceInput.mjs
      - name: Run deterministic scenario smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { applyFlatScenarioV1, FLAT_SCENARIO_TEMPLATES_V1 } from '/tmp/flatScenarioV1.mjs'
          if (FLAT_SCENARIO_TEMPLATES_V1.length !== 20) throw new Error(`expected 20 templates, got ${FLAT_SCENARIO_TEMPLATES_V1.length}`)
          const teams = Array.from({length:10},(_,teamIndex)=>({
            teamId:`t${teamIndex+1}`,teamTactic:'balanced',status:'locked',locked:true,defaulted:true,metadata:{},
            riders:Array.from({length:6},(_,riderIndex)=>({
              riderId:`t${teamIndex+1}r${riderIndex+1}`,stageRole:riderIndex===0?'lead_out_rider':'free_role',
              commands:{phase1:'follow_team_plan',phase2:'follow_team_plan',phase3:'follow_team_plan',phase4:'follow_team_plan'},
              equipmentSelection:null,supplySelection:null,
            }))
          }))
          const riders=teams.flatMap((team,teamIndex)=>team.riders.map((plan,riderIndex)=>({
            riderId:plan.riderId,teamId:team.teamId,sprint:55+((teamIndex+riderIndex)%35),flat:65+((teamIndex*2+riderIndex)%25),endurance:62+((teamIndex+riderIndex*3)%25),resistance:60+((teamIndex*3+riderIndex)%25),raceIQ:60+((teamIndex+riderIndex)%28),overall:62+((teamIndex*2+riderIndex)%24),teamwork:60+((teamIndex+riderIndex*2)%30),fatigueBeforeStage:18+((teamIndex+riderIndex)%20),snapshot:{displayName:plan.riderId}
          })))
          const input={
            engine:{deterministicSeed:'run-specific-seed',engineKey:'test',engineVersion:'test'},
            race:{raceId:'race-1',raceType:'stage_race',stageCount:5},
            stage:{raceId:'race-1',stageId:'stage-2',stageNumber:2,stageFormat:'road_race',terrainType:'flat',profileType:'flat',finishType:'flat_finish',sprintZoneKm:3,distanceKm:165,elevationGainM:450,summitFinish:false,terrainPercentages:{flat:91,hilly:9,mountain:0,cobbled:0},profilePoints:[],timeTrialRules:null},
            points:[],teams:teams.map(t=>({teamId:t.teamId,snapshot:{teamName:t.teamId}})),riders,stagePlans:teams,
            weather:{windKmh:13,rainProbabilityPct:15,crosswindRisk:'low',condition:'dry'},preparation:{},incidentModel:{enabled:true},preStageLeaders:null,preStageStandings:[]
          }
          const first=applyFlatScenarioV1(input,{gameDate:'2026-09-13',phaseCommandRows:[],history:[]})
          const second=applyFlatScenarioV1({...input,engine:{...input.engine,deterministicSeed:'different-run-retry'}},{gameDate:'2026-09-13',phaseCommandRows:[],history:[]})
          if(!first.audit) throw new Error('flat scenario was not selected')
          if(first.audit.templateId!==second.audit?.templateId) throw new Error('stage scenario changed across retry seed')
          if(['flat_15_crosswind_echelons','flat_16_crosswind_then_regroup'].includes(first.audit.templateId)) throw new Error('crosswind template selected on low-crosswind stage')
          const history=[{raceId:'race-1',stageId:'stage-1',gameDate:'2026-09-12',templateId:first.audit.templateId,family:first.audit.templateFamily,status:'completed'}]
          const antiRepeat=applyFlatScenarioV1(input,{gameDate:'2026-09-13',phaseCommandRows:[],history})
          if(antiRepeat.audit?.templateId===first.audit.templateId) throw new Error('same-race exact template was not avoided')
          const explicitRider='t1r1'
          const explicitInput=JSON.parse(JSON.stringify(input))
          explicitInput.stagePlans[0].riders[0].commands.phase1='attack'
          const explicit=applyFlatScenarioV1(explicitInput,{gameDate:'2026-09-13',phaseCommandRows:[{rider_id:explicitRider,team_id:'t1',phase_1_command:'attack'}],history:[]})
          const explicitPlan=explicit.input.stagePlans.flatMap(p=>p.riders).find(r=>r.riderId===explicitRider)
          if(explicitPlan?.commands.phase1!=='attack') throw new Error('explicit phase command was overwritten')
          const persistedHistory=[{raceId:'race-1',stageId:'stage-2',gameDate:'2026-09-13',templateId:first.audit.templateId,family:first.audit.templateFamily,status:'reserved'}]
          const persisted=applyFlatScenarioV1({...input,engine:{...input.engine,deterministicSeed:'third-run'}},{gameDate:'2026-09-13',phaseCommandRows:[],history:persistedHistory})
          if(persisted.audit?.templateId!==first.audit.templateId) throw new Error('persisted stage reservation was not reused')
          console.log(JSON.stringify({template:first.audit.templateId,syntheticCommands:first.audit.appliedDirectives.syntheticCommands,antiRepeat:antiRepeat.audit?.templateId},null,2))
          NODE
      - name: Production build
        run: npm run build
      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c "id:'flat_" src/universal-race-engine/flatScenarioV1.ts)" -ge 18
          grep -q "flat_01_controlled_double_break" src/universal-race-engine/flatScenarioV1.ts
          grep -q "flat_20_tactical_standoff" src/universal-race-engine/flatScenarioV1.ts
          grep -q "applyFlatScenarioV1(baseInput" src/universal-race-engine/buildProductionRaceInput.ts
          ! grep -q "Math.random" src/universal-race-engine/flatScenarioV1.ts
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/universal-race-engine/flatScenarioV1.ts src/universal-race-engine/buildProductionRaceInput.ts
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'Integrate deterministic flat scenario templates'
            git push origin HEAD:chatgpt-flat-scenario-v1-20260913
          fi
