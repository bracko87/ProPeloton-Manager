name: ChatGPT Phase 2 chase eligibility

on:
  push:
    branches:
      - chatgpt-phase2-chase-eligibility-20260911
    paths:
      - .github/workflows/chatgpt-phase2-chase-eligibility-20260911.yml

permissions:
  contents: write

jobs:
  patch-validate-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-phase2-chase-eligibility-20260911
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin chatgpt-phase2-chase-eligibility-20260911

      - name: Apply Phase 2 chase eligibility fix and regression tests
        shell: python
        run: |
          from pathlib import Path
          import re

          engine_path = Path('src/universal-race-engine/runRaceEngine.ts')
          text = engine_path.read_text()

          old_build = "phase11k-v5-4-selective-finish-fallback-2026-09-11"
          new_build = "phase11l-v5-5-late-chase-eligibility-2026-09-11"
          if text.count(old_build) != 1:
              raise SystemExit(f'Expected one Phase 1 build marker, found {text.count(old_build)}')
          text = text.replace(old_build, new_build, 1)

          phase3_old = """  const explicitPhase3ChasingTeamIds = Array.from(
            new Set(
              phase3Rows
                .filter(({ row, phase }) =>
                  !physicalEscapeTeamIds.has(row.teamId) &&
                  phase.behaviour === 'chase',
                )
                .map(({ row }) => row.teamId),
            ),
          ).sort()
          const phase3GcThreatTeamIds = getGcThreatChasingTeamIds(
            input,
            physicalEscapeRiderIds,
          ).filter((teamId) => !physicalEscapeTeamIds.has(teamId))
          const physicalChasingTeamIds = Array.from(
            new Set([...explicitPhase3ChasingTeamIds, ...phase3GcThreatTeamIds]),
          ).sort()
          """
          if phase3_old not in text:
              raise SystemExit('Phase 3 chasing-team block did not match current source')
          phase3_new = """  const explicitPhase3ChasingTeamIds = Array.from(
            new Set(
              phase3Rows
                .filter(({ row, phase }) =>
                  !physicalEscapeTeamIds.has(row.teamId) &&
                  phase.resolvedSource === 'explicit_individual_command' &&
                  phase.behaviour === 'chase',
                )
                .map(({ row }) => row.teamId),
            ),
          ).sort()
          const phase3AutomaticFinishInterestTeamIds =
            getAutomaticLateFinishInterestTeamIds(
              input,
              riderSuitability,
              roadCommandResolution,
              physicalEscapeRiderIds,
            ).filter((teamId) => !physicalEscapeTeamIds.has(teamId))
          const physicalChasingTeamIds = Array.from(
            new Set([
              ...explicitPhase3ChasingTeamIds,
              ...phase3AutomaticFinishInterestTeamIds,
            ]),
          ).sort()
          """
          text = text.replace(phase3_old, phase3_new, 1)

          helper_anchor = "export function resolveRoadPhase3Decisive(\n"
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'Expected one Phase 3 resolver anchor, found {text.count(helper_anchor)}')
          helper = r'''/**
           * Automatic late chase eligibility is intentionally team-selective.
           *
           * A saved role fallback such as helper_domestique -> chase_breakaway
           * is an available worker instruction, not proof that every team has a
           * sporting reason to drive the peloton. Automatic participation is
           * therefore restricted to a small deterministic stage-result cohort,
           * a small sprint-interest cohort on sprint-oriented stages, genuine GC
           * threat teams, explicit Phase-4 finish objectives, and teams that
           * deliberately assigned a breakaway_chaser role. Explicit chase
           * commands are handled separately and always remain authoritative.
           */
          function getAutomaticLateFinishInterestTeamIds(
            input: UniversalRaceEngineInput,
            riderSuitability: readonly UniversalRiderSuitabilityResult[],
            roadCommandResolution: UniversalRoadCommandResolutionSummary,
            escapeRiderIds: readonly string[],
          ): readonly string[] {
            const escapeRiderSet = new Set(escapeRiderIds)
            const escapeTeamIds = new Set(
              roadCommandResolution.riders
                .filter((row) => escapeRiderSet.has(row.riderId))
                .map((row) => row.teamId),
            )
            const eligibleRows = roadCommandResolution.riders.filter(
              (row) => row.eligibleToStart && !escapeTeamIds.has(row.teamId),
            )
            const eligibleByRiderId = new Map(
              eligibleRows.map((row) => [row.riderId, row] as const),
            )
            const eligibleTeamIds = deduplicateSorted(
              eligibleRows.map((row) => row.teamId),
            )
            if (eligibleTeamIds.length === 0) return []

            const automaticInterestLimit = Math.min(
              eligibleTeamIds.length,
              Math.max(2, Math.min(5, Math.round(Math.sqrt(eligibleTeamIds.length)))),
            )
            const rankedSuitability = [...riderSuitability].sort(
              (left, right) =>
                left.rank - right.rank || left.riderId.localeCompare(right.riderId),
            )
            const selectBestTeams = (
              accepts: (row: UniversalRoadRiderCommandResolution) => boolean,
            ): string[] => {
              const selected: string[] = []
              const seen = new Set<string>()
              for (const suitability of rankedSuitability) {
                const row = eligibleByRiderId.get(suitability.riderId)
                if (!row || !accepts(row) || seen.has(row.teamId)) continue
                seen.add(row.teamId)
                selected.push(row.teamId)
                if (selected.length >= automaticInterestLimit) break
              }
              return selected
            }

            const stageResultTeamIds = selectBestTeams(() => true)
            const sprintOrientedStage =
              input.stage.terrainType === 'flat' ||
              input.stage.finishType === 'flat_finish' ||
              (input.stage.profileType ?? '').toLowerCase().includes('sprinter')
            const sprintInterestTeamIds = sprintOrientedStage
              ? selectBestTeams((row) => row.stageRole === 'sprinter')
              : []
            const gcThreatTeamIds = getGcThreatChasingTeamIds(
              input,
              escapeRiderIds,
            ).filter((teamId) => !escapeTeamIds.has(teamId))
            const explicitFinishObjectiveTeamIds = eligibleRows
              .filter((row) => {
                const phase = row.phases.find((entry) => entry.phaseNumber === 4)!
                return (
                  phase.resolvedSource === 'explicit_individual_command' &&
                  (
                    phase.behaviour === 'stage_result' ||
                    phase.behaviour === 'time_gc_result' ||
                    phase.behaviour === 'sprint_preparation' ||
                    phase.behaviour === 'lead_out'
                  )
                )
              })
              .map((row) => row.teamId)
            const declaredChaserTeamIds = eligibleRows
              .filter((row) => row.stageRole === 'breakaway_chaser')
              .map((row) => row.teamId)

            return deduplicateSorted([
              ...stageResultTeamIds,
              ...sprintInterestTeamIds,
              ...gcThreatTeamIds,
              ...explicitFinishObjectiveTeamIds,
              ...declaredChaserTeamIds,
            ])
          }

          '''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          phase4_pattern = re.compile(
              r"  const teamsWithFinishInterest = new Set\(\n"
              r"    roadCommandResolution\.riders\n"
              r"      \.filter\(\(row\) => row\.eligibleToStart && !escapeSet\.has\(row\.riderId\)\)\n"
              r"      \.filter\(\(row\) => \{\n"
              r"        const phase = row\.phases\.find\(\(entry\) => entry\.phaseNumber === 4\)!\n"
              r"        return \(\n"
              r"          row\.stageRole === 'sprinter' \|\|\n"
              r"          row\.stageRole === 'team_leader_gc' \|\|\n"
              r"          row\.stageRole === 'protected_rider' \|\|\n"
              r"          phase\.behaviour === 'stage_result' \|\|\n"
              r"          phase\.behaviour === 'time_gc_result' \|\|\n"
              r"          phase\.behaviour === 'sprint_preparation'\n"
              r"        \)\n"
              r"      \}\)\n"
              r"      \.map\(\(row\) => row\.teamId\),\n"
              r"  \)"
          )
          replacement = """  const teamsWithFinishInterest = new Set(
            getAutomaticLateFinishInterestTeamIds(
              input,
              riderSuitability,
              roadCommandResolution,
              physicalFrontRiderIdsAtStart,
            ),
          )"""
          text, count = phase4_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one broad Phase 4 finish-interest block, replaced {count}')

          if text.count("phase.resolvedSource === 'explicit_individual_command' &&\n                  phase.behaviour === 'chase'") != 1:
              raise SystemExit('Phase 3 explicit chase source guard was not installed exactly once')
          if text.count('getAutomaticLateFinishInterestTeamIds(') != 3:
              raise SystemExit('Expected helper definition plus Phase 3 and Phase 4 calls')
          engine_path.write_text(text)

          test_path = Path('src/universal-race-engine/runRaceEngine.test.ts')
          tests = test_path.read_text()
          tests = tests.replace(
              "it('publishes the Phase 11J V5.3 physical-gap-lineage build marker', () => {",
              "it('publishes the Phase 11L V5.5 late-chase-eligibility build marker', () => {",
              1,
          )
          tests = tests.replace(
              "'phase11j-v5-3-physical-gap-lineage-2026-09-08',",
              "'phase11l-v5-5-late-chase-eligibility-2026-09-11',",
              1,
          )

          test_anchor = "  it('does not promote a Phase 3 race-control team into the physical chase', () => {\n"
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'Expected one chase regression test anchor, found {tests.count(test_anchor)}')
          new_tests = r'''  it('limits role-default late chasing to a small automatic finish-interest cohort', () => {
            const base = createExpandedFieldInput(90)
            const openingAttackerId = 'expanded-rider-05'
            const input: UniversalRaceEngineInput = {
              ...base,
              engine: {
                ...base.engine,
                deterministicSeed: 'phase11l-role-default-chase-cohort',
              },
              stagePlans: base.stagePlans.map((plan) => ({
                ...plan,
                teamTactic: 'balanced',
                riders: plan.riders.map((riderPlan) => ({
                  ...riderPlan,
                  stageRole:
                    riderPlan.riderId === openingAttackerId
                      ? 'breakaway_rider'
                      : riderPlan.stageRole === 'sprinter'
                        ? 'sprinter'
                        : 'helper_domestique',
                  commands: {
                    phase1:
                      riderPlan.riderId === openingAttackerId
                        ? 'attack'
                        : 'follow_team_plan',
                    phase2: 'follow_team_plan',
                    phase3: 'follow_team_plan',
                    phase4: 'follow_team_plan',
                  },
                })),
              })),
              riders: base.riders.map((rider) =>
                rider.riderId === openingAttackerId
                  ? {
                      ...rider,
                      flat: 96,
                      endurance: 96,
                      resistance: 96,
                      raceIQ: 96,
                      teamwork: 96,
                      morale: 100,
                      raceSharpness: 100,
                      fatigueBeforeStage: 0,
                    }
                  : rider,
              ),
            }

            const result = runRaceEngine(input)
            const phase3 = result.roadRaceResolution.phase3Decisive!
            const phase4 = result.roadRaceResolution.phase4Finish!

            expect(phase3.physicalEscapeRiderIdsAtStart.length).toBeGreaterThan(0)
            expect(phase3.physicalChasingTeamIds.length).toBeGreaterThan(0)
            expect(phase3.physicalChasingTeamIds.length).toBeLessThan(input.teams.length)
            expect(phase4.automaticChasingTeamIds.length).toBeLessThan(input.teams.length)
            expect(result.replaySynchronization.synchronized).toBe(true)
          })

          it('keeps an explicit Phase 3 chase command authoritative outside the automatic interest cohort', () => {
            const base = createExpandedFieldInput(90)
            const openingAttackerId = 'expanded-rider-05'
            const explicitTeamId = base.teams.at(-1)!.teamId
            const input: UniversalRaceEngineInput = {
              ...base,
              engine: {
                ...base.engine,
                deterministicSeed: 'phase11l-explicit-chase-authoritative',
              },
              stagePlans: base.stagePlans.map((plan) => ({
                ...plan,
                teamTactic: 'balanced',
                riders: plan.riders.map((riderPlan, riderIndex) => ({
                  ...riderPlan,
                  stageRole:
                    riderPlan.riderId === openingAttackerId
                      ? 'breakaway_rider'
                      : 'helper_domestique',
                  commands: {
                    phase1:
                      riderPlan.riderId === openingAttackerId
                        ? 'attack'
                        : 'follow_team_plan',
                    phase2: 'follow_team_plan',
                    phase3:
                      plan.teamId === explicitTeamId && riderIndex === 0
                        ? 'chase_breakaway'
                        : 'follow_team_plan',
                    phase4: 'follow_team_plan',
                  },
                })),
              })),
              riders: base.riders.map((rider) =>
                rider.riderId === openingAttackerId
                  ? {
                      ...rider,
                      flat: 96,
                      endurance: 96,
                      resistance: 96,
                      raceIQ: 96,
                      teamwork: 96,
                      morale: 100,
                      raceSharpness: 100,
                      fatigueBeforeStage: 0,
                    }
                  : rider,
              ),
            }

            const result = runRaceEngine(input)
            expect(
              result.roadRaceResolution.phase3Decisive!.physicalChasingTeamIds,
            ).toContain(explicitTeamId)
            expect(result.replaySynchronization.synchronized).toBe(true)
          })


          '''
          tests = tests.replace(test_anchor, new_tests + test_anchor, 1)
          test_path.write_text(tests)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run targeted deterministic race regressions
        run: |
          npm install --no-save --package-lock=false vitest@3.2.4
          npx vitest run src/universal-race-engine/runRaceEngine.test.ts -t "Phase 11L V5.5|limits role-default late chasing|keeps an explicit Phase 3 chase|does not promote a Phase 3 race-control|does not let Phase 3 race-control|keeps the automatic late chase|makes flat, hilly, medium-mountain and hard-summit profiles|keeps finish commentary locked"

      - name: Commit validated engine and regression tests
        run: |
          rm .github/workflows/chatgpt-phase2-chase-eligibility-20260911.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/universal-race-engine/runRaceEngine.ts src/universal-race-engine/runRaceEngine.test.ts .github/workflows/chatgpt-phase2-chase-eligibility-20260911.yml
          git commit -m "Restrict automatic late chase eligibility"
          ENGINE_SHA=$(git rev-parse HEAD)
          echo "ENGINE_SHA=$ENGINE_SHA" >> "$GITHUB_ENV"

      - name: Pin race runner to validated Phase 2 engine
        shell: python
        run: |
          from pathlib import Path
          import os

          path = Path('supabase/functions/universal-race-stage-runner/index.ts')
          text = path.read_text()
          old = 'ee143a20cd74b7fe371ede346aca2b1583dc3306'
          new = os.environ['ENGINE_SHA']
          if text.count(old) != 4:
              raise SystemExit(f'Expected exactly four Phase 1 source pins, found {text.count(old)}')
          text = text.replace(old, new)
          if text.count(new) != 4 or old in text:
              raise SystemExit('Phase 2 source pin replacement did not complete cleanly')
          if text.count('90fc6ce06197f4537b6088d30252b60025f39253') < 4:
              raise SystemExit('Emergency V5.2 fallback pin changed unexpectedly')
          if f'const SOURCE_COMMIT = "{new}";' not in text:
              raise SystemExit('SOURCE_COMMIT does not match validated Phase 2 engine')
          path.write_text(text)

      - name: Commit runner pin and push
        run: |
          git add supabase/functions/universal-race-stage-runner/index.ts
          git commit -m "Pin race runner to Phase 2 chase eligibility engine"
          git pull --rebase origin chatgpt-phase2-chase-eligibility-20260911
          git push origin HEAD:chatgpt-phase2-chase-eligibility-20260911
