name: One-shot Race Detail localization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-race-detail-localization.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply direct react-i18next cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RaceDetailPage.tsx')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, minimum: int = 1) -> None:
              global text
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'Expected at least {minimum} occurrence(s), found {count}: {old[:120]!r}')
              text = text.replace(old, new)
              print(f'replaced {count}: {old[:80]!r}')

          # Weather / terrain presentation.
          replace(
          '''      <div className="mt-1 leading-6">
                  This is only a warning before the lock point. The final cancellation decision is made automatically 24 in-game hours before stage start.
                </div>''',
          '''      <div className="mt-1 leading-6">
                  {t('stage.weatherCancellationExplanation')}
                </div>'''
          )

          replace(
          '''function TerrainBars({ stage }: { stage: RaceStage }) {
            const rows = [
              ['Flat', stage.flat_pct],
              ['Hilly', stage.hilly_pct],
              ['Mountain', stage.mountain_pct],
              ['Cobbled', stage.cobbled_pct],
            ] as const''',
          '''function TerrainBars({ stage }: { stage: RaceStage }) {
            const { t } = useTranslation('raceDetail')
            const rows = [
              [t('stage.flat'), stage.flat_pct],
              [t('stage.hilly'), stage.hilly_pct],
              [t('stage.mountain'), stage.mountain_pct],
              [t('stage.cobbled'), stage.cobbled_pct],
            ] as const'''
          )

          # Reward totals panel.
          replace('''return <div className="text-sm text-slate-500">Loading rewards…</div>''', '''return <div className="text-sm text-slate-500">{t('rewards.loading')}</div>''')
          replace('''return <div className="text-sm text-slate-500">No reward data available.</div>''', '''return <div className="text-sm text-slate-500">{t('rewards.noData')}</div>''')
          replace('''          Select which race reward table to view.''', '''          {t('rewards.select')}''')
          replace('''<th className="px-4 py-3 text-left">Team</th>''', '''<th className="px-4 py-3 text-left">{t('results.team')}</th>''', 2)
          replace('''<th className="px-4 py-3 text-left">Rider</th>''', '''<th className="px-4 py-3 text-left">{t('results.rider')}</th>''')
          replace('''<th className="px-4 py-3 text-right">Prize</th>''', '''<th className="px-4 py-3 text-right">{t('rewards.prize')}</th>''')
          replace('''<th className="px-4 py-3 text-right">Points</th>''', '''<th className="px-4 py-3 text-right">{t('rewards.points')}</th>''', 2)

          # Race report.
          replace('''            Compact race commentary and final road groups.''', '''            {t('report.description')}''')
          replace('''          Loading race report…''', '''          {t('report.loading')}''')
          replace('''          No race report available for this stage yet.''', '''          {t('report.none')}''')
          replace('''              <div>Km</div>''', '''              <div>{t('report.km')}</div>''')
          replace('''              <div>Commentary</div>''', '''              <div>{t('report.commentary')}</div>''')
          replace('''                Road groups''', '''                {t('report.roadGroups')}''')
          replace('''                Final race situation from the replay engine.''', '''                {t('report.roadGroupsDescription')}''')
          replace('''                No road group data available yet.''', '''                {t('report.noGroups')}''')
          replace(''': 'Riders —'}''', ''': t('report.ridersUnknown')}''')

          # Favorites and participants.
          replace('''              Calculated from rider skills, this season results, race profile and assigned role.''', '''              {t('participants.favoritesDescription')}''')
          replace("favorite.rider_name?.trim() || 'Unknown rider'", "favorite.rider_name?.trim() || t('participants.unknownRider')")
          replace("favorite.team_name?.trim() || 'Team'", "favorite.team_name?.trim() || t('participants.teamFallback')")
          replace("startNumber ? `#${startNumber}` : 'No #'", "startNumber ? `#${startNumber}` : t('participants.noNumber')")
          replace('''        Loading accepted teams and riders...''', '''        {t('participants.loading')}''')
          replace('''        Could not load participants: {error}''', '''        {t('participants.loadError', { error })}''')
          replace(
          '''        No accepted teams have been confirmed yet. Accepted teams will appear here once
                  the official startlist is published.''',
          '''        {t('participants.noneConfirmed')}'''
          )
          replace('''        {displayTeams.length} teams · {assignedRiderTotal} assigned riders''', '''        {t('participants.teamRiderCount', { teams: displayTeams.length, riders: assignedRiderTotal })}''')
          replace('''                        {assignedRidersCount} assigned riders''', '''                        {t('participants.assignedRiders', { count: assignedRidersCount })}''')
          replace('''{rider.age_snapshot ? <span>{rider.age_snapshot} yrs</span> : null}''', '''{rider.age_snapshot ? <span>{t('participants.age', { age: rider.age_snapshot })}</span> : null}''')
          replace("                          : 'No riders assigned yet.'}", "                          : t('participants.noRiders')}")

          # Pending application card.
          replace('''        Loading your application estimate…''', '''        {t('application.pendingLoading')}''')
          replace('''        Your application is submitted. The detailed acceptance estimate could not be loaded: {error}''', '''        {t('application.pendingEstimateError', { error })}''')
          replace('''        Your application is submitted. Official participants will appear here once the team list is published.''', '''        {t('application.pendingNoQuote')}''')
          replace('''            Application submitted''', '''            {t('status.applicationSubmitted')}''')
          replace('''            Waiting for team selection''', '''            {t('application.waitingSelection')}''')
          replace(
          '''            Official participants are not confirmed yet. Accepted teams and riders will replace this
                    estimate once the team list is published.''',
          '''            {t('application.waitingDescription')}'''
          )
          replace('''          <div className="text-xs font-semibold text-slate-500">Estimated chance</div>''', '''          <div className="text-xs font-semibold text-slate-500">{t('application.estimatedChance')}</div>''')
          replace("quote.chance_label ?? 'Application estimate'", "quote.chance_label ?? t('application.applicationEstimate')")
          replace('''          <div className="text-xs text-slate-500">Already accepted</div>''', '''          <div className="text-xs text-slate-500">{t('application.alreadyAcceptedCount')}</div>''')
          replace('''          <div className="text-xs text-slate-500">Target / max teams</div>''', '''          <div className="text-xs text-slate-500">{t('application.targetMaxTeams')}</div>''')

          # Race information / results hub.
          replace("{t('results.team')}s & riders", "{t('participants.teamsRiders')}")
          replace('''                    Current tour standings''', '''                    {t('results.currentStandings')}''')
          replace('''                    <option value="stage_general">Stage result</option>''', '''                    <option value="stage_general">{t('results.stageResult')}</option>''')
          replace('''            title="Prize money and international points"''', '''            title={t('rewards.title')}''')
          replace('''            description="Prize money, team points, and rider points generated by the race engine."''', '''            description={t('rewards.description')}''')

          # Replay access card.
          replace(
          '''      setCoinPurchaseMessage(
                  `Replay unlocked for ${nextAccess?.coin_cost ?? 2} coins.`
                )''',
          '''      setCoinPurchaseMessage(
                  t('replay.unlocked', { coins: nextAccess?.coin_cost ?? 2 })
                )'''
          )
          replace("          : 'Failed to unlock this race replay.'", "          : t('replay.unlockFailed')")
          replace(
          '''  const replayStatusText = stageWeatherCanceled
              ? 'This stage was canceled. No replay is available.'
              : replayAvailability.status === 'not_open'
                ? 'Replay will be available at the scheduled stage time.'
                : replayAvailability.status === 'not_available'
                  ? 'Replay is not available yet.'
                  : replayAvailability.status === 'error'
                    ? 'Replay is temporarily unavailable.'
                    : userParticipated
                      ? `Replay is available for ${race?.name ?? 'this race'}.`
                      : hasCoinReplayUnlock
                        ? `Replay is available for ${race?.name ?? 'this race'}.`
                        : `Replay is available. Teams that did not participate can unlock it for ${coinAccess?.coin_cost ?? 2} coins.`''',
          '''  const replayStatusText = stageWeatherCanceled
              ? t('replay.stageCanceledDescription')
              : replayAvailability.status === 'not_open'
                ? t('replay.notOpen')
                : replayAvailability.status === 'not_available'
                  ? t('replay.notAvailable')
                  : replayAvailability.status === 'error'
                    ? t('replay.temporaryUnavailable')
                    : userParticipated
                      ? t('replay.availableForRace', { race: race?.name ?? '—' })
                      : hasCoinReplayUnlock
                        ? t('replay.availableForRace', { race: race?.name ?? '—' })
                        : t('replay.unlockDescription', { coins: coinAccess?.coin_cost ?? 2 })'''
          )
          replace('''        Live race''', '''        {t('replay.liveRace')}''')
          replace(
          '''        {stageWeatherCanceled
                  ? 'Stage canceled'
                  : replayAvailable
                    ? 'Replay available'
                    : 'Replay unavailable'}''',
          '''        {stageWeatherCanceled
                  ? t('replay.stageCanceled')
                  : replayAvailable
                    ? t('replay.available')
                    : t('replay.unavailable')}'''
          )
          replace('''          Replay available at the scheduled stage time: {replayAvailability.replayOpensGameAt}''', '''          {t('replay.availableAt', { date: replayAvailability.replayOpensGameAt })}''')
          replace("              ? 'Unlocking replay…'", "              ? t('replay.unlocking')")
          replace("              : `Unlock replay · ${coinAccess?.coin_cost ?? 2} coins`", "              : t('replay.unlockReplay', { coins: coinAccess?.coin_cost ?? 2 })")
          replace('''            Coin balance: {Number(coinAccess?.coin_balance ?? 0).toLocaleString('en-US')}''', '''            {t('replay.coinBalance', { balance: Number(coinAccess?.coin_balance ?? 0).toLocaleString() })}''')
          replace("          ? 'Replay unavailable'", "          ? t('replay.unavailable')", 2)
          replace("            ? 'Checking replay…'", "            ? t('replay.checking')")
          replace("                  ? `Unlock for ${coinAccess?.coin_cost ?? 2} coins`", "                  ? t('replay.unlockFor', { coins: coinAccess?.coin_cost ?? 2 })")
          replace("                  : 'Replay unavailable'}", "                  : t('replay.unavailable')}")

          # Replay point panel and stage profile empty state.
          replace('''            Rankings and cumulative awards appear when each point is reached.''', '''            {t('replay.stagePointsDescription')}''')
          replace('''          {t('stage.profile')} data is not available yet.''', '''          {t('stage.profileUnavailable')}''')

          # Application preview helper in the main page component.
          replace("    if (!quote) return 'Loading application preview…'", "    if (!quote) return t('application.loadingPreview')")
          replace("      return 'Your team is already accepted for this race.'", "      return t('application.alreadyAccepted')")
          replace("      return 'Your team already has an application submitted for this race.'", "      return t('application.alreadyApplied')")
          replace("      return quote.message ?? 'You cannot apply for this race right now.'", "      return quote.message ?? t('application.cannotApply')")
          replace("    return 'Review your application preview before submitting.'", "    return t('application.review')")
          replace("      returnLabel: '← Back',", "      returnLabel: t('page.back'),")
          replace('''          {humanizeCode(stage.terrain_type)} · {formatKm(stage.distance_km)}''', '''          {TERRAIN_TRANSLATION_KEYS[stage.terrain_type]
                    ? t(TERRAIN_TRANSLATION_KEYS[stage.terrain_type])
                    : humanizeCode(stage.terrain_type)} · {formatKm(stage.distance_km)}''')

          # Application modal labels. These occur in components that already own `t`.
          replace('''<div className="text-xs text-slate-500">Applied teams</div>''', '''<div className="text-xs text-slate-500">{t('application.appliedTeams')}</div>''', 2)
          replace('''<div className="text-xs text-slate-500">Accepted teams</div>''', '''<div className="text-xs text-slate-500">{t('application.acceptedTeams')}</div>''')
          replace('''<div className="text-xs text-slate-500">Target teams</div>''', '''<div className="text-xs text-slate-500">{t('application.targetTeams')}</div>''')
          replace('''<div className="text-xs text-slate-500">Max teams</div>''', '''<div className="text-xs text-slate-500">{t('application.maxTeams')}</div>''')
          replace('''<div className="text-xs text-slate-500">Riders required</div>''', '''<div className="text-xs text-slate-500">{t('application.ridersRequired')}</div>''')
          replace('''<div className="text-xs text-slate-500">Team list announcement</div>''', '''<div className="text-xs text-slate-500">{t('application.teamListAnnouncement')}</div>''')
          replace('''<div className="text-xs text-slate-500">Rider deadline</div>''', '''<div className="text-xs text-slate-500">{t('application.riderDeadline')}</div>''')
          replace('''                Not now''', '''                {t('application.notNow')}''')

          # Tutorial overlay: retain tutorial progress keys, render text from raceDetail resources.
          replace(
          '''          title={raceDetailTutorialSteps[tutorialStepIndex].title}
                    body={raceDetailTutorialSteps[tutorialStepIndex].body}
                    stepLabel={`Race profile tutorial ${tutorialStepIndex + 1} of ${
                      raceDetailTutorialSteps.length
                    }`}
                    primaryAction={
                      raceDetailTutorialSteps[tutorialStepIndex].primaryAction ?? 'Next'
                    }
                    secondaryAction={
                      tutorialStepIndex === raceDetailTutorialSteps.length - 1
                        ? raceDetailTutorialSteps[tutorialStepIndex].secondaryAction
                        : 'Skip tutorial'
                    }''',
          '''          title={t(tutorialStepIndex === 0 ? 'tutorial.profileTitle' : 'tutorial.stagesTitle')}
                    body={t(tutorialStepIndex === 0 ? 'tutorial.profileBody' : 'tutorial.stagesBody')}
                    stepLabel={t('tutorial.step', {
                      current: tutorialStepIndex + 1,
                      total: raceDetailTutorialSteps.length,
                    })}
                    primaryAction={
                      tutorialStepIndex === raceDetailTutorialSteps.length - 1
                        ? t('tutorial.continuePreparation')
                        : t('tutorial.next')
                    }
                    secondaryAction={
                      tutorialStepIndex === raceDetailTutorialSteps.length - 1
                        ? t('tutorial.finish')
                        : t('tutorial.skip')
                    }'''
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit localized Race Detail page
        shell: bash
        run: |
          if git diff --quiet -- src/pages/dashboard/RaceDetailPage.tsx; then
            echo 'No Race Detail changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/RaceDetailPage.tsx
          git commit -m 'Finish direct Race Detail localization pass'
          git push origin HEAD:main
