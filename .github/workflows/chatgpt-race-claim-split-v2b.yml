name: ChatGPT Race Claim Split V2B

on:
  push:
    branches:
      - chatgpt-race-claim-split-v2-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-race-claim-split-v2-20260915
          fetch-depth: 0

      - name: Patch runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/universal-race-stage-runner/index.ts')
          s = p.read_text()
          s = s.replace(
            '    const claim = object(await rpc<unknown>(supabase, "universal_race_stage_claim_next_due_v1", { p_worker_id: "supabase_edge_phase11b_survival_v1" }));',
            '    const claim = object(await rpc<unknown>(supabase, "universal_race_stage_claim_next_due_v2", { p_worker_id: "supabase_edge_phase11b_split_payload_v2" }));',
            1,
          )
          old = '    const payload = object(claim.payload);'
          new = '    const payload = Object.keys(object(claim.payload)).length > 0\\n      ? object(claim.payload)\\n      : object(await rpc<unknown>(supabase, "universal_race_stage_get_calculation_payload_v1", {\\n          p_stage_id: stageId,\\n        }));'
          s = s.replace(old, new, 1)
          s = s.replace(
            '    const sources = buildSources(claim.payload, simulationRunId, preStageStandings);',
            '    const sources = buildSources(payload, simulationRunId, preStageStandings);',
            1,
          )
          s = s.replace(
            'const WORKER_BUILD = "road_scenario_v1_flat_hilly_2026_09_13";',
            'const WORKER_BUILD = "race_director_v2_split_claim_payload_2026_09_15";',
            1,
          )
          required = [
            'universal_race_stage_claim_next_due_v2',
            'universal_race_stage_get_calculation_payload_v1',
            'buildSources(payload, simulationRunId, preStageStandings)',
            'race_director_v2_split_claim_payload_2026_09_15',
          ]
          missing = [x for x in required if x not in s]
          if missing:
            raise SystemExit(f'missing patched markers: {missing}')
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit patch
        run: |
          if git diff --quiet -- supabase/functions/universal-race-stage-runner/index.ts; then
            echo already-patched
            exit 0
          fi
          git config user.name chatgpt-race-bot
          git config user.email actions@users.noreply.github.com
          git add supabase/functions/universal-race-stage-runner/index.ts
          git commit -m 'Split race claim from payload construction'
          git push origin HEAD:chatgpt-race-claim-split-v2-20260915
