name: Staff Advisory role entitlement UI patch v6

on:
  push:
    branches:
      - chatgpt/staff-advisory-role-entitlement-ui
    paths:
      - '.github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/staff-advisory-role-entitlement-ui
          fetch-depth: 0

      - name: Run deterministic source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/chatgpt-staff-advisory-role-entitlement-ui.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          patch_script = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'

          helper_pattern = re.compile(
              r"format_block = '''.*?replace_once\(format_block, format_replacement, 'days remaining helper'\)\n",
              re.S,
          )
          helper_replacement = r'''days_anchor = "\n  const loadOverview = React.useCallback(async () => {"
          days_helper = """
          const getAdvisoryDaysRemaining = React.useCallback((value: string | null) => {
            if (!value) return 0;
            const timestamp = Date.parse(value);
            if (!Number.isFinite(timestamp)) return 0;
            return Math.max(0, Math.ceil((timestamp - Date.now()) / 86_400_000));
          }, []);
          """
          if source.count(days_anchor) != 1:
              raise SystemExit(f'days helper anchor: expected 1, found {source.count(days_anchor)}')
          source = source.replace(days_anchor, days_helper + days_anchor, 1)
          '''
          patch_script, count = helper_pattern.subn(lambda _: helper_replacement, patch_script, count=1)
          if count != 1:
              raise SystemExit(f'Could not replace helper generator section: {count}')

          obsolete_pattern = re.compile(
              r"card_end = '''.*?if card_end not in source:\n\s+raise SystemExit\('assign modal anchor missing'\)\n\n",
              re.S,
          )
          patch_script, count = obsolete_pattern.subn('', patch_script, count=1)
          if count != 1:
              raise SystemExit(f'Could not remove obsolete modal assertion: {count}')

          old_call = "replace_once(close_anchor, paused_modal, 'paused renewal modal')"
          scoped_call = '''staff_component_start = source.index("function StaffBriefingCentre(")
          staff_component_end = source.index("function openPremiumPage()", staff_component_start)
          staff_component = source[staff_component_start:staff_component_end]
          if staff_component.count(close_anchor) != 1:
              raise SystemExit(
                  f'paused renewal modal scoped anchor: expected 1, found {staff_component.count(close_anchor)}'
              )
          staff_component = staff_component.replace(close_anchor, paused_modal, 1)
          source = (
              source[:staff_component_start]
              + staff_component
              + source[staff_component_end:]
          )'''
          if patch_script.count(old_call) != 1:
              raise SystemExit(f'Could not find paused modal replacement call: {patch_script.count(old_call)}')
          patch_script = patch_script.replace(old_call, scoped_call, 1)

          exec(compile(patch_script, '<staff-advisory-ui-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify intended changes
        shell: bash
        run: |
          git diff --check
          grep -q 'advisory_status: "no_staff" | "unassigned" | "active" | "paused" | "resumed" | "expired"' src/pages/dashboard/Overview.tsx
          grep -q 'staff_advisory_get_role_renewal_quote_v1' src/pages/dashboard/Overview.tsx
          grep -q 'staff_advisory_renew_my_role_v1' src/pages/dashboard/Overview.tsx
          grep -q 'staffBriefing.paidDaysRemaining' src/pages/dashboard/Overview.tsx
          grep -q '"paused": "Advisory paused"' src/i18n/locales/en/overview.json
          grep -q '"paused": "Advisory je pauziran"' src/i18n/locales/sr-Latn/overview.json

      - name: Commit patch and remove one-shot workflows
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui.yml
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v2.yml
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v3.yml
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v4.yml
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v5.yml
          git rm .github/workflows/chatgpt-staff-advisory-role-entitlement-ui-v6.yml
          git add src/pages/dashboard/Overview.tsx src/i18n/locales/en/overview.json src/i18n/locales/sr-Latn/overview.json
          git commit -m 'Preserve Staff Advisory time across staff changes'
          git push origin HEAD:chatgpt/staff-advisory-role-entitlement-ui
