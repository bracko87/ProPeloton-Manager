name: Season Started notification localization

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chatgpt-season-started-notification-localization.yml'

permissions:
  contents: write

jobs:
  localize-audit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct audit expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/fix_season_started_notification_localization_20260903.py')
          text = path.read_text(encoding='utf-8')
          old = 'len(block["values"]) != 6'
          new = 'len(block["values"]) != 7'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Could not locate Season Started value-count audit')
          PY

      - name: Apply semantic Season Started localization
        run: python .github/scripts/fix_season_started_notification_localization_20260903.py

      - name: Validate notification locale JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          locales = ['en', 'sr-Latn', 'de', 'hr', 'es', 'it', 'fr', 'ru']
          for locale in locales:
              path = Path('src/i18n/locales') / locale / 'notifications.json'
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit localization
        run: |
          if git diff --quiet; then
            echo 'No localization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/fix_season_started_notification_localization_20260903.py src/features/notifications/notificationLocalization.ts src/features/notifications/notificationTemplates.tsx src/i18n/locales/*/notifications.json
          git commit -m 'Translate Season Started notification fully'
          git pull --rebase origin main
          git push origin HEAD:main
