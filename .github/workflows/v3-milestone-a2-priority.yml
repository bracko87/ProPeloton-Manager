name: V3 Milestone A2 full-race position fairness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/coupled2DMicroV3.mjs'
      - 'scripts/v3/verify-milestone-a2-priority-v3.mjs'
      - 'scripts/v3/audit-milestone-a2-priority-v3.mjs'
      - '.github/workflows/v3-milestone-a2-priority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical, finish and checkpoint regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-milestone-a2-priority-v3.mjs
      - name: Four complete 2D stages, equal-row fairness, paired exact restart
        env:
          V3_A2_FIXTURE: ${{ matrix.fixture }}
          V3_A2_DIR: ${{ runner.temp }}/v3-a2-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-milestone-a2-priority-v3.mjs
      - name: Preserve rider-level final rankings and paired robustness
        uses: actions/upload-artifact@v4
        with:
          name: v3-milestone-a2-${{ matrix.fixture }}
          path: ${{ runner.temp }}/v3-a2-${{ matrix.fixture }}/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Production application build (no engine activation)
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
