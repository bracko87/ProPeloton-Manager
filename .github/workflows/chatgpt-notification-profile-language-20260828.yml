name: Notification and profile language localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-notification-profile-language-20260828.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply localization pass
        run: python .github/scripts/chatgpt_notification_profile_language_20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/notifications/notificationLocalization.ts \
            src/features/notifications/notificationTemplates.tsx \
            src/features/notifications/notificationHelpers.tsx \
            src/pages/dashboard/NotificationsPage.tsx \
            src/pages/MyProfile.tsx \
            src/context/AuthProvider.tsx \
            src/i18n/locales/en/accountPages.json \
            src/i18n/locales/sr-Latn/accountPages.json \
            src/i18n/locales/en/notifications.json \
            src/i18n/locales/sr-Latn/notifications.json

          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi

          git commit -m "Localize notifications and persist profile language"
          git push origin main
