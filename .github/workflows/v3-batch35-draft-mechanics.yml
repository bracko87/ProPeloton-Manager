name: V3 Batch 35 offline draft mechanics
on:
  push:
    branches: [main]
    paths:
      - 'src/race-engine-v3/coupledRoadRaceResearchV3.ts'
      - 'src/race-engine-v3/draftCounterfactualV3.ts'
      - 'scripts/v3/verify-batch35-draft-counterfactual-v3.mjs'
      - 'scripts/v3/audit-batch35-draft-robustness-v3.mjs'
      - '.github/workflows/v3-batch35-draft-mechanics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck strictly offline coupled research
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict --allowImportingTsExtensions --target ES2022 --module nodenext --moduleResolution nodenext src/race-engine-v3/coupledRoadRaceResearchV3.ts src/race-engine-v3/draftCounterfactualV3.ts
      - name: Validate pure shadow watts, opt-in physics and baseline nonmutation
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch35-draft-counterfactual-v3.mjs
      - name: Compare fixed-motion energy and complete A/B stages
        env:
          V3_BATCH35_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH35_MODE: ${{ matrix.mode }}
          V3_BATCH35_OUT_DIR: ${{ runner.temp }}/batch35-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch35-draft-robustness-v3.mjs
      - name: Keep full rider-level comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch35-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch35-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify application production build
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
