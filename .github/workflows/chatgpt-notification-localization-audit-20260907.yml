name: Notification localization audit 2026-09-07

on:
  push:
    paths:
      - '.github/workflows/chatgpt-notification-localization-audit-20260907.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit notification localization
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('.')
          locales=['en','sr-Latn','de','hr','es','it','fr','ru']
          def flat(o,p=''):
              out={}
              if isinstance(o,dict):
                  for k,v in o.items(): out.update(flat(v,f'{p}.{k}' if p else k))
              else: out[p]=o
              return out
          fs={l:flat(json.loads((root/f'src/i18n/locales/{l}/notifications.json').read_text(encoding='utf-8'))) for l in locales}
          en=fs['en']
          print('=== PARITY ===')
          for l in locales:
              missing=sorted(set(en)-set(fs[l])); extra=sorted(set(fs[l])-set(en))
              print(l,'keys',len(fs[l]),'missing',len(missing),'extra',len(extra))
          print('\n=== NON-EN EXTRA KEYS (SR-LATN) ===')
          for k in sorted(set(fs['sr-Latn'])-set(en)): print(k,'=',fs['sr-Latn'][k])
          print('\n=== SCREENSHOT/ADVISORY KEYS BY LOCALE ===')
          prefixes=('sportDirector.','reportVariants.','templateLocalization.feed.','semanticTypeTitles.','semanticTypeMessages.','semanticTypeEntityTitles.')
          exact=('startlistMissedTitle','startlistMissedMessage','startlistIssueLinkLabel')
          selected=[k for k in fs['sr-Latn'] if k.startswith(prefixes) or k in exact]
          selected=[k for k in selected if any(n in k.lower() or n in str(fs['en'].get(k,'')).lower() for n in ['sportdirector','stage','plan','programme','program','startlist','jersey','removed','race','team'])]
          for k in sorted(selected):
              print('\nKEY',k)
              for l in locales: print(' ',l,':',fs[l].get(k,'<MISSING>'))
          print('\n=== SOURCE MATCHES ===')
          needles=['management_priority','most urgent','urgent missing','missing_stage_plans','actionable_missing_stage_plans','next_future_race','missed_startlist','RACE_JERSEYS_MANDATORY','jersey_units','Team removed from','Startlist missed:','Sports Director Advisory']
          allowed={'.ts','.tsx','.js','.mjs','.sql','.json'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed: continue
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except: continue
              for i,line in enumerate(lines,1):
                  if any(n.lower() in line.lower() for n in needles): print(f'{p}:{i}: {line.strip()}')
          print('\n=== NOTIFICATION LOCALIZATION CALL SITES ===')
          for p in (root/'src').rglob('*.tsx'):
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except: continue
              for i,line in enumerate(lines,1):
                  if 'localizeNotification' in line: print(f'{p}:{i}: {line.strip()}')
          PY
