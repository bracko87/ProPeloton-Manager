name: Notification localization audit 2026-09-07

on:
  push:
    paths:
      - '.github/workflows/chatgpt-notification-localization-audit-20260907.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize-audit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply notification localization fixes
        run: |
          python .github/scripts/fix_notification_localization_20260907.py
          python .github/scripts/fix_notification_detail_localization_20260907.py
          python .github/scripts/fix_notification_runtime_cases_20260907.py
          python .github/scripts/fix_notification_semantic_regression_20260907.py

      - name: Audit all notification locales and runtime coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          locales = ['en','sr-Latn','de','hr','es','it','fr','ru']

          def flatten(value, prefix=''):
              out = {}
              if isinstance(value, dict):
                  for key, child in value.items():
                      out.update(flatten(child, f'{prefix}.{key}' if prefix else key))
              else:
                  out[prefix] = value
              return out

          def placeholders(value):
              if not isinstance(value, str):
                  return set()
              return set(re.findall(r'{{\s*([A-Za-z0-9_]+)\s*}}', value))

          bundles = {
              locale: json.loads((root / f'src/i18n/locales/{locale}/notifications.json').read_text(encoding='utf-8'))
              for locale in locales
          }
          flat = {locale: flatten(bundle) for locale, bundle in bundles.items()}
          en = flat['en']
          problems = []

          required_all = [
              'templateLocalization.feed.startlistMissed.title',
              'templateLocalization.feed.startlistMissed.message',
              'templateLocalization.feed.sportsDirector.titles.raceProgramme',
              'templateLocalization.feed.sportsDirector.titles.stagePlansMissing',
              'templateLocalization.feed.sportsDirector.titles.stagePlansIncomplete',
              'templateLocalization.feed.sportsDirector.titles.startlistDeadlineAlert',
              'templateLocalization.feed.sportsDirector.stagePlansMissingMessage',
              'templateLocalization.feed.sportsDirector.raceProgrammeMessage',
              'templateLocalization.feed.sportsDirector.noneScheduled',
              'templateLocalization.feed.sportsDirector.genericMessage',
              'templateLocalization.feed.raceJerseysRemoval.title',
              'templateLocalization.feed.raceJerseysRemoval.message',
              'templateLocalization.feed.raceApplicationResults.title',
              'templateLocalization.feed.raceApplicationResults.message',
              'templateLocalization.feed.scoutAdvisory.title',
              'headCoach.fatigueWatch.title',
              'headCoach.riderAvailability.title',
              'headCoach.trainingScheduleGap.title',
              'headCoach.highFatigueAlert.title',
          ]
          required_non_english = [
              'semanticTypeTitles.RACE_PLAN_NEEDS_ATTENTION',
              'semanticTypeTitles.RACE_JERSEYS_MANDATORY_WARNING',
          ]

          for locale in locales:
              missing = sorted(set(en) - set(flat[locale]))
              if missing:
                  problems.append(f'{locale}: {len(missing)} keys missing vs English: {missing[:20]}')

              for key in required_all:
                  value = flat[locale].get(key)
                  if not isinstance(value, str) or not value.strip():
                      problems.append(f'{locale}: missing/empty required key {key}')

              if locale != 'en':
                  for key in required_non_english:
                      value = flat[locale].get(key)
                      if not isinstance(value, str) or not value.strip():
                          problems.append(f'{locale}: missing/empty semantic notification key {key}')

              for key in set(en) & set(flat[locale]):
                  if placeholders(en[key]) != placeholders(flat[locale][key]):
                      problems.append(f'{locale}: placeholder mismatch at {key}')

              for key, value in flat[locale].items():
                  if isinstance(value, str) and not value.strip():
                      problems.append(f'{locale}: empty translation at {key}')

          # Exact Serbian screenshot phrases must be natural complete titles,
          # never token-assembled fragments such as "... . Savet".
          sr_expected = {
              'templateLocalization.feed.scoutAdvisory.title': 'Savet skauta — pregled regrutovanja i skautinga',
              'templateLocalization.feed.sportsDirector.titles.stagePlansMissing': 'Savet sportskog direktora — Nedostaju planovi etapa',
              'headCoach.riderAvailability.title': 'Savet glavnog trenera — dostupnost vozača',
              'headCoach.trainingScheduleGap.title': 'Savet glavnog trenera — praznina u rasporedu treninga',
              'headCoach.fatigueWatch.title': 'Savet glavnog trenera — praćenje umora',
              'templateLocalization.feed.raceApplicationResults.title': 'Rezultati prijava za trke',
          }
          for key, expected in sr_expected.items():
              actual = flat['sr-Latn'].get(key)
              if actual != expected:
                  problems.append(f'sr-Latn: wrong semantic phrase {key}: {actual!r} != {expected!r}')

          term_keys = [
              'reportVariants.stage_plans_missing',
              'reportVariants.stage_plans_incomplete',
              'reportVariants.startlist_deadline_alert',
              'sportDirector.startlist',
              'sportDirector.missingStagePlans',
              'sportDirector.incompleteStagePlans',
              'sportDirector.missingPlans',
          ]
          for locale in ['de','es','it','fr','ru']:
              for key in term_keys:
                  value = str(flat[locale].get(key, ''))
                  if re.search(r'\bStage\s+Plans?\b|\bStartlist\b', value, re.I):
                      problems.append(f'{locale}: English technical term remains in {key}: {value}')

          # Advisor titles in non-English locales must not retain English advisory
          # wording or the broken suffix patterns produced by token translation.
          advisor_title_keys = [
              'templateLocalization.feed.scoutAdvisory.title',
              'templateLocalization.feed.sportsDirector.titles.raceProgramme',
              'templateLocalization.feed.sportsDirector.titles.stagePlansMissing',
              'headCoach.fatigueWatch.title',
              'headCoach.riderAvailability.title',
              'headCoach.trainingScheduleGap.title',
              'headCoach.highFatigueAlert.title',
          ]
          for locale in locales[1:]:
              for key in advisor_title_keys:
                  value = str(flat[locale].get(key, ''))
                  if re.search(r'\b(Advisory|Head Coach|Sports Director|Scout Advisory)\b', value, re.I):
                      problems.append(f'{locale}: English advisor wording remains in {key}: {value}')
                  if re.search(r'\.\s*(Savet|Savjet|Hinweis|Avis|Avviso|Conseil|Совет)\s*$', value, re.I):
                      problems.append(f'{locale}: broken advisor suffix in {key}: {value}')

          localization = (root / 'src/features/notifications/notificationLocalization.ts').read_text(encoding='utf-8')
          page = (root / 'src/pages/dashboard/NotificationsPage.tsx').read_text(encoding='utf-8')

          required_source_fragments = [
              'function localizeExistingNotificationPhrase',
              'function localizeExistingNotificationTemplate',
              'localizeExistingNotificationPhrase(cleanTitle) || localizeExistingNotificationTemplate(cleanTitle)',
              'templateLocalization.feed.sportsDirector.raceProgrammeMessage',
              'templateLocalization.feed.startlistMissed.title',
              'templateLocalization.feed.raceJerseysRemoval.title',
              'templateLocalization.feed.raceApplicationResults.title',
              'const teamRemovedMatch',
              'const startlistMissedMatch',
          ]
          for fragment in required_source_fragments:
              if fragment not in localization:
                  problems.append(f'notificationLocalization.ts missing runtime coverage: {fragment}')

          if "if (resourceTitle && resourceMessage)" in localization:
              problems.append('resource-title early return still bypasses semantic notification handlers')
          if 'if (typeCode && !localizedType) return item' in localization:
              problems.append('legacy unknown-type English passthrough still present')

          page_fragments = [
              "applyNotificationTemplates(activeTab === 'unread' ? unreadItems : readItems)",
              'localizeNotificationRuntimeText(advisorPayload.summary || item.message, item, t)',
              'localizeNotificationNarrative',
              'localizeNotificationValue',
              'localizeNotificationValue(formatAdvisorDisplayValue(priority.detail), item)',
              'localizeNotificationValue(formatAdvisorAvailability(stage.urgency), item)',
          ]
          for fragment in page_fragments:
              if fragment not in page:
                  problems.append(f'NotificationsPage.tsx missing localization coverage: {fragment}')

          if problems:
              print('\n'.join(f'ERROR: {problem}' for problem in problems))
              raise SystemExit(1)

          print('Semantic notification localization audit PASSED')
          print('Locales:', ', '.join(locales))
          print('English notification keys:', len(en))
          print('Screenshot semantic phrases: PASSED')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit notification localization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No notification localization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/notifications/notificationLocalization.ts \
            src/pages/dashboard/NotificationsPage.tsx \
            src/i18n/locales/*/notifications.json
          git commit -m 'Fix semantic notification translations'
          git pull --rebase origin main
          git push origin HEAD:main
