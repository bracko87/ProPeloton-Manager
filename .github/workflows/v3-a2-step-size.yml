name: V3 A2 5s vs 10s full stage step sensitivity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-step-size-v3.mjs'
      - 'scripts/v3/verify-a2-step-size-v3.mjs'
      - '.github/workflows/v3-a2-step-size.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-stage-step-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety, finish-line and numeric-step micro invariants
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step-size-v3.mjs
      - name: Six complete stages per fixture plus deterministic checkpoints
        env:
          V3_A2_DT_FIXTURE: ${{ matrix.fixture }}
          V3_A2_DT_DIR: ${{ runner.temp }}/a2-dt-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step-size-v3.mjs
      - name: Preserve all finish classification and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-step-size-${{ matrix.fixture }}
          path: ${{ runner.temp }}/a2-dt-${{ matrix.fixture }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Production application build
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
