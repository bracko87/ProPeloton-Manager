name: Release Croatian baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-release-croatian-baseline.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Croatian baseline
        run: |
          python .github/scripts/prepare_croatian_canonical_fixes_20260830.py
          python .github/scripts/bootstrap_croatian_localization_20260830.py
          python .github/scripts/align_croatian_locale_structure_20260830.py
          python .github/scripts/repair_croatian_placeholders_20260830.py

      - name: Validate all 44 Croatian resources
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('src/i18n/locales'); en=root/'en'; hr=root/'hr'
          ph=re.compile(r'\{\{[^{}]+\}\}')
          en_files=sorted(p.name for p in en.glob('*.json'))
          hr_files=sorted(p.name for p in hr.glob('*.json'))
          assert en_files==hr_files, f'file mismatch: en={len(en_files)} hr={len(hr_files)}'
          def check(a,b,path):
              assert type(a) is type(b), f'{path}: type mismatch'
              if isinstance(a,dict):
                  assert list(a)==list(b), f'{path}: key/order mismatch'
                  for k in a: check(a[k],b[k],f'{path}.{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b), f'{path}: list length mismatch'
                  for i,(x,y) in enumerate(zip(a,b)): check(x,y,f'{path}[{i}]')
              elif isinstance(a,str):
                  assert sorted(ph.findall(a))==sorted(ph.findall(b)), f'{path}: placeholder mismatch'
          for name in en_files:
              check(json.loads((en/name).read_text(encoding='utf-8')),json.loads((hr/name).read_text(encoding='utf-8')),name)
          print(f'PASS: Croatian mirrors all {len(en_files)} English resources with valid placeholders.')
          PY

      - name: Report remaining Croatian quality diagnostics
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          patterns=[
            r'\bpodešav',r'\bobavešten',r'\btakmič',r'\bučestv|\bučešće',r'\buslov',r'\bvrednost',
            r'\bslede',r'\bizvešt',r'\bpovre',r'\bsavet',r'\bbezbed',r'\bpromen',r'\bprover',r'\bodelj',
            r'\bizaber',r'\bocen',r'\bprose',r'\bverovat',r'\bhiljad',r'\bmilion',r'\btočkov|\btočak',
            r'\bmenjač',r'\bmesec',r'\bistorij',r'\bdodel',r'\bprimen',r'\brešen',r'\bzahtev',r'\bprevod',
            r'\bprenos',r'\bposled',r'\blekar',r'\bsačuv',r'\bvešt',r'\btrka',r'\bnalog',r'\bponovo\b',
            r'\buputstv'
          ]
          counts=Counter(); total=0
          def walk(x,file):
              global total
              if isinstance(x,dict):
                  for v in x.values(): walk(v,file)
              elif isinstance(x,list):
                  for v in x: walk(v,file)
              elif isinstance(x,str) and any(re.search(p,x,re.I) for p in patterns):
                  counts[file]+=1; total+=1
          for f in sorted(Path('src/i18n/locales/hr').glob('*.json')):
              walk(json.loads(f.read_text(encoding='utf-8')),f.name)
          print(f'Croatian baseline quality candidates remaining: {total}')
          for file,count in counts.most_common(): print(f'{count:4d} {file}')
          print('These are polish candidates, not schema/build blockers.')
          PY

      - name: Verify Croatian dropdown and locale wiring
        run: |
          grep -q "code: 'hr'" src/i18n/languages.ts
          grep -q "label: 'Hrvatski'" src/i18n/languages.ts
          grep -q "locale: 'hr-HR'" src/i18n/languages.ts
          grep -q "supportedLngs: \['en', 'sr-Latn', 'de', 'hr'\]" src/i18n/index.ts
          grep -q "hr: 'hr'" src/components/i18n/LanguageSelector.tsx
          grep -q "startsWith('hr')" src/components/i18n/LocaleDateFormattingBridge.tsx
          grep -q "language.startsWith('hr')" src/features/squad/components/RiderProfilePage.tsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Croatian baseline to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/i18n/languages.ts \
            src/i18n/index.ts \
            src/i18n/locales/hr \
            src/i18n/locales/en/riderProfile.json \
            src/i18n/locales/sr-Latn/riderProfile.json \
            src/i18n/locales/de/riderProfile.json \
            src/components/i18n/LanguageSelector.tsx \
            src/components/i18n/LocaleDateFormattingBridge.tsx \
            src/features/squad/components/RiderProfilePage.tsx
          if git diff --cached --quiet; then
            echo 'No Croatian baseline changes to commit.'
            exit 0
          fi
          git commit -m 'Add Croatian localization baseline'
          git pull --rebase origin main
          git push origin main
