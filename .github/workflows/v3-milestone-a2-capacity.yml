name: V3 Milestone A2 overtaking capacity experiment
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-milestone-a2-capacity-v3.mjs'
      - '.github/workflows/v3-milestone-a2-capacity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing 2D collision, energy, crossing and fairness invariants
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-milestone-a2-priority-v3.mjs
      - name: Two full capacity-three 2D stage calculations and restart equivalence
        env:
          V3_A2_CAPACITY_FIXTURE: ${{ matrix.fixture }}
          V3_A2_CAPACITY_DIR: ${{ runner.temp }}/a2-capacity-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-milestone-a2-capacity-v3.mjs
      - name: Retain complete rider rankings
        uses: actions/upload-artifact@v4
        with:
          name: v3-milestone-a2-capacity-${{ matrix.fixture }}
          path: ${{ runner.temp }}/a2-capacity-${{ matrix.fixture }}/*.json
          retention-days: 30
          if-no-files-found: error
