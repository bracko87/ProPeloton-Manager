name: V3 Step73 bounded two-slot entry feasibility and physical counterexamples
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2TwoSlotFeasibilityV3.mjs'
      - 'scripts/v3/verify-a2-step73-feasibility-v3.mjs'
      - '.github/workflows/v3-step73-feasibility-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-false-sporting-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'A73 real 2-slot arrival envelopes, impossible 30m/s gate, 32/106/168 mirrored and renamed booking, actual strong collision rejects'
        env:
          V3_A2_STEP73_DIR: ${{ runner.temp }}/step73
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step73-feasibility-v3.mjs
      - name: Store Step73 negative controls and physical first-contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step73-necessary-feasibility-and-physical-counterexamples
          path: ${{ runner.temp }}/step73/*.json
          retention-days: 30
          if-no-files-found: warn
