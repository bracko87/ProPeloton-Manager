name: Apply stage supply refresh patch

on:
  push:
    branches:
      - fix/stage-supply-stock-refresh

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage-supply-stock-refresh
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch RacePreparation stock refresh
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('src/pages/dashboard/RacePreparation.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')

          old_state = "  const [stageSupplyOptions, setStageSupplyOptions] =\n    useState<RaceSupplyOption[]>(supplyOptions);\n"
          new_state = old_state + '\n'.join(
              ('  ' + line if line else line)
              for line in textwrap.dedent('''\
                const [stageSupplyRefreshing, setStageSupplyRefreshing] = useState(false);
                const [stageSupplyRefreshError, setStageSupplyRefreshError] =
                  useState<string | null>(null);
                const stageSupplyRequestIdRef = React.useRef(0);
                const stageSupplyAutoRefreshAtRef = React.useRef(0);
              ''').splitlines()
          ) + '\n'
          replace_once(old_state, new_state, 'stage supply state')

          refresh_block = textwrap.dedent('''\

            const refreshStageSupplyAvailability = React.useCallback(
              async (
                { showStatus = false }: { showStatus?: boolean } = {},
              ): Promise<void> => {
                const requestId = ++stageSupplyRequestIdRef.current;

                if (showStatus) {
                  setStageSupplyRefreshing(true);
                }
                setStageSupplyRefreshError(null);

                try {
                  if (!selectedStageSupplyId || !selectedStageSupplyTeamId) {
                    if (requestId === stageSupplyRequestIdRef.current) {
                      setStageSupplyOptions(supplyOptions);
                    }
                    return;
                  }

                  const { data, error } = await supabase.rpc(
                    "get_race_stage_supply_availability_v1",
                    {
                      p_stage_id: selectedStageSupplyId,
                      p_team_id: selectedStageSupplyTeamId,
                    },
                  );

                  if (requestId !== stageSupplyRequestIdRef.current) return;
                  if (error) throw error;

                  const availabilityByKey = new Map<string, number>(
                    toArray<JsonRecord>(data).map((row) => [
                      String(row.supply_key ?? ""),
                      Math.max(0, Number(row.quantity_available ?? 0)),
                    ]),
                  );

                  setStageSupplyOptions(
                    supplyOptions.map((option) => {
                      const supplyKey = String(option.supply_key ?? "");
                      const available = availabilityByKey.get(supplyKey);

                      return available === undefined
                        ? option
                        : { ...option, quantity_available: available };
                    }),
                  );
                } catch (error) {
                  if (requestId !== stageSupplyRequestIdRef.current) return;

                  console.warn(
                    "Could not load reservation-aware stage supply availability:",
                    error,
                  );
                  setStageSupplyRefreshError(
                    "Could not refresh live stock. Please try again.",
                  );
                } finally {
                  if (requestId === stageSupplyRequestIdRef.current) {
                    setStageSupplyRefreshing(false);
                  }
                }
              },
              [selectedStageSupplyId, selectedStageSupplyTeamId, supplyOptions],
            );

            useEffect(() => {
              void refreshStageSupplyAvailability();
            }, [refreshStageSupplyAvailability]);

            useEffect(() => {
              function refreshWhenPageBecomesActive() {
                if (document.visibilityState !== "visible") return;

                const now = Date.now();
                if (now - stageSupplyAutoRefreshAtRef.current < 1000) return;

                stageSupplyAutoRefreshAtRef.current = now;
                void refreshStageSupplyAvailability();
              }

              window.addEventListener("focus", refreshWhenPageBecomesActive);
              document.addEventListener(
                "visibilitychange",
                refreshWhenPageBecomesActive,
              );

              return () => {
                window.removeEventListener("focus", refreshWhenPageBecomesActive);
                document.removeEventListener(
                  "visibilitychange",
                  refreshWhenPageBecomesActive,
                );
              };
            }, [refreshStageSupplyAvailability]);
          ''')
          regex_once(
              r'\n\n  useEffect\(\(\) => \{\n    let cancelled = false;\n\n    async function loadStageSupplyAvailability\(\) \{.*?\n  \}, \[selectedStageSupplyId, selectedStageSupplyTeamId, supplyOptions\]\);',
              refresh_block,
              'availability effect',
          )

          old_save_refresh = "      await Promise.all([\n        loadStagePlanReadinessForCurrentTarget(),\n        loadU23AutomationDashboardForCurrentTarget(),\n      ]);\n"
          new_save_refresh = "      await Promise.all([\n        loadStagePlanReadinessForCurrentTarget(),\n        loadU23AutomationDashboardForCurrentTarget(),\n        refreshStageSupplyAvailability(),\n      ]);\n"
          replace_once(old_save_refresh, new_save_refresh, 'post-save stock refresh')

          old_destructure = "  onSave,\n  saveDisabled,\n  saving,\n  disabled,\n}: {\n"
          new_destructure = "  onSave,\n  saveDisabled,\n  saving,\n  disabled,\n  onRefreshStock,\n  stockRefreshing,\n  stockRefreshError,\n}: {\n"
          old_types = "  saveDisabled: boolean;\n  saving: boolean;\n  disabled: boolean;\n}) {\n"
          new_types = "  saveDisabled: boolean;\n  saving: boolean;\n  disabled: boolean;\n  onRefreshStock: () => void;\n  stockRefreshing: boolean;\n  stockRefreshError: string | null;\n}) {\n"

          # Scope both prop edits strictly to StageRaceSuppliesCard.
          card_start = text.index('function StageRaceSuppliesCard({')
          card_body_start = text.index('}) {', card_start)
          prefix = text[:card_start]
          card_head = text[card_start:card_body_start + 4]
          suffix = text[card_body_start + 4:]

          count = card_head.count(old_destructure)
          if count != 1:
              raise SystemExit(f'supplies card destructuring: expected 1 match, found {count}')
          card_head = card_head.replace(old_destructure, new_destructure, 1)

          count = card_head.count(old_types)
          if count != 1:
              raise SystemExit(f'supplies card prop types: expected 1 match, found {count}')
          card_head = card_head.replace(old_types, new_types, 1)
          text = prefix + card_head + suffix

          old_plan_only = '<span className="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">{racePrepText("screen.planOnly")}</span>'
          new_plan_only = textwrap.dedent('''\
            <div className="flex flex-wrap items-center justify-end gap-2">
              {stockRefreshError ? (
                <span
                  className="text-xs font-semibold text-red-600"
                  title={stockRefreshError}
                >
                  Refresh failed
                </span>
              ) : null}
              <button
                type="button"
                onClick={onRefreshStock}
                disabled={stockRefreshing}
                className="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50 disabled:cursor-wait disabled:opacity-60"
              >
                {stockRefreshing ? "Refreshing…" : "Refresh stock"}
              </button>
              <span className="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">
                {racePrepText("screen.planOnly")}
              </span>
            </div>
          ''').strip()
          replace_once(old_plan_only, new_plan_only, 'stock refresh button')

          old_invocation = "          saving={savingStagePlan}\n          disabled={\n            !packageSubmitted ||\n            lockInfo.isLocked ||\n            selectedStageLockedByWeather ||\n            suppliesDisabledForTT ||\n            stagePlanControlsReadOnly\n          }\n        />\n"
          new_invocation = "          saving={savingStagePlan}\n          disabled={\n            !packageSubmitted ||\n            lockInfo.isLocked ||\n            selectedStageLockedByWeather ||\n            suppliesDisabledForTT ||\n            stagePlanControlsReadOnly\n          }\n          onRefreshStock={() =>\n            void refreshStageSupplyAvailability({ showStatus: true })\n          }\n          stockRefreshing={stageSupplyRefreshing}\n          stockRefreshError={stageSupplyRefreshError}\n        />\n"
          replace_once(old_invocation, new_invocation, 'supplies card invocation')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patched source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/RacePreparation.tsx
          git rm .github/workflows/tmp-apply-stage-supply-refresh.yml
          git commit -m "Refresh stage supply stock on demand"
          git push origin HEAD:fix/stage-supply-stock-refresh
