name: V3 Step97 global floor-aware timetable original A64 feasibility
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step97FeasibilityCertificateV3.mjs'
      - 'scripts/v3/a2Step97TimetableProbeV3.mjs'
      - 'scripts/v3/verify-a2-step97-*.mjs'
      - '.github/workflows/v3-step97-global-feasibility.yml'
  workflow_dispatch:
jobs:
  necessary-geometry-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step97-feasibility-v3.mjs
      - run: node scripts/v3/verify-a2-step96-local-gap-v3.mjs
      - run: node scripts/v3/verify-a2-step95-moving-gate-v3.mjs
      - run: node scripts/v3/verify-a2-step94-relative-closure-v3.mjs
      - run: node scripts/v3/verify-a2-step93-rolling-start-v3.mjs
      - run: node scripts/v3/verify-a2-step92-cohort-geometry-v3.mjs
      - run: node scripts/v3/verify-a2-step91-leases-v3.mjs
      - run: node scripts/v3/verify-a2-step90-row-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step85-throughput-v3.mjs
      - run: node scripts/v3/verify-a2-step78-joint-viability-v3.mjs
  global-bookings-106-168-a64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step97-long-horizon-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step97-global-timing-A64-full-field
          path: /tmp/a97large
          if-no-files-found: warn
  8-32-mirror-sport-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step97-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step97-A64-mirror-overtakes-checkpoint
          path: /tmp/a97parity
          if-no-files-found: warn
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
