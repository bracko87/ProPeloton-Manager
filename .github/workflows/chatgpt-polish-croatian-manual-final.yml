name: Polish Croatian Manual final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-polish-croatian-manual-final.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Croatian Manual normalization pass 1
        run: python .github/scripts/normalize_croatian_manual_20260830.py
      - name: Apply Croatian Manual normalization pass 2
        run: python .github/scripts/normalize_croatian_manual_pass2_20260830.py
      - name: Apply Croatian Manual normalization pass 3
        run: python .github/scripts/normalize_croatian_manual_pass3_20260830.py
      - name: Restore canonical placeholders
        run: python .github/scripts/repair_croatian_placeholders_20260830.py
      - name: Apply final human Croatian Manual rewrites
        run: python .github/scripts/polish_croatian_manual_final_20260830.py

      - name: Validate Croatian Manual quality
        run: python .github/scripts/validate_croatian_manual_final_20260830.py

      - name: Validate all Croatian schemas and placeholders
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('src/i18n/locales'); en=root/'en'; hr=root/'hr'; ph=re.compile(r'\{\{[^{}]+\}\}')
          e=sorted(p.name for p in en.glob('*.json')); h=sorted(p.name for p in hr.glob('*.json'))
          assert e==h, f'file mismatch en={len(e)} hr={len(h)}'
          def check(a,b,path):
              assert type(a) is type(b), f'{path}: type mismatch'
              if isinstance(a,dict):
                  assert list(a)==list(b), f'{path}: key/order mismatch'
                  for k in a: check(a[k],b[k],f'{path}.{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b), f'{path}: list length mismatch'
                  for i,(x,y) in enumerate(zip(a,b)): check(x,y,f'{path}[{i}]')
              elif isinstance(a,str):
                  assert sorted(ph.findall(a))==sorted(ph.findall(b)), f'{path}: placeholder mismatch'
          for n in e:
              check(json.loads((en/n).read_text(encoding='utf-8')),json.loads((hr/n).read_text(encoding='utf-8')),n)
          print(f'PASS: all {len(e)} Croatian resources preserve canonical structure/placeholders.')
          PY

      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

      - name: Commit Croatian Manual polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/i18n/locales/hr/manual.json \
            src/i18n/locales/hr/manualCore.json \
            src/i18n/locales/hr/manualDeepA.json \
            src/i18n/locales/hr/manualDeepB1.json \
            src/i18n/locales/hr/manualDeepB2.json \
            src/i18n/locales/hr/manualDynamic.json \
            src/i18n/locales/hr/manualFaq.json \
            src/i18n/locales/hr/manualLegacyDynamic.json
          if git diff --cached --quiet; then
            echo 'No Croatian Manual changes to commit.'
            exit 0
          fi
          git commit -m 'Polish Croatian Manual localization'
          git pull --rebase origin main
          git push origin main
