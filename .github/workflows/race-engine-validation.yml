name: Race engine validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/universal-race-engine/**'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - '.github/workflows/race-engine-validation.yml'
  push:
    branches:
      - fix/race-engine-replay-sync-gap-exhaustion
      - validation/race-engine-main-baseline-20260923b
    paths:
      - 'src/universal-race-engine/**'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - '.github/workflows/race-engine-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Build and race-engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Compile race engine
        run: npx esbuild src/universal-race-engine/runRaceEngine.ts --bundle --platform=node --format=esm --outfile=/tmp/runRaceEngine.mjs

      - name: Production build
        run: npm run build

      - name: Run race replay regression gate
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=dot
          -t "uses one 82% reactive-counterattack decision for the whole second opening wave and exposes it in replay|stores accepted opening attacks and the one original breakaway formation|never freezes an established opening escape at its launch gap|never publishes a road finisher with zero usable reserve|keeps every successful peloton attack in a physical F lifecycle"

      - name: Run full legacy race-engine suite for visibility
        continue-on-error: true
        run: npx --yes vitest@3.2.4 run src/universal-race-engine/runRaceEngine.test.ts --reporter=dot
