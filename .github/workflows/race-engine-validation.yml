name: Race engine validation

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'src/universal-race-engine/**'
      - 'supabase/functions/universal-race-stage-safe-resume/**'
      - 'supabase/functions/_shared/idempotentChunkRetryV1.mjs'
      - 'scripts/test-race-safe-chunk-retries.mjs'
      - 'supabase/functions/_shared/replayNormalizationWindowV1.mjs'
      - 'scripts/test-race-replay-normalization-pages.mjs'
      - 'docs/engineering/persistent_race_output_v2_proposal_20261024.sql'
      - 'scripts/test-race-persistent-output-contract.mjs'
      - 'scripts/tests/persistent-output-v2-fixtures.sql'
      - 'scripts/tests/persistent-output-v2-integration.sql'
      - 'scripts/tests/safe-worker-admission-fixtures.sql'
      - 'scripts/tests/safe-worker-admission-integration.sql'
      - 'scripts/tests/safe-worker-admission-concurrency.sh'
      - 'scripts/test-race-live-engine-pin-preservation.mjs'
      - 'scripts/test-migration-parity.mjs'
      - 'scripts/test-race-worker-measured-scenarios.mjs'
      - 'scripts/test-step7-replay-window-recovery.mjs'
      - 'supabase/functions/_shared/replayWindowAssemblyV1.mjs'
      - 'src/universal-race-engine/runMountainResumableEngineV1.ts'
      - 'src/universal-race-engine/mountainOpeningBreakawayV1.ts'
      - 'src/universal-race-engine/summitFinishPhysicalHandoffV1.ts'
      - 'scripts/run-race-worker-measured-scenarios.mjs'
      - 'scripts/fixtures/race_worker_measured_20261024.json'
      - 'supabase/migrations/**'
      - 'scripts/check-migration-parity.mjs'
      - 'scripts/lib/migrationParityV1.mjs'
      - 'docs/engineering/prod_applied_migration_versions_20261024.json'
      - 'docs/engineering/SUPABASE_MIGRATION_HISTORY_DRIFT_20261024.md'
      - 'scripts/test-race-safe-admission-cap.mjs'
      - 'scripts/test-race-worker-capacity-model.mjs'
      - 'scripts/lib/race-worker-capacity-model.mjs'
      - 'scripts/simulate-race-worker-capacity.mjs'
      - 'docs/engineering/safe_step_admission_cap_proposal_20261024.sql'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - '.github/workflows/race-engine-validation.yml'
  push:
    branches:
      - main
      - fix/race-engine-replay-sync-gap-exhaustion
    paths:
      - 'src/universal-race-engine/**'
      - 'supabase/functions/universal-race-stage-safe-resume/**'
      - 'supabase/functions/_shared/idempotentChunkRetryV1.mjs'
      - 'scripts/test-race-safe-chunk-retries.mjs'
      - 'supabase/functions/_shared/replayNormalizationWindowV1.mjs'
      - 'scripts/test-race-replay-normalization-pages.mjs'
      - 'docs/engineering/persistent_race_output_v2_proposal_20261024.sql'
      - 'scripts/test-race-persistent-output-contract.mjs'
      - 'scripts/tests/persistent-output-v2-fixtures.sql'
      - 'scripts/tests/persistent-output-v2-integration.sql'
      - 'scripts/tests/safe-worker-admission-fixtures.sql'
      - 'scripts/tests/safe-worker-admission-integration.sql'
      - 'scripts/tests/safe-worker-admission-concurrency.sh'
      - 'scripts/test-race-live-engine-pin-preservation.mjs'
      - 'scripts/test-migration-parity.mjs'
      - 'scripts/test-race-worker-measured-scenarios.mjs'
      - 'scripts/test-step7-replay-window-recovery.mjs'
      - 'supabase/functions/_shared/replayWindowAssemblyV1.mjs'
      - 'src/universal-race-engine/runMountainResumableEngineV1.ts'
      - 'src/universal-race-engine/mountainOpeningBreakawayV1.ts'
      - 'src/universal-race-engine/summitFinishPhysicalHandoffV1.ts'
      - 'scripts/run-race-worker-measured-scenarios.mjs'
      - 'scripts/fixtures/race_worker_measured_20261024.json'
      - 'supabase/migrations/**'
      - 'scripts/check-migration-parity.mjs'
      - 'scripts/lib/migrationParityV1.mjs'
      - 'docs/engineering/prod_applied_migration_versions_20261024.json'
      - 'docs/engineering/SUPABASE_MIGRATION_HISTORY_DRIFT_20261024.md'
      - 'scripts/test-race-safe-admission-cap.mjs'
      - 'scripts/test-race-worker-capacity-model.mjs'
      - 'scripts/lib/race-worker-capacity-model.mjs'
      - 'scripts/simulate-race-worker-capacity.mjs'
      - 'docs/engineering/safe_step_admission_cap_proposal_20261024.sql'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - '.github/workflows/race-engine-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Build and race-engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify race worker idempotent chunk retries
        run: node --test scripts/test-race-safe-chunk-retries.mjs

      - name: Verify race replay paging and capacity policies
        run: >-
          node --test
          scripts/test-race-replay-normalization-pages.mjs
          scripts/test-race-safe-admission-cap.mjs
          scripts/test-race-worker-capacity-model.mjs

      - name: Compare synthetic 2x and 12x worker pressure
        run: node scripts/simulate-race-worker-capacity.mjs

      - name: Check persistent output resume contract
        run: node --test scripts/test-race-persistent-output-contract.mjs

      - name: Protect production-calibrated engine selection
        run: node --test scripts/test-race-live-engine-pin-preservation.mjs

      - name: Verify known Supabase migration drift is explicitly detected
        run: |
          node --test scripts/test-migration-parity.mjs
          node scripts/check-migration-parity.mjs

      - name: Validate measured 2x and 12x race-worker scenarios
        run: |
          node --test scripts/test-race-worker-measured-scenarios.mjs
          node scripts/run-race-worker-measured-scenarios.mjs

      - name: Verify resumable mountain replay cursor and lease restart logic
        run: node --test scripts/test-step7-replay-window-recovery.mjs

      - name: REQUIRED baseline replay generation full-versus-resumed parity
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=verbose
          -t "Baseline replay bounded-window generation"

      - name: Compile staged baseline replay window engine
        run: >-
          npx esbuild src/universal-race-engine/runBaselineResumableEngineV1.ts
          --bundle --platform=node --format=esm
          --outfile=/tmp/ppm-baseline-resumable-engine.mjs

      - name: Compile staged mountain replay window engine
        run: >-
          npx esbuild src/universal-race-engine/runMountainResumableEngineV1.ts
          --bundle --platform=node --format=esm
          --outfile=/tmp/ppm-mountain-resumable-engine.mjs

      - name: Compile staged safe-resume Edge worker
        run: >-
          npx esbuild supabase/functions/universal-race-stage-safe-resume/index.ts
          --bundle --platform=neutral --format=esm
          --external:https://*
          --external:npm:*
          --outfile=/tmp/ppm-universal-safe-resume.mjs

      - name: Compile race engine
        run: npx esbuild src/universal-race-engine/runRaceEngine.ts --bundle --platform=node --format=esm --outfile=/tmp/runRaceEngine.mjs

      - name: Production build
        run: npm run build

      - name: Test prospective summit calibration on French Tour profiles
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/summitFinishSelectivityV1.test.ts
          --reporter=dot

      - name: Run simulation-only French Tour 2000 summit stages through engine
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=verbose
          -t "runs simulation-only French Tour 2000 summit profiles through the full physical engine"

      - name: Run World Nations three-day TypeScript E2E
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=dot
          -t "runs the committed World Nations three-day TypeScript race-engine lifecycle"

      - name: Run race replay regression gate
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=dot
          -t "uses one 82% reactive-counterattack decision for the whole second opening wave and exposes it in replay|stores accepted opening attacks and the one original breakaway formation|never freezes an established opening escape at its launch gap|never publishes a road finisher with zero usable reserve|keeps every successful peloton attack in a physical F lifecycle|does not retroactively drop a rider before a later successful peloton attack|lets some successful decisive attacks establish a meaningful physical move before the chase fully organizes"

      - name: REQUIRED mountain replay generation full-versus-resumed parity
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=verbose
          -t "Mountain replay bounded-window generation"

      - name: Run full legacy race-engine suite for visibility
        continue-on-error: true
        run: npx --yes vitest@3.2.4 run src/universal-race-engine/runRaceEngine.test.ts --reporter=dot

  persistent-output-postgres:
    name: Isolated PostgreSQL 17 output-resume integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_ephemeral_only
      PGDATABASE: postgres
    steps:
      - name: Checkout test SQL
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Create disposable game API fixture
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/tests/persistent-output-v2-fixtures.sql

      - name: Apply actual version 2 output RPC proposal
        run: psql -X -v ON_ERROR_STOP=1 -f docs/engineering/persistent_race_output_v2_proposal_20261024.sql

      - name: Test restart-safe upload and exactly-once publication
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/tests/persistent-output-v2-integration.sql

      - name: Create second isolated worker-capacity database
        run: createdb race_capacity_ci

      - name: Create admission-limit fixture
        env:
          PGDATABASE: race_capacity_ci
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/tests/safe-worker-admission-fixtures.sql

      - name: Compile the actual safe-step admission policy
        env:
          PGDATABASE: race_capacity_ci
        run: psql -X -v ON_ERROR_STOP=1 -f docs/engineering/safe_step_admission_cap_proposal_20261024.sql

      - name: Verify cap, deferred work and lease expiration
        env:
          PGDATABASE: race_capacity_ci
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/tests/safe-worker-admission-integration.sql

      - name: Stress-test 24 concurrent safe-worker claims
        run: bash scripts/tests/safe-worker-admission-concurrency.sh

