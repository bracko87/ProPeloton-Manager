name: Race engine validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/universal-race-engine/**'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - 'supabase/functions/universal-race-stage-*/index.ts'
      - 'scripts/verify-summit-worker-pins.mjs'
      - 'scripts/verify-mountain-pilot-worker-routing.mjs'
      - '.github/workflows/race-engine-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/universal-race-engine/**'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - 'supabase/functions/universal-race-stage-*/index.ts'
      - 'scripts/verify-summit-worker-pins.mjs'
      - 'scripts/verify-mountain-pilot-worker-routing.mjs'
      - '.github/workflows/race-engine-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Build and race-engine regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify production race worker summit source pins
        run: node scripts/verify-summit-worker-pins.mjs

      - name: Verify stage-scoped mountain worker execution paths
        run: node scripts/verify-mountain-pilot-worker-routing.mjs

      - name: TypeScript syntax-check race Edge Function entrypoints
        run: |
          for function_name in universal-race-stage-runner universal-race-stage-pass1-resume universal-race-stage-pass2-resume universal-race-stage-safe-resume; do
            npx esbuild "supabase/functions/${function_name}/index.ts" --bundle --platform=neutral --format=esm --external:'https://*' --external:'npm:*' --external:'jsr:*' --outfile="/tmp/${function_name}.mjs"
          done

      - name: Compile race engine
        run: npx esbuild src/universal-race-engine/runRaceEngine.ts --bundle --platform=node --format=esm --outfile=/tmp/runRaceEngine.mjs

      - name: Compile isolated mountain experimental solver
        run: npx esbuild src/universal-race-engine/runMountainExperimentalEngineV1.ts --bundle --platform=node --format=esm --outfile=/tmp/runMountainExperimentalEngineV1.mjs

      - name: Compile and test isolated breakaway opportunity engine
        run: |
          npx esbuild src/universal-race-engine/breakawayOpportunityEngineV1.ts --bundle --platform=node --format=esm --outfile=/tmp/breakawayOpportunityEngineV1.mjs
          npx --yes vitest@3.2.4 run src/universal-race-engine/breakawayOpportunityEngineV1.test.ts --reporter=dot

      - name: Verify stage-scoped baseline and mountain engine isolation
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/mountainEnginePilotV1.test.ts
          src/universal-race-engine/mountainEngineLaneV1.test.ts
          src/universal-race-engine/runSelectedRaceEngineV1.test.ts
          src/universal-race-engine/mountainOpeningBreakawayV1.test.ts
          --reporter=dot

      - name: Production build
        run: npm run build

      - name: Test prospective summit calibration on French Tour profiles
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/summitFinishSelectivityV1.test.ts
          --reporter=dot

      - name: Run simulation-only French Tour 2000 summit stages through engine
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=verbose
          -t "runs simulation-only French Tour 2000 summit profiles through the full physical engine"

      - name: Run World Nations three-day TypeScript E2E
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=dot
          -t "runs the committed World Nations three-day TypeScript race-engine lifecycle"

      - name: Run race replay regression gate
        run: >-
          npx --yes vitest@3.2.4 run
          src/universal-race-engine/runRaceEngine.test.ts
          --reporter=dot
          -t "uses one 82% reactive-counterattack decision for the whole second opening wave and exposes it in replay|stores accepted opening attacks and the one original breakaway formation|never freezes an established opening escape at its launch gap|never publishes a road finisher with zero usable reserve|keeps every successful peloton attack in a physical F lifecycle|does not retroactively drop a rider before a later successful peloton attack|lets some successful decisive attacks establish a meaningful physical move before the chase fully organizes"

      - name: Run full legacy race-engine suite for visibility
        continue-on-error: true
        run: npx --yes vitest@3.2.4 run src/universal-race-engine/runRaceEngine.test.ts --reporter=dot --pool=threads
