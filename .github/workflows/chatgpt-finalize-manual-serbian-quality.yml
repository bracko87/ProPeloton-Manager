name: Finalize Serbian manual quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-finalize-manual-serbian-quality.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translator
        run: |
          python -m pip install --quiet sentencepiece sacremoses protobuf 'transformers==4.53.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Prepare NLLB Serbian translator
        run: python .github/scripts/prepare_manual_nllb_runtime_20260828.py

      - name: Translate all 92 manual sections
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python .github/scripts/localize_full_manual_sr_latn_20260828.py

      - name: Polish and validate Serbian Latin quality
        run: python .github/scripts/polish_validate_manual_sr_latn_20260828.py

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit translated manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/locales/sr-Latn/manual.json
          if git diff --cached --quiet; then
            echo 'No manual changes to commit.'
            exit 0
          fi
          git commit -m 'Finish high-quality Serbian Latin game manual'
          git pull --rebase origin main
          git push origin main
