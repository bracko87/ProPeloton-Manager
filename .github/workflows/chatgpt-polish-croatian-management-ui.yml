name: Polish Croatian management UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-polish-croatian-management-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Croatian management polish
        run: python .github/scripts/polish_croatian_management_20260830.py

      - name: Validate Croatian management localization
        run: python .github/scripts/validate_croatian_management_20260830.py

      - name: Validate all Croatian resource schemas and placeholders
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('src/i18n/locales'); en=root/'en'; hr=root/'hr'
          ph=re.compile(r'\{\{[^{}]+\}\}')
          en_files=sorted(p.name for p in en.glob('*.json'))
          hr_files=sorted(p.name for p in hr.glob('*.json'))
          assert en_files==hr_files, f'file mismatch en={len(en_files)} hr={len(hr_files)}'
          def check(a,b,path):
              assert type(a) is type(b), f'{path}: type mismatch'
              if isinstance(a,dict):
                  assert list(a)==list(b), f'{path}: key/order mismatch'
                  for k in a: check(a[k],b[k],f'{path}.{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b), f'{path}: list length mismatch'
                  for i,(x,y) in enumerate(zip(a,b)): check(x,y,f'{path}[{i}]')
              elif isinstance(a,str):
                  assert sorted(ph.findall(a))==sorted(ph.findall(b)), f'{path}: placeholder mismatch'
          for name in en_files:
              check(json.loads((en/name).read_text(encoding='utf-8')), json.loads((hr/name).read_text(encoding='utf-8')), name)
          print(f'PASS: Croatian mirrors all {len(en_files)} English resources.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Croatian management polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/i18n/locales/hr/finance.json \
            src/i18n/locales/hr/transfers.json \
            src/i18n/locales/hr/riderProfile.json \
            src/i18n/locales/hr/preferences.json \
            src/i18n/locales/hr/preferencesDynamic.json \
            src/i18n/locales/hr/notifications.json
          if git diff --cached --quiet; then
            echo 'No Croatian management changes to commit.'
            exit 0
          fi
          git commit -m 'Polish Croatian management localization'
          git pull --rebase origin main
          git push origin main
