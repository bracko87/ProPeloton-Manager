name: Apply structured season-start notification layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-organize-season-start-notification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted notification patch
        run: python .github/scripts/organize_season_start_notification.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit validated notification changes
        run: |
          rm -f .github/workflows/chatgpt-organize-season-start-notification.yml
          rm -f .github/scripts/organize_season_start_notification.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/notifications/notificationTemplates.tsx src/pages/dashboard/NotificationsPage.tsx .github/workflows/chatgpt-organize-season-start-notification.yml .github/scripts/organize_season_start_notification.py
          git commit -m 'Organize season-start deadline notification'
          git pull --rebase origin main
          git push origin main
