name: Apply structured season-start notification layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-organize-season-start-notification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add rich SEASON_STARTED template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/notifications/notificationTemplates.tsx')
          text = path.read_text(encoding='utf-8')
          needle = "  NEW_SEASON_STARTED: {\n"
          assert text.count(needle) == 1, 'Unexpected NEW_SEASON_STARTED registry shape'
          assert "  SEASON_STARTED: {\n" not in text, 'SEASON_STARTED template already exists'

          block = r'''  SEASON_STARTED: {
    defaultTitle: 'Season started',
    defaultMessage:
      'The new season has started. Review the early-January race deadlines carefully.',

    imageSrc:
      'https://okuravitxocyevkexfgi.supabase.co/storage/v1/object/public/Admin%20Staff/Event%20images/new%20season%20started.png',

    getImageSrc: (item) =>
      getImageSrcFromItem(item) ||
      'https://okuravitxocyevkexfgi.supabase.co/storage/v1/object/public/Admin%20Staff/Event%20images/new%20season%20started.png',

    getIntroText: (item) => {
      const payload = getPayload(item)
      const seasonNumber = pickFirstNumber(payload, [
        'season_number',
        'season',
        'target_season',
        'new_season_number',
        'current_season',
      ])

      return seasonNumber !== null
        ? `Season ${seasonNumber} begins with a compressed January race calendar. Early-season application and startlist deadlines are intentionally tighter than normal, so plan the first race block carefully.`
        : 'The season begins with a compressed January race calendar. Early-season application and startlist deadlines are intentionally tighter than normal, so plan the first race block carefully.'
    },

    getDetailRows: (item) => {
      const payload = getPayload(item)
      const seasonNumber = pickFirstNumber(payload, [
        'season_number',
        'season',
        'target_season',
      ])
      const earlyEndDay =
        pickFirstNumber(payload, ['early_january_end_day']) ?? 15
      const earlyApplicationCloseDays =
        pickFirstNumber(payload, [
          'early_january_applications_close_days_before',
        ]) ?? 1
      const earlyTeamListDays =
        pickFirstNumber(payload, [
          'early_january_team_list_days_before',
        ]) ?? 1
      const earlyStartlistHours =
        pickFirstNumber(payload, [
          'early_january_startlist_hours_before_stage1',
        ]) ?? 3
      const lateJanuaryApplicationCloseDays =
        pickFirstNumber(payload, [
          'january_late_applications_close_days_before',
        ]) ?? 7
      const lateJanuaryStartlistDays =
        pickFirstNumber(payload, [
          'january_late_startlist_days_before',
        ]) ?? 3
      const standardApplicationOpenDays =
        pickFirstNumber(payload, [
          'standard_applications_open_days_before',
        ]) ?? 60
      const standardApplicationCloseDays =
        pickFirstNumber(payload, [
          'standard_applications_close_days_before',
        ]) ?? 30
      const standardStartlistDays =
        pickFirstNumber(payload, [
          'standard_startlist_days_before',
        ]) ?? 3

      return compactRows([
        detailRow(
          'Season',
          seasonNumber !== null ? `Season ${seasonNumber}` : 'New season'
        ),
        detailRow(
          `Applications · Jan 1–${earlyEndDay}`,
          `Open Jan 1 · close ${earlyApplicationCloseDays} game day${earlyApplicationCloseDays === 1 ? '' : 's'} before the race`
        ),
        detailRow(
          `Team list · Jan 1–${earlyEndDay}`,
          `Announced ${earlyTeamListDays} game day${earlyTeamListDays === 1 ? '' : 's'} before the race, when applications close`
        ),
        detailRow(
          `Startlist · Jan 1–${earlyEndDay}`,
          `Open until ${earlyStartlistHours} game hour${earlyStartlistHours === 1 ? '' : 's'} before Stage 1`
        ),
        detailRow(
          `Jan ${earlyEndDay + 1}–31`,
          `Applications close ${lateJanuaryApplicationCloseDays} days before · startlist closes ${lateJanuaryStartlistDays} days before`
        ),
        detailRow(
          'From February',
          `Standard schedule: applications open ${standardApplicationOpenDays} days before, close ${standardApplicationCloseDays} days before · startlist closes ${standardStartlistDays} days before`
        ),
      ])
    },

    getExtraText: () =>
      'January is intentionally more compressed than the normal calendar. Check Calendar and Race Detail frequently during the opening race block so you do not miss an application, team-list or startlist deadline.',

    actions: [
      {
        key: 'open-january-calendar',
        label: 'Season calendar',
        variant: 'primary',
        kind: 'navigate',
        getHref: (item) => getActionHrefFromItem(item) || '/dashboard/calendar',
        show: () => true,
      },
      {
        key: 'open-race-preparation',
        label: 'Race preparation',
        variant: 'secondary',
        kind: 'navigate',
        getHref: () => '/dashboard/race-preparation',
        show: () => true,
      },
      {
        key: 'open-season-overview',
        label: 'Season overview',
        variant: 'secondary',
        kind: 'navigate',
        getHref: () => '/dashboard/overview',
        show: () => true,
      },
      MARK_READ_ACTION,
    ],
  },

'''

          text = text.replace(needle, block + needle, 1)
          path.write_text(text, encoding='utf-8')
          print('Added structured SEASON_STARTED notification template.')
          PY

      - name: Organize season-start notification detail card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/NotificationsPage.tsx')
          text = path.read_text(encoding='utf-8')

          map_needle = "                  const isExpanded = expandedId === item.user_notification_id\n"
          map_replacement = map_needle + "                  const isSeasonStartNotice = item.type_code === 'SEASON_STARTED'\n"
          assert text.count(map_needle) == 1, 'Unexpected visible notification map shape'
          text = text.replace(map_needle, map_replacement, 1)

          intro_needle = '''                                  {introText ? (\n                                    <p className=\"text-sm leading-6 text-slate-700\">\n                                      {introText}\n                                    </p>\n                                  ) : null}\n'''
          intro_replacement = '''                                  {introText ? (\n                                    <p\n                                      className={\n                                        isSeasonStartNotice\n                                          ? 'rounded-xl border border-sky-200 bg-sky-50 px-3 py-3 text-sm leading-6 text-slate-700'\n                                          : 'text-sm leading-6 text-slate-700'\n                                      }\n                                    >\n                                      {introText}\n                                    </p>\n                                  ) : null}\n'''
          assert text.count(intro_needle) == 1, 'Unexpected generic notification intro shape'
          text = text.replace(intro_needle, intro_replacement, 1)

          detail_needle = '''                                  {detailRows.length > 0 ? (\n                                    <div className=\"mt-4 space-y-2\">\n                                      {detailRows.map((row, index) => (\n                                        <div\n                                          key={`${item.user_notification_id}-${row.label}-${index}`}\n                                          className=\"text-sm leading-6 text-slate-700\"\n                                        >\n                                          <span className=\"text-slate-600\">{row.label}: </span>\n                                          {String(row.label).trim().toLowerCase() === 'rider' ? (\n                                            renderAdvisorRiderIdentity({\n                                              value: row.value,\n                                              source: getNotificationPayloadRecord(item),\n                                              navigate,\n                                              defaultScope:\n                                                getNotificationRiderDefaultScope(item),\n                                              showFlag: true,\n                                              textClassName:\n                                                'font-semibold text-slate-900',\n                                            })\n                                          ) : (\n                                            <strong className=\"font-semibold text-slate-900\">\n                                              {row.value}\n                                            </strong>\n                                          )}\n                                        </div>\n                                      ))}\n                                    </div>\n                                  ) : null}\n'''
          detail_replacement = '''                                  {detailRows.length > 0 ? (\n                                    <div\n                                      className={\n                                        isSeasonStartNotice\n                                          ? 'mt-4 grid gap-3 sm:grid-cols-2'\n                                          : 'mt-4 space-y-2'\n                                      }\n                                    >\n                                      {detailRows.map((row, index) => (\n                                        <div\n                                          key={`${item.user_notification_id}-${row.label}-${index}`}\n                                          className={\n                                            isSeasonStartNotice\n                                              ? 'rounded-xl border border-slate-200 bg-white px-3 py-3 shadow-sm'\n                                              : 'text-sm leading-6 text-slate-700'\n                                          }\n                                        >\n                                          {isSeasonStartNotice ? (\n                                            <>\n                                              <div className=\"text-[11px] font-semibold uppercase tracking-wide text-slate-500\">\n                                                {row.label}\n                                              </div>\n                                              <div className=\"mt-1 text-sm font-semibold leading-5 text-slate-900\">\n                                                {row.value}\n                                              </div>\n                                            </>\n                                          ) : (\n                                            <>\n                                              <span className=\"text-slate-600\">{row.label}: </span>\n                                              {String(row.label).trim().toLowerCase() === 'rider' ? (\n                                                renderAdvisorRiderIdentity({\n                                                  value: row.value,\n                                                  source: getNotificationPayloadRecord(item),\n                                                  navigate,\n                                                  defaultScope:\n                                                    getNotificationRiderDefaultScope(item),\n                                                  showFlag: true,\n                                                  textClassName:\n                                                    'font-semibold text-slate-900',\n                                                })\n                                              ) : (\n                                                <strong className=\"font-semibold text-slate-900\">\n                                                  {row.value}\n                                                </strong>\n                                              )}\n                                            </>\n                                          )}\n                                        </div>\n                                      ))}\n                                    </div>\n                                  ) : null}\n'''
          assert text.count(detail_needle) == 1, 'Unexpected generic notification detail-row shape'
          text = text.replace(detail_needle, detail_replacement, 1)

          extra_needle = '''                                  {extraText ? (\n                                    <p className=\"mt-4 text-sm leading-6 text-slate-600\">\n                                      {extraText}\n                                    </p>\n                                  ) : null}\n'''
          extra_replacement = '''                                  {extraText ? (\n                                    <p\n                                      className={\n                                        isSeasonStartNotice\n                                          ? 'mt-4 rounded-xl border border-amber-200 bg-amber-50 px-3 py-3 text-sm leading-6 text-amber-900'\n                                          : 'mt-4 text-sm leading-6 text-slate-600'\n                                      }\n                                    >\n                                      {extraText}\n                                    </p>\n                                  ) : null}\n'''
          assert text.count(extra_needle) == 1, 'Unexpected generic notification extra-text shape'
          text = text.replace(extra_needle, extra_replacement, 1)

          path.write_text(text, encoding='utf-8')
          print('Organized SEASON_STARTED detail rendering without changing other notification layouts.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit validated notification changes and remove temporary workflow
        run: |
          rm -f .github/workflows/chatgpt-organize-season-start-notification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/notifications/notificationTemplates.tsx src/pages/dashboard/NotificationsPage.tsx .github/workflows/chatgpt-organize-season-start-notification.yml
          git commit -m 'Organize season-start deadline notification'
          git pull --rebase origin main
          git push origin main
