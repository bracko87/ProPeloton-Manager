name: Saturn isolated migration bootstrap reproducibility (local only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saturn-local-database-bootstrap.yml'
      - 'scripts/saturn-check-migration-chain.mjs'
      - 'tests/saturnMigrationChainIntegrity.test.mjs'
      - 'tests/saturnNationalEquipmentBaselineSeed.test.mjs'
      - 'supabase/migrations/20260929211000_baseline_17_nations_runtime_seed.sql'
      - 'supabase/migrations/20260930185828_nations_stable_groups_capacity_v46.sql'
      - 'tests/saturnWorldNationsFunctionTerminator.test.mjs'
      - 'scripts/saturn-audit-sql-terminators.mjs'
      - 'supabase/migrations/20260930190423_nations_avoid_same_week_as_national_championship_v47.sql'
      - 'supabase/migrations/20261001073328_national_association_next_season_hosting_v48.sql'
      - 'supabase/migrations/20261001073402_control_center_world_nations_hosts_v48.sql'
      - 'supabase/migrations/20261001153500_unified_race_preparation_national_events_v55.sql'
      - 'supabase/migrations/20261001170000_national_jersey_rules_and_test_prep_v57.sql'
      - 'tests/saturnFreshInstallNationsFixture.test.mjs'
      - 'tests/saturnNationalChampionshipHelperBootstrap.test.mjs'
      - 'tests/saturnFreshInstallClubCreationException.test.mjs'
      - 'tests/saturnNotificationTypeSequenceBootstrap.test.mjs'
      - 'tests/saturnYouthAcademyCountrySeed.test.mjs'
      - 'tests/saturnStaffMarketCollisionRetry.test.mjs'
      - 'tests/saturnYouthStaffSalaryCollision.test.mjs'
      - 'tests/saturnYouthAllocationBootstrapDependency.test.mjs'
      - 'tests/saturnYouthRaceStagesFoundation.test.mjs'
      - 'tests/saturnYouthRaceRuntimeCoordinator.test.mjs'
      - 'tests/saturnYouthStageRuntimeHelpers.test.mjs'
      - 'tests/saturnYouthRegionalDivisionBootstrap.test.mjs'
      - 'tests/saturnYouthTeamPointsBootstrap.test.mjs'
      - 'tests/saturnYouthGuardFunctionScan.test.mjs'
      - 'tests/saturnAmericanSamoaRaceCountry.test.mjs'
      - 'supabase/migrations/20261007134000_american_samoa_country_reference_v1.sql'
      - 'supabase/migrations/20261007091500_development_services_access_pricing_v23.sql'
      - 'supabase/migrations/20261006122500_youth_team_ranking_points_fresh_install_v1.sql'
      - 'supabase/migrations/20261005155950_youth_regional_division_bootstrap_v1.sql'
      - 'supabase/migrations/20261005155145_youth_stage_runtime_helpers_fresh_install_v1.sql'
      - 'supabase/migrations/20261005155151_youth_stage_route_cities_v3.sql'
      - 'supabase/migrations/20261005154000_youth_race_stages_fresh_install_foundation_v1.sql'
      - 'supabase/migrations/20261005151711_youth_allocation_hourly_monitoring_v2.sql'
      - 'supabase/migrations/20261004221000_youth_staff_career_courses_payroll_v1.sql'
      - 'supabase/migrations/20261004202500_youth_staff_market_expansion_v1.sql'
      - 'supabase/migrations/20261002173500_youth_academy_phase1_core_v1.sql'
      - 'supabase/migrations/20261002154000_consolidate_national_notifications_v2.sql'
      - 'supabase/migrations/20261002134500_single_club_creation_test_exception_v1.sql'
      - 'supabase/migrations/20261001173000_national_championship_confirmation_helper_bootstrap_v1.sql'
      - 'supabase/migrations/20261001173500_skip_missing_route_national_championships_in_lifecycle_v1.sql'
      - 'supabase/migrations/20261002002500_midseason_national_shadow_fastpath_v4.sql'
      - 'supabase/migrations/20261112171000_world_road_championship_real_startlist_integrity_v1.sql'
      - 'supabase/migrations/20261112174500_national_championship_all_seasons_route_preflight_v1.sql'
      - 'supabase/migrations/20261119115500_secure_admin_finance_statement_rpc_v1.sql'
      - 'supabase/migrations/20261119135500_control_center_verified_release_hold_reporting_v1.sql'
      - 'supabase/migrations/20261119142500_control_center_verified_pause_health_heartbeat_v1.sql'
      - 'supabase/baseline_reproducibility_smoke.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saturnMigrationChainIntegrity.test.mjs tests/saturnNationalEquipmentBaselineSeed.test.mjs tests/saturnWorldNationsFunctionTerminator.test.mjs tests/saturnFreshInstallNationsFixture.test.mjs tests/saturnNationalChampionshipHelperBootstrap.test.mjs tests/saturnFreshInstallClubCreationException.test.mjs tests/saturnNotificationTypeSequenceBootstrap.test.mjs tests/saturnYouthAcademyCountrySeed.test.mjs tests/saturnStaffMarketCollisionRetry.test.mjs tests/saturnYouthStaffSalaryCollision.test.mjs tests/saturnYouthAllocationBootstrapDependency.test.mjs tests/saturnYouthRaceStagesFoundation.test.mjs tests/saturnYouthRaceRuntimeCoordinator.test.mjs tests/saturnYouthStageRuntimeHelpers.test.mjs tests/saturnYouthRegionalDivisionBootstrap.test.mjs tests/saturnYouthTeamPointsBootstrap.test.mjs tests/saturnYouthGuardFunctionScan.test.mjs tests/saturnAmericanSamoaRaceCountry.test.mjs
      - run: node scripts/saturn-check-migration-chain.mjs
      - run: node scripts/saturn-audit-sql-terminators.mjs
      - name: Paid branch replay remains explicitly blocked
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/saturn-check-migration-chain.mjs --require-branch-safe; then
            echo 'ERROR: incompatible production migration history approved'
            exit 1
          fi
          echo 'PASS: incompatible paid branch replay rejected'

  local-supabase-bootstrap:
    needs: migration-identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '3.3.0'
      - name: Initialize isolated local Supabase only
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          # Git-tracked temp project-ref points to production. Remove ONLY in
          # this ephemeral runner; remote use is not authorized by this job.
          rm -rf supabase/.temp
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          supabase init --force
          test -f supabase/config.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/config.toml')
          c = p.read_text()
          match = re.search(r'(?m)^[ \t]*major_version[ \t]*=.*', c)
          if match:
              c = c[:match.start()] + 'major_version = 17' + c[match.end():]
          else:
              assert '[db]' in c
              c = c.replace('[db]', '[db]\nmajor_version = 17', 1)
          # Current CLI requires an explicit import_map setting for
          # legacy Edge Functions. This is CI-local compatibility only.
          for mapping in Path('supabase/functions').glob('*/import_map.json'):
              name = mapping.parent.name
              section = f'[functions.{name}]'
              if section not in c:
                  c += chr(10) + section + chr(10)
                  c += f'import_map = "./functions/{name}/import_map.json"' + chr(10)
          p.write_text(c)
          assert 'major_version = 17' in c
          PY
      - name: Rebuild local schema from tracked migrations
        shell: bash
        run: |
          set -euo pipefail
          # Local Docker only. No Supabase access token or live project link.
          timeout 25m supabase start --debug
      - name: Verify complete local game baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/baseline_reproducibility_smoke.sql
          echo 'PASS: local baseline recreated'
      - name: Stop and remove disposable Docker services
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
