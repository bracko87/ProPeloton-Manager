name: Saturn isolated migration bootstrap reproducibility (local only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saturn-local-database-bootstrap.yml'
      - 'scripts/saturn-check-migration-chain.mjs'
      - 'tests/saturnMigrationChainIntegrity.test.mjs'
      - 'tests/saturnNationalEquipmentBaselineSeed.test.mjs'
      - 'supabase/migrations/20260929211000_baseline_17_nations_runtime_seed.sql'
      - 'supabase/migrations/20260930185828_nations_stable_groups_capacity_v46.sql'
      - 'tests/saturnWorldNationsFunctionTerminator.test.mjs'
      - 'scripts/saturn-audit-sql-terminators.mjs'
      - 'supabase/baseline_reproducibility_smoke.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/saturnMigrationChainIntegrity.test.mjs tests/saturnNationalEquipmentBaselineSeed.test.mjs tests/saturnWorldNationsFunctionTerminator.test.mjs
      - run: node scripts/saturn-check-migration-chain.mjs
      - run: node scripts/saturn-audit-sql-terminators.mjs
      - name: Paid branch replay remains explicitly blocked
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/saturn-check-migration-chain.mjs --require-branch-safe; then
            echo 'ERROR: incompatible production migration history approved'
            exit 1
          fi
          echo 'PASS: incompatible paid branch replay rejected'

  local-supabase-bootstrap:
    needs: migration-identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '3.3.0'
      - name: Initialize isolated local Supabase only
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          # Git-tracked temp project-ref points to production. Remove ONLY in
          # this ephemeral runner; remote use is not authorized by this job.
          rm -rf supabase/.temp
          test ! -e supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          supabase init --force
          test -f supabase/config.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/config.toml')
          c = p.read_text()
          match = re.search(r'(?m)^[ \t]*major_version[ \t]*=.*', c)
          if match:
              c = c[:match.start()] + 'major_version = 17' + c[match.end():]
          else:
              assert '[db]' in c
              c = c.replace('[db]', '[db]\nmajor_version = 17', 1)
          # Current CLI requires an explicit import_map setting for
          # legacy Edge Functions. This is CI-local compatibility only.
          for mapping in Path('supabase/functions').glob('*/import_map.json'):
              name = mapping.parent.name
              section = f'[functions.{name}]'
              if section not in c:
                  c += chr(10) + section + chr(10)
                  c += f'import_map = "./functions/{name}/import_map.json"' + chr(10)
          p.write_text(c)
          assert 'major_version = 17' in c
          PY
      - name: Rebuild local schema from tracked migrations
        shell: bash
        run: |
          set -euo pipefail
          # Local Docker only. No Supabase access token or live project link.
          timeout 25m supabase start --debug
      - name: Verify complete local game baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/baseline_reproducibility_smoke.sql
          echo 'PASS: local baseline recreated'
      - name: Stop and remove disposable Docker services
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
