name: V3 A2 early coordinated passing corridor micro validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2EarlyCorridorV3.mjs'
      - 'scripts/v3/audit-a2-early-corridor-v3.mjs'
      - '.github/workflows/v3-a2-early-corridor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro-corridors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing 2D and micro physical safety checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Probe anticipatory and coordinated movement against swept collision checks
        env:
          V3_A2_CORRIDOR_SIZE: ${{ matrix.riders }}
          V3_A2_CORRIDOR_DIR: ${{ runner.temp }}/corridor-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-early-corridor-v3.mjs
      - name: Archive every actual micro result, even if not sporting-approved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-early-corridor-${{ matrix.riders }}
          path: ${{ runner.temp }}/corridor-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent production app build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
