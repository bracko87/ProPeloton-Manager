name: V3 Batch 41 coordinated 2D corridor shadow
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/coordinatedCorridorV3.mjs'
      - 'scripts/v3/verify-batch41-coordinator-v3.mjs'
      - 'scripts/v3/audit-batch41-coordinator-v3.mjs'
      - '.github/workflows/v3-batch41-coordinator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check concurrent arbitration and exact shadow JSON state
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch41-coordinator-v3.mjs
      - name: Run full reference races and stateful 2D corridor reservations
        env:
          V3_BATCH41_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH41_MODE: ${{ matrix.mode }}
          V3_BATCH41_OUT_DIR: ${{ runner.temp }}/batch41-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch41-coordinator-v3.mjs
      - name: Save complete observed and matched-shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch41-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch41-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Production app build
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
