name: V3 A2 Step59-73 strong-pinched 32-rider passes and full-field feasibility research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2MirrorAndFullFieldProbeV3.mjs'
      - 'scripts/v3/a2FirstContactFeasibilityV3.mjs'
      - 'scripts/v3/a2UpstreamPredictionV3.mjs'
      - 'scripts/v3/a2NormalStartPelotonV3.mjs'
      - 'scripts/v3/verify-a2-step64-normal-start-v3.mjs'
      - 'scripts/v3/verify-a2-step65-coordinated-headway-v3.mjs'
      - 'scripts/v3/verify-a2-step66-passing-intent-v3.mjs'
      - 'scripts/v3/a2SustainedOvertakeObserverV3.mjs'
      - 'scripts/v3/verify-a2-step67-sustained-overtakes-v3.mjs'
      - 'scripts/v3/a2VariableRoadWidthV3.mjs'
      - 'scripts/v3/verify-a2-step68-variable-road-v3.mjs'
      - 'scripts/v3/verify-a2-step69-multi-rider-merge-v3.mjs'
      - 'scripts/v3/a2LaneCapacityPlannerV3.mjs'
      - 'scripts/v3/verify-a2-step70-lane-capacity-v3.mjs'
      - 'scripts/v3/verify-a2-step70-body-clearance-v3.mjs'
      - 'scripts/v3/verify-a2-step71-two-slot-stagger-v3.mjs'
      - 'scripts/v3/a2TwoSlotReservationsV3.mjs'
      - 'scripts/v3/verify-a2-step72-space-time-reservations-v3.mjs'
      - 'scripts/v3/a2TwoSlotFeasibilityV3.mjs'
      - 'scripts/v3/verify-a2-step73-feasibility-v3.mjs'
      - 'scripts/v3/verify-a2-step61-unit-v3.mjs'
      - 'scripts/v3/verify-a2-step60-unit-v3.mjs'
      - 'scripts/v3/verify-a2-step59-symmetry-and-field-v3.mjs'
      - '.github/workflows/v3-a2-step59-symmetry-and-field.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coupled-early-reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A60 isolated bounded lane-intent and contact-audit controls
        run: node scripts/v3/verify-a2-step60-unit-v3.mjs
      - name: A61 isolated upstream warning and earlier-checkpoint unit controls
        run: node scripts/v3/verify-a2-step61-unit-v3.mjs
      - name: Audit all 67 A58-A63 cases with identical-end early starts, symmetry and JSON replays
        env:
          V3_A2_STEP59_DIR: ${{ runner.temp }}/step59
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step59-symmetry-and-field-v3.mjs
      - name: Step64 normal-start sustained 8, 32, 106 and 168-rider pilot, fixed-quantum and recovery controls
        env:
          V3_A2_STEP64_DIR: ${{ runner.temp }}/step64
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step64-normal-start-v3.mjs
      - name: Step65 matched crowded and open-corridor coordinated normal starts
        env:
          V3_A2_STEP65_DIR: ${{ runner.temp }}/step65
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step65-coordinated-headway-v3.mjs
      - name: Step66 matched persistent passing intent for 32 rider 90s and 180s fields
        env:
          V3_A2_STEP66_DIR: ${{ runner.temp }}/step66
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step66-passing-intent-v3.mjs
      - name: Step67 physical sustained overtakes and 106/168 open-corridor screens
        env:
          V3_A2_STEP67_DIR: ${{ runner.temp }}/step67
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step67-sustained-overtakes-v3.mjs
      - name: 'Step68 spatial road narrowing and reopening: 32/106/168 field safety, mirror, replay and controlled rejection'
        env:
          V3_A2_STEP68_DIR: ${{ runner.temp }}/step68
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step68-variable-road-v3.mjs
      - name: 'Step69 multi-rider merge admission: 32/106/168 parity, swept safety and chain recovery'
        env:
          V3_A2_STEP69_DIR: ${{ runner.temp }}/step69
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step69-multi-rider-merge-v3.mjs
      - name: 'Step70 full-peloton road capacity and upstream speed-wave physical comparisons'
        env:
          V3_A2_STEP70_DIR: ${{ runner.temp }}/step70
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step70-lane-capacity-v3.mjs
      - name: 'Step70 bicycle-body clearance and physical two-lane bottleneck capacity'
        env:
          V3_A2_STEP70_DIR: ${{ runner.temp }}/step70
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step70-body-clearance-v3.mjs
      - name: 'Step71 full-bicycle 2-slot longitudinal stagger and honest fail-closed field tests'
        env:
          V3_A2_STEP71_DIR: ${{ runner.temp }}/step71
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step71-two-slot-stagger-v3.mjs
      - name: 'Step72 physical two-slot entry-window and matched no-yield controls, 32/106/168, long sustained passes'
        env:
          V3_A2_STEP72_DIR: ${{ runner.temp }}/step72
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step72-space-time-reservations-v3.mjs
      - name: 'Step73 proof: full 32r 2.2m traversal, real 3s passes, 106/168 fail-closed and impossible entry windows'
        env:
          V3_A2_STEP73_DIR: ${{ runner.temp }}/step73
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step73-feasibility-v3.mjs
      - name: Retain Step73 necessary windows, 32 strong physical passes and rejected large-peloton candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step73-strong-32-full-bicycle-passing-evidence
          path: ${{ runner.temp }}/step73/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step72 actual reservations and independently observed longer mild-road overtakes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step72-physical-reservation-and-control-evidence
          path: ${{ runner.temp }}/step72/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step71 true 2-slot collision and road failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step71-two-slot-stagger-evidence
          path: ${{ runner.temp }}/step71/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step70 group-capacity and bicycle-body-roadside physical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step70-group-capacity-and-body-clearance
          path: ${{ runner.temp }}/step70/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step69 multi-rider zipper and chain first-blocker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step69-multi-rider-merge-chain
          path: ${{ runner.temp }}/step69/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step68 physical width transitions and honest road/collision failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step68-variable-road-width
          path: ${{ runner.temp }}/step68/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step67 crossing, persistent clearance and large-field geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step67-sustained-overtakes-and-corridors
          path: ${{ runner.temp }}/step67/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step66 passing intent, mirror, identity and safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step66-passing-intent-evidence
          path: ${{ runner.temp }}/step66/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step65 matched headway, swept-failure and parity comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step65-cooperative-headway-evidence
          path: ${{ runner.temp }}/step65/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain Step64 normal-start physical and sporting diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step64-normal-start-physical-field-pilot
          path: ${{ runner.temp }}/step64/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain blocked, successful, energy and replayed coupled response cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step59-63-all-field-safety-and-early-start-evidence
          path: ${{ runner.temp }}/step59/*.json
          retention-days: 30
          if-no-files-found: warn
  prior-regressions-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve A58–A39 and complete-stage physics technical gates
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step58-coupled-reaction-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step57-early-brake-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step56-anticipation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step55-velocity-envelope-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step54-shadow-energy-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step53-preacceptance-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step52-isolated-components-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step51-contact-propagation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step50-contact-time-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step49-common-reference-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step48-first-pair-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step47-selective-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step46-corridor-guard-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step45-fallback-fixtures-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step44-priority-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step43-trapezoid-trial-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step42-fixed-quantum-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step41-canonical-mirror-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step40-normalized-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step39-fairness-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Production React application build
        run: npm ci --no-audit --no-fund && npm run build
