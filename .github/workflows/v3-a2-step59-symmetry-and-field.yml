name: V3 A2 Step59-61 symmetry and autonomous upstream-field trials
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2MirrorAndFullFieldProbeV3.mjs'
      - 'scripts/v3/a2FirstContactFeasibilityV3.mjs'
      - 'scripts/v3/a2UpstreamPredictionV3.mjs'
      - 'scripts/v3/verify-a2-step61-unit-v3.mjs'
      - 'scripts/v3/verify-a2-step60-unit-v3.mjs'
      - 'scripts/v3/verify-a2-step59-symmetry-and-field-v3.mjs'
      - '.github/workflows/v3-a2-step59-symmetry-and-field.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coupled-early-reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A60 isolated bounded lane-intent and contact-audit controls
        run: node scripts/v3/verify-a2-step60-unit-v3.mjs
      - name: A61 isolated upstream warning and earlier-checkpoint unit controls
        run: node scripts/v3/verify-a2-step61-unit-v3.mjs
      - name: Audit 67 A58-A61 histories and autonomous field reaction trials
        env:
          V3_A2_STEP59_DIR: ${{ runner.temp }}/step59
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step59-symmetry-and-field-v3.mjs
      - name: Retain blocked, successful, energy and replayed coupled response cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step59-61-symmetry-field-and-upstream-reaction-evidence
          path: ${{ runner.temp }}/step59/*.json
          retention-days: 30
          if-no-files-found: warn
  prior-regressions-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve A58–A39 and complete-stage physics technical gates
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step58-coupled-reaction-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step57-early-brake-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step56-anticipation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step55-velocity-envelope-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step54-shadow-energy-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step53-preacceptance-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step52-isolated-components-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step51-contact-propagation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step50-contact-time-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step49-common-reference-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step48-first-pair-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step47-selective-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step46-corridor-guard-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step45-fallback-fixtures-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step44-priority-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step43-trapezoid-trial-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step42-fixed-quantum-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step41-canonical-mirror-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step40-normalized-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step39-fairness-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Production React application build
        run: npm ci --no-audit --no-fund && npm run build
