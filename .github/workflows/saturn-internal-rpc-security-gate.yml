name: Project Saturn - internal privileged RPC access control

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/20261123081746_saturn_restrict_internal_privileged_rpc_execution_v1.sql'
      - 'supabase/migrations/20261123082058_saturn_restrict_public_global_game_processors_v1.sql'
      - 'supabase/tests/saturn_internal_privileged_rpc_permissions_readonly.sql'
      - 'supabase/tests/saturn_global_game_processor_rpc_permissions_readonly.sql'
      - 'tests/saturnInternalRpcPermissions.test.mjs'
      - 'tests/saturnGlobalProcessorRpcPermissions.test.mjs'
      - '.github/workflows/saturn-internal-rpc-security-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Check targeted RPC grants and production build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test exact RPC grants and non-mutating verification
        run: |
          node --test tests/saturnInternalRpcPermissions.test.mjs
          node --test tests/saturnGlobalProcessorRpcPermissions.test.mjs
      - name: Build frontend without deploying
        run: npm run build
