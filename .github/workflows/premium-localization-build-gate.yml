name: Premium localization build gate

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/ProPackages.tsx'
      - 'src/pages/dashboard/Manual.tsx'
      - 'src/i18n/locales/**/proPackages.json'
      - 'src/i18n/locales/**/manual.json'
      - 'src/pages/dashboard/PremiumCommandCenter.tsx'
      - 'src/pages/dashboard/Training.tsx'
      - 'src/pages/dashboard/training/PremiumRiderDevelopmentPanel.tsx'
      - 'src/pages/dashboard/CalendarPage.tsx'
      - 'src/pages/dashboard/calendar/PremiumSeasonPlannerPanel.tsx'
      - 'src/pages/dashboard/equipment/components/EquipmentOverviewTab.tsx'
      - 'src/pages/dashboard/Finance.tsx'
      - 'src/pages/dashboard/Transfers.tsx'
      - 'src/pages/dashboard/RacePreparation.tsx'
      - 'src/pages/dashboard/Overview.tsx'
      - 'src/features/squad/components/RiderProfilePage.tsx'
      - 'src/components/layout/Sidebar.tsx'
      - 'src/i18n/index.ts'
      - 'src/i18n/locales/**/premiumCenter.json'
      - 'src/i18n/locales/**/navigation.json'
      - 'scripts/check-i18n.mjs'
      - 'package.json'
      - '.github/workflows/premium-localization-build-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/ProPackages.tsx'
      - 'src/pages/dashboard/Manual.tsx'
      - 'src/i18n/locales/**/proPackages.json'
      - 'src/i18n/locales/**/manual.json'
      - 'src/pages/dashboard/PremiumCommandCenter.tsx'
      - 'src/pages/dashboard/Training.tsx'
      - 'src/pages/dashboard/training/PremiumRiderDevelopmentPanel.tsx'
      - 'src/pages/dashboard/CalendarPage.tsx'
      - 'src/pages/dashboard/calendar/PremiumSeasonPlannerPanel.tsx'
      - 'src/pages/dashboard/equipment/components/EquipmentOverviewTab.tsx'
      - 'src/pages/dashboard/Finance.tsx'
      - 'src/pages/dashboard/Transfers.tsx'
      - 'src/pages/dashboard/RacePreparation.tsx'
      - 'src/pages/dashboard/Overview.tsx'
      - 'src/features/squad/components/RiderProfilePage.tsx'
      - 'src/components/layout/Sidebar.tsx'
      - 'src/i18n/index.ts'
      - 'src/i18n/locales/**/premiumCenter.json'
      - 'src/i18n/locales/**/navigation.json'
      - 'scripts/check-i18n.mjs'
      - 'package.json'
      - '.github/workflows/premium-localization-build-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run check:i18n

      - name: Validate Pro Packages EUR catalog
        shell: bash
        run: |
          grep -F "const PRO_PREMIUM_PRICE_EUR = 3.29" src/pages/ProPackages.tsx
          grep -F "coins_70: 2.99" src/pages/ProPackages.tsx
          grep -F "coins_130: 4.99" src/pages/ProPackages.tsx
          grep -F "coins_270: 9.99" src/pages/ProPackages.tsx
          grep -F "coins_390: 13.99" src/pages/ProPackages.tsx
          grep -F "coins_570: 19.99" src/pages/ProPackages.tsx
          grep -F "coins_900: 29.99" src/pages/ProPackages.tsx
          grep -F 'return `€${safeValue.toFixed(2)}`' src/pages/ProPackages.tsx

      - name: Production build
        run: npm run build
