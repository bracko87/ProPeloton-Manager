name: Add Russian localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-add-russian-localization.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  russian:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers sentencepiece

      - name: Generate complete Russian locale package
        run: python .github/scripts/add_russian_localization_20260831.py

      - name: Apply Russian cycling terminology polish
        run: python .github/scripts/polish_russian_baseline_20260831.py

      - name: Russian structural and semantic gate
        shell: bash
        run: python .github/scripts/audit_russian_completion_20260831.py | tee /tmp/russian-completion.txt

      - name: Russian human quality gate
        run: python .github/scripts/audit_russian_human_quality_20260831.py

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push Russian package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/locales/ru src/i18n/languages.ts src/i18n/index.ts src/components/i18n/LanguageSelector.tsx src/components/i18n/LocaleDateFormattingBridge.tsx
          if git diff --cached --quiet; then
            echo 'No Russian changes to commit.'
            exit 0
          fi
          git commit -m 'Add Russian language package'
          git pull --rebase origin main
          git push origin main

      - name: Upload Russian completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-completion-audit
          path: /tmp/russian-completion.txt
          retention-days: 3
          if-no-files-found: warn
