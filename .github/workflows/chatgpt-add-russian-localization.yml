name: Add Russian localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-add-russian-localization.yml'
      - '.github/scripts/add_russian_localization_20260831.py'
      - '.github/scripts/add_russian_localization_v2_20260831.py'
      - '.github/scripts/add_russian_localization_v3_20260831.py'
      - '.github/scripts/translate_russian_shard_20260831.py'
      - '.github/scripts/assemble_russian_shards_20260831.py'
      - '.github/scripts/polish_russian_baseline_20260831.py'
      - '.github/scripts/polish_russian_quality_v2_20260831.py'
      - '.github/scripts/polish_russian_final_20260831.py'
      - '.github/scripts/polish_russian_human_final_20260831.py'
      - '.github/scripts/polish_russian_visible_v3_20260831.py'
      - '.github/scripts/polish_russian_visible_v4_20260831.py'
      - '.github/scripts/audit_russian_completion_20260831.py'
      - '.github/scripts/audit_russian_human_quality_20260831.py'
  workflow_dispatch:

concurrency:
  group: russian-localization-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translate:
    name: russian-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU translation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers sentencepiece

      - name: Translate Russian shard
        env:
          RU_SHARD_INDEX: ${{ matrix.shard }}
          RU_SHARD_COUNT: '4'
          RU_SHARD_OUTPUT: .russian-shard
        run: python .github/scripts/translate_russian_shard_20260831.py

      - name: Upload Russian shard
        uses: actions/upload-artifact@v4
        with:
          name: russian-shard-${{ matrix.shard }}
          path: .russian-shard/*.json
          retention-days: 1
          if-no-files-found: error

  finalize:
    name: russian-final
    needs: translate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download translated Russian shards
        uses: actions/download-artifact@v4
        with:
          pattern: russian-shard-*
          path: .russian-merged
          merge-multiple: true

      - name: Assemble Russian package
        run: python .github/scripts/assemble_russian_shards_20260831.py

      - name: Apply Russian cycling and human-quality polish
        run: python .github/scripts/polish_russian_quality_v2_20260831.py

      - name: Apply final reviewed Russian fixes
        run: python .github/scripts/polish_russian_final_20260831.py

      - name: Apply final Russian human-quality fixes
        run: python .github/scripts/polish_russian_human_final_20260831.py

      - name: Apply polished Russian core UI
        run: python .github/scripts/polish_russian_visible_v3_20260831.py

      - name: Apply additional Russian core-page polish
        run: python .github/scripts/polish_russian_visible_v4_20260831.py

      - name: Russian structural and semantic gate
        shell: bash
        run: python .github/scripts/audit_russian_completion_20260831.py | tee /tmp/russian-completion.txt

      - name: Russian human quality gate
        run: python .github/scripts/audit_russian_human_quality_20260831.py

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push Russian package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/locales/ru src/i18n/languages.ts src/i18n/index.ts src/components/i18n/LanguageSelector.tsx src/components/i18n/LocaleDateFormattingBridge.tsx
          if git diff --cached --quiet; then
            echo 'No Russian changes to commit.'
            exit 0
          fi
          git commit -m 'Finish Russian language package'
          git pull --rebase origin main
          git push origin main

      - name: Upload Russian completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-completion-audit
          path: /tmp/russian-completion.txt
          retention-days: 3
          if-no-files-found: warn
