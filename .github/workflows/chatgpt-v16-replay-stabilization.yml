name: ChatGPT V16 Replay Stabilization

on:
  push:
    branches:
      - chatgpt-v16-replay-stabilization-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-v16-replay-stabilization-20260915
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Inspect physical transition anchors
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/universal-race-engine/runRaceEngine.ts')
          lines = path.read_text().splitlines()
          needles = [
              'physicalTransitionPublished',
              'post_catch_group_transfer_without_physical_transition',
              'pointPhysicalStateKm',
              'checkpointIdSuffix',
              'group_split',
              'bridge_attack',
              'escapeStillActive = false',
              'phase10BuildExactEventReplayTimeline',
          ]
          emitted = set()
          for needle in needles:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'=== {needle}: {len(matches)} matches ===')
              for i in matches[:8]:
                  start = max(0, i - 28)
                  end = min(len(lines), i + 45)
                  key = (start, end)
                  if key in emitted:
                      continue
                  emitted.add(key)
                  print(f'--- lines {start+1}-{end} ---')
                  for n in range(start, end):
                      print(f'{n+1:06d}: {lines[n]}')

      - name: Apply V16 replay-state engine patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/universal-race-engine/runRaceEngine.ts')
          source = path.read_text()

          import_anchor = """import {
            applyRoadScenarioFinishFragmentationV1,
            applyRoadScenarioGapGuidanceV1,
          } from './roadScenarioPhysicalDirectorV1.ts'
          """
          helper_import = """import { shouldCommitPhase10FinalRoadStateV16 } from './replayPhysicalStateV16.ts'
          """
          if helper_import not in source:
              if import_anchor not in source:
                  raise SystemExit('V16 import anchor not found')
              source = source.replace(import_anchor, import_anchor + helper_import, 1)

          if 'shouldCommitPhase10FinalRoadStateV16(checkpoint)' not in source:
              pattern = re.compile(
                  r"(?P<i>[ \t]+)const isWinnerFinishCheckpoint = checkpoint\.commentary\.some\(\s*"
                  r"\(entry\) => entry\.eventType === 'finish',\s*"
                  r"\)\s*"
                  r"if \(\s*"
                  r"isRoadFinishKmCheckpoint &&\s*"
                  r"!checkpoint\.finalResultsVisible &&\s*"
                  r"!isWinnerFinishCheckpoint\s*"
                  r"\) \{"
              )
              replacement = (
                  "      const commitsFinalRoadPhysicalState =\n"
                  "        shouldCommitPhase10FinalRoadStateV16(checkpoint)\n"
                  "      if (\n"
                  "        isRoadFinishKmCheckpoint &&\n"
                  "        commitsFinalRoadPhysicalState\n"
                  "      ) {"
              )
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'V16 finish-state patch anchor count was {count}, expected 1')

          path.write_text(source)

      - name: Refresh current integration contract assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/universal-race-engine/runRaceEngine.test.ts')
          source = path.read_text()

          old_gate = "'const resultsVisible = currentFrame?.finalResultsVisible === true',"
          new_gate = "'currentFrame?.finalResultsVisible === true',"
          if old_gate in source:
              source = source.replace(old_gate, new_gate, 1)

          lifecycle_anchor = "    expect(source).toContain('{result && resultsVisible ? (')"
          lifecycle_assertion = "    expect(source).toContain('officialLifecycleResultsVisible &&')\n"
          if lifecycle_assertion not in source:
              if lifecycle_anchor not in source:
                  raise SystemExit('Replay visibility lifecycle anchor not found')
              source = source.replace(
                  lifecycle_anchor,
                  lifecycle_assertion + lifecycle_anchor,
                  1,
              )

          source = source.replace(
              "it('publishes the Phase 11L V5.5 late-chase-eligibility build marker', () => {",
              "it('publishes the active Phase 11L V6 scenario-director build marker', () => {",
              1,
          )
          source = source.replace(
              "'phase11l-v5-5-late-chase-eligibility-2026-09-11',",
              "'phase11l-v6-scenario-director-flat-hilly-2026-09-13',",
              1,
          )

          if "'currentFrame?.finalResultsVisible === true'" not in source:
              raise SystemExit('Checkpoint visibility contract assertion was not installed')
          if "'officialLifecycleResultsVisible &&'" not in source:
              raise SystemExit('Official lifecycle visibility contract assertion was not installed')
          if "'phase11l-v6-scenario-director-flat-hilly-2026-09-13'" not in source:
              raise SystemExit('Current engine build marker assertion was not installed')

          path.write_text(source)

      - name: Install dependencies
        run: npm ci

      - name: Run V16 focused regression tests
        run: npx --yes vitest@2.1.9 run src/universal-race-engine/replayPhysicalStateV16.test.ts

      - name: Run full universal race-engine tests
        shell: bash
        run: |
          set +e
          npx --yes vitest@2.1.9 run src/universal-race-engine/runRaceEngine.test.ts --reporter=verbose > /tmp/v16-full-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '--- V16 concise full-suite failure report ---'
            grep -n -E 'FAIL|AssertionError|expected|received|Expected|Received|Test Files|Tests|Error:' /tmp/v16-full-test.log | tail -n 240 || true
            echo '--- final 180 log lines ---'
            tail -n 180 /tmp/v16-full-test.log
          else
            tail -n 80 /tmp/v16-full-test.log
          fi
          exit "$code"

      - name: Production build
        run: npm run build

      - name: Commit verified V16 stabilization
        run: |
          if git diff --quiet -- src/universal-race-engine/runRaceEngine.ts src/universal-race-engine/runRaceEngine.test.ts; then
            echo 'Verified V16 patch already committed.'
            exit 0
          fi
          git config user.name 'chatgpt-v16-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/universal-race-engine/runRaceEngine.ts src/universal-race-engine/runRaceEngine.test.ts
          git commit -m 'Stabilize V16 replay physical finish state'
          git push origin HEAD:chatgpt-v16-replay-stabilization-20260915
