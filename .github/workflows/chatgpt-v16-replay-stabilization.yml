name: ChatGPT V16 Replay Stabilization

on:
  push:
    branches:
      - chatgpt-v16-replay-stabilization-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-v16-replay-stabilization-20260915
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply V16 replay-state engine patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/universal-race-engine/runRaceEngine.ts')
          source = path.read_text()

          import_anchor = """import {
            applyRoadScenarioFinishFragmentationV1,
            applyRoadScenarioGapGuidanceV1,
          } from './roadScenarioPhysicalDirectorV1.ts'
          """
          helper_import = """import { shouldCommitPhase10FinalRoadStateV16 } from './replayPhysicalStateV16.ts'
          """
          if helper_import not in source:
              if import_anchor not in source:
                  raise SystemExit('V16 import anchor not found')
              source = source.replace(import_anchor, import_anchor + helper_import, 1)

          if 'shouldCommitPhase10FinalRoadStateV16(checkpoint)' not in source:
              pattern = re.compile(
                  r"(?P<i>[ \\t]+)const isWinnerFinishCheckpoint = checkpoint\\.commentary\\.some\\(\\s*"
                  r"\\(entry\\) => entry\\.eventType === 'finish',\\s*"
                  r"\\)\\s*"
                  r"if \\(\\s*"
                  r"isRoadFinishKmCheckpoint &&\\s*"
                  r"!checkpoint\\.finalResultsVisible &&\\s*"
                  r"!isWinnerFinishCheckpoint\\s*"
                  r"\\) \\{"
              )
              replacement = (
                  "      const commitsFinalRoadPhysicalState =\\n"
                  "        shouldCommitPhase10FinalRoadStateV16(checkpoint)\\n"
                  "      if (\\n"
                  "        isRoadFinishKmCheckpoint &&\\n"
                  "        commitsFinalRoadPhysicalState\\n"
                  "      ) {"
              )
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'V16 finish-state patch anchor count was {count}, expected 1')

          path.write_text(source)

      - name: Install dependencies
        run: npm ci

      - name: Run V16 focused regression tests
        run: npx --yes vitest@2.1.9 run src/universal-race-engine/replayPhysicalStateV16.test.ts

      - name: Run full universal race-engine tests
        shell: bash
        run: |
          set +e
          npx --yes vitest@2.1.9 run src/universal-race-engine/runRaceEngine.test.ts --reporter=verbose > /tmp/v16-full-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '--- V16 concise full-suite failure report ---'
            grep -n -E 'FAIL|AssertionError|expected|received|Expected|Received|Test Files|Tests|Error:' /tmp/v16-full-test.log | tail -n 240 || true
            echo '--- final 180 log lines ---'
            tail -n 180 /tmp/v16-full-test.log
          else
            tail -n 80 /tmp/v16-full-test.log
          fi
          exit "$code"

      - name: Production build
        run: npm run build

      - name: Commit verified engine patch
        run: |
          if git diff --quiet -- src/universal-race-engine/runRaceEngine.ts; then
            echo 'Engine patch already committed.'
            exit 0
          fi
          git config user.name 'chatgpt-v16-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/universal-race-engine/runRaceEngine.ts
          git commit -m 'Stabilize V16 replay physical finish state'
          git push origin HEAD:chatgpt-v16-replay-stabilization-20260915
