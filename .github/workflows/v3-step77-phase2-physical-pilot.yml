name: V3 A77 phase2 real swept five-abreast multi-gate candidate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2MultiGateAdmissionV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step77-physical-pilot-v3.mjs'
      - 'scripts/v3/probe-a2-step77-physical-policies-v3.mjs'
      - 'scripts/v3/verify-a2-step77-phase2-staged-success-v3.mjs'
      - 'scripts/v3/probe-a2-step77-neutral-rolling-start-v3.mjs'
      - 'scripts/v3/probe-a2-step77-chain-coupling-v3.mjs'
      - '.github/workflows/v3-step77-phase2-physical-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase2-physical-counterexamples:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A77 physical candidate with honest 8/32/106/168 full-body sweeps, geometry, restart and mirror tests
        env:
          V3_A2_STEP77_PHYSICAL_DIR: ${{ runner.temp }}/step77physics
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step77-physical-pilot-v3.mjs
      - name: Compare 32r candidate braking and corridor policy permutations without weakening sweeps
        env:
          V3_A2_STEP77_PROBE_DIR: ${{ runner.temp }}/step77probe
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/probe-a2-step77-physical-policies-v3.mjs
      - name: Validate 32r five-abreast 180s staged coupled sweeps, 90+90 replay, mirror parity, independent overtakes, larger field counterexamples
        env:
          V3_A2_STEP77_STAGED_DIR: ${{ runner.temp }}/step77staged
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step77-phase2-staged-success-v3.mjs
      - name: Protect Step76 32 106 168 180s real sustained passes and collision-free narrowings
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/step76pass
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Test physical 32 106 168 equal-speed rolling starts on two narrowing profiles
        env:
          V3_A2_STEP77_NEUTRAL_DIR: ${{ runner.temp }}/step77neutral
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/probe-a2-step77-neutral-rolling-start-v3.mjs
      - name: Compare existing bounded chain and yielding for 32 106 168 five-abreast fields
        env:
          V3_A2_STEP77_CHAIN_DIR: ${{ runner.temp }}/step77chain
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/probe-a2-step77-chain-coupling-v3.mjs
      - name: Preserve first-contact and passage evidence even if physical candidate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a77-phase2-actual-physical-body-sweeps
          path: |
            ${{ runner.temp }}/step77physics/*.json
            ${{ runner.temp }}/step77probe/*.json
            ${{ runner.temp }}/step77staged/*.json
            ${{ runner.temp }}/step77neutral/*.json
            ${{ runner.temp }}/step77chain/*.json
            ${{ runner.temp }}/step76pass/*.json
          if-no-files-found: warn
          retention-days: 30
