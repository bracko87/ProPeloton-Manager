name: Finish Serbian Latin manual localization 2026-08-28

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-localize-full-manual-sr-latn-20260828.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --quiet sentencepiece protobuf 'transformers==4.53.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Retranslate all 92 manual sections
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/localize_full_manual_sr_latn_20260828.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("TARGET_LANG = 'srp_Cyrl'", "TARGET_LANG = 'hrv_Latn'"),
              ('BATCH_SIZE = 12', 'BATCH_SIZE = 24'),
              ('num_beams=3', 'num_beams=1'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing translator anchor: {old}')
              text = text.replace(old, new, 1)

          post_anchor = "]\n\n\ndef load_json"
          post_extra = """    (r'\\btakođer\\b', 'takođe'),
              (r'\\bTakođer\\b', 'Takođe'),
              (r'\\bsustav\\b', 'sistem'),
              (r'\\bSustav\\b', 'Sistem'),
              (r'\\bsustavi\\b', 'sistemi'),
              (r'\\bSustavi\\b', 'Sistemi'),
              (r'\\bizvješće\\b', 'izveštaj'),
              (r'\\bIzvješće\\b', 'Izveštaj'),
              (r'\\bizvješća\\b', 'izveštaji'),
              (r'\\bIzvješća\\b', 'Izveštaji'),
              (r'\\brazina\\b', 'nivo'),
              (r'\\bRazina\\b', 'Nivo'),
              (r'\\brazine\\b', 'nivoi'),
              (r'\\bRazine\\b', 'Nivoi'),
              (r'\\bsljedeći\\b', 'sledeći'),
              (r'\\bSljedeći\\b', 'Sledeći'),
              (r'\\bsljedeća\\b', 'sledeća'),
              (r'\\bSljedeća\\b', 'Sledeća'),
              (r'\\bsljedeće\\b', 'sledeće'),
              (r'\\bSljedeće\\b', 'Sledeće'),
              (r'\\btrenutačno\\b', 'trenutno'),
              (r'\\bTrenutačno\\b', 'Trenutno'),
              (r'\\btočka\\b', 'tačka'),
              (r'\\bTočka\\b', 'Tačka'),
              (r'\\btočke\\b', 'tačke'),
              (r'\\bTočke\\b', 'Tačke'),
              (r'\\bodjeljak\\b', 'odeljak'),
              (r'\\bOdjeljak\\b', 'Odeljak'),
              (r'\\bodjeljci\\b', 'odeljci'),
              (r'\\bOdjeljci\\b', 'Odeljci'),
              (r'\\bsmještaj\\b', 'smeštaj'),
              (r'\\bSmještaj\\b', 'Smeštaj'),
              (r'\\bizbornik\\b', 'meni'),
              (r'\\bIzbornik\\b', 'Meni'),
              (r'\\bpovijest\\b', 'istorija'),
              (r'\\bPovijest\\b', 'Istorija'),
              (r'\\btjedan\\b', 'nedelja'),
              (r'\\bTjedan\\b', 'Nedelja'),
              (r'\\btjedni\\b', 'nedeljni'),
              (r'\\bTjedni\\b', 'Nedeljni'),
              (r'\\bmjesec\\b', 'mesec'),
              (r'\\bMjesec\\b', 'Mesec'),
              (r'\\bmjesečni\\b', 'mesečni'),
              (r'\\bMjesečni\\b', 'Mesečni'),
              (r'\\bnatjecanje\\b', 'takmičenje'),
              (r'\\bNatjecanje\\b', 'Takmičenje'),
              (r'\\bnatjecanja\\b', 'takmičenja'),
              (r'\\bNatjecanja\\b', 'Takmičenja'),
              (r'\\busporedba\\b', 'poređenje'),
              (r'\\bUsporedba\\b', 'Poređenje'),
          ]


def load_json"""
          if post_anchor not in text:
              raise SystemExit('POST_REPLACEMENTS closing anchor not found')
          text = text.replace(post_anchor, post_extra, 1)

          memory_anchor = "    memory = build_translation_memory()\n"
          memory_replacement = """    memory = build_translation_memory()
              memory.update({
                  'Inbox': 'Sanduče',
                  'Footer': 'Podnožje',
                  'Referral URL': 'URL preporuke',
                  'Forum': 'Forum',
              })
          """
          if memory_anchor not in text:
              raise SystemExit('translation memory anchor not found')
          text = text.replace(memory_anchor, memory_replacement, 1)

          validation_old = """    if len(english_fallbacks) > 3:
                  problems.extend(f'English fallback: {item}' for item in english_fallbacks[:20])
          """
          validation_new = """    technical_fallback_markers = (
                  'JPG, PNG, WEBP',
                  'create-coin-checkout Edge Function',
                  'WorldTeam, ProTeam, Continental, Amateur',
                  'ProTeam West, ProTeam East',
                  'Forum',
                  'coin_packages',
                  'get_my_coin_status',
                  'create-coin-checkout',
                  "user_coin_ledger reason='purchase'",
                  'club-logos',
                  'club_branding_lock_status_v1',
              )
              english_fallbacks = [
                  item for item in english_fallbacks
                  if not any(item.endswith(marker) for marker in technical_fallback_markers)
              ]
              if len(english_fallbacks) > 3:
                  problems.extend(f'English fallback: {item}' for item in english_fallbacks[:20])
          """
          if validation_old not in text:
              raise SystemExit('English fallback validation anchor not found')
          text = text.replace(validation_old, validation_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/localize_full_manual_sr_latn_20260828.py

      - name: Verify manual structure and quality
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          en = json.loads(Path('src/i18n/locales/en/manual.json').read_text(encoding='utf-8'))
          sr = json.loads(Path('src/i18n/locales/sr-Latn/manual.json').read_text(encoding='utf-8'))

          assert len(en['sections']) == 92
          assert len(sr['sections']) == 92
          assert set(en['sections']) == set(sr['sections'])
          assert sr['ui']['title'] == 'ProPeloton Manager priručnik'

          text = json.dumps(sr, ensure_ascii=False)
          forbidden = ['ZXQ', 'ZIK', 'QXml', '�', 'Ã', 'Â', 'jahač', 'rasni svet']
          for marker in forbidden:
              assert marker.lower() not in text.lower(), marker
          assert not re.search(r'[\u0400-\u04ff]', text), 'Cyrillic remained in sr-Latn manual'

          # Terms intentionally retained in English by the game vocabulary.
          for term in ['Race Plan', 'Stage Plans', 'Startlist', 'Race Engine', 'Coins']:
              assert term in text, f'Missing preserved game term: {term}'

          print('Verified 92 Serbian Latin manual sections with no known corruption markers.')
          PY

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit finished Serbian manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/locales/sr-Latn/manual.json
          if git diff --cached --quiet; then
            echo 'No manual changes to commit.'
            exit 0
          fi
          git commit -m 'Finish Serbian Latin game manual translation'
          git push origin main
