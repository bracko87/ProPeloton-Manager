name: Localize full manual Serbian Latin 2026-08-28

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-localize-full-manual-sr-latn-20260828.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --quiet json5 sentencepiece sacremoses 'transformers==4.53.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate manual English and Serbian resources
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/localize_full_manual_sr_latn_20260828.py')
          text = path.read_text(encoding='utf-8')

          extractor_old = "    array_start = source.index('[', start)"
          extractor_new = "    array_start = source.index('= [', start) + 2"
          if extractor_old not in text:
              raise SystemExit('manual array extractor anchor not found')
          text = text.replace(extractor_old, extractor_new, 1)

          loop_old = "    for old, new in replacements:\n        source = replace_once(source, old, new, f'UI replacement: {old[:60]}')"
          loop_new = "    for old, new in replacements:\n        count = source.count(old)\n        if count < 1:\n            raise SystemExit(f'UI replacement missing: {old[:60]}')\n        source = source.replace(old, new)"
          if loop_old not in text:
              raise SystemExit('manual UI replacement loop anchor not found')
          text = text.replace(loop_old, loop_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/localize_full_manual_sr_latn_20260828.py

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify complete manual localization
        run: |
          test -f src/i18n/locales/en/manual.json
          test -f src/i18n/locales/sr-Latn/manual.json
          grep -q "useTranslation('manual')" src/pages/dashboard/Manual.tsx
          grep -q "manual: srManual" src/i18n/index.ts
          python - <<'PY'
          import json
          from pathlib import Path
          en = json.loads(Path('src/i18n/locales/en/manual.json').read_text())
          sr = json.loads(Path('src/i18n/locales/sr-Latn/manual.json').read_text())
          assert len(en['sections']) == 92, len(en['sections'])
          assert len(sr['sections']) == 92, len(sr['sections'])
          assert set(en['sections']) == set(sr['sections'])
          assert sr['ui']['title'] == 'ProPeloton Manager priručnik'
          print('Verified 92 localized manual sections.')
          PY

      - name: Commit localized manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/Manual.tsx src/i18n/index.ts src/i18n/locales/en/manual.json src/i18n/locales/sr-Latn/manual.json
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'Localize full game manual in Serbian Latin'
          git push origin main
