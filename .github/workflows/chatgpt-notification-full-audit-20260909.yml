name: Full notification localization audit 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/chatgpt-notification-full-audit-20260909.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all notification text sources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path

          root = Path('.')
          locales = ['en','sr-Latn','de','hr','es','it','fr','ru']
          allowed = {'.ts','.tsx','.js','.mjs','.sql','.json'}
          needles = [
            "Today's stage-plan review shows",
            'Open Stage Plans to complete the nearest deadlines first',
            'stage-plan review',
            'Stage Planning Daily Report',
            'Stage Plan Reminders',
            'Application Daily Update',
            'Race Application Daily Update',
            'Prijava Dnevni',
            'Podsetnici za plan etape',
            'missing at lock',
            'locking soon',
            'locked recently',
            'Priority:',
          ]

          print('=== EXACT / SCREENSHOT PHRASE SOURCE MATCHES ===')
          matches = []
          for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in allowed:
              continue
            try:
              lines = path.read_text(encoding='utf-8').splitlines()
            except Exception:
              continue
            for i, line in enumerate(lines, 1):
              if any(n.lower() in line.lower() for n in needles):
                matches.append((str(path), i, line.strip()))
          for path, i, line in matches:
            print(f'{path}:{i}: {line}')
          print('MATCH COUNT', len(matches))

          print('\n=== NOTIFICATION-RELATED SOURCE FILES WITH ENGLISH SENTENCE LITERALS ===')
          sentence_re = re.compile(r"(['\"])([^'\"\n]{18,220}[.!?])\1")
          suspicious = []
          candidate_paths = []
          for base in [root/'src/features/notifications', root/'src/pages/dashboard/NotificationsPage.tsx', root/'supabase']:
            if base.is_file():
              candidate_paths.append(base)
            elif base.exists():
              candidate_paths.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in allowed)
          for path in candidate_paths:
            try: text = path.read_text(encoding='utf-8')
            except Exception: continue
            if 'notification' not in text.lower() and 'advisor' not in text.lower():
              continue
            for i, line in enumerate(text.splitlines(),1):
              if len(line) > 500: continue
              for m in sentence_re.finditer(line):
                value=m.group(2).strip()
                if re.search(r'\b(the|your|you|is|are|was|were|has|have|will|can|review|open|stage|race|rider|team|notification|application|plan|deadline|missing|current|next|today|available|required)\b', value, re.I):
                  suspicious.append((str(path),i,value))
          for path,i,value in suspicious:
            print(f'{path}:{i}: {value}')
          print('SUSPICIOUS SENTENCE COUNT',len(suspicious))

          print('\n=== TEMPLATE REGISTRY DEFAULT TITLES / MESSAGES ===')
          registry_files = [
            root/'src/features/notifications/notificationTemplatesBase.tsx',
            root/'src/features/notifications/notificationTemplates.tsx',
          ]
          for path in registry_files:
            if not path.exists(): continue
            text=path.read_text(encoding='utf-8')
            for i,line in enumerate(text.splitlines(),1):
              if re.search(r'\b(defaultTitle|defaultMessage|title|message)\s*:', line) and ('"' in line or "'" in line or '`' in line):
                print(f'{path}:{i}: {line.strip()}')

          print('\n=== TYPE CODES FOUND IN NOTIFICATION SOURCES ===')
          types=set()
          type_patterns=[
            re.compile(r"['\"]([A-Z][A-Z0-9_]{3,})['\"]\s*:\s*\{"),
            re.compile(r"(?:type_code|typeCode|p_type_code)\s*(?:=>|:=|=|:|,)\s*['\"]([A-Z][A-Z0-9_]{3,})['\"]",re.I),
            re.compile(r"['\"]([A-Z][A-Z0-9_]{3,})['\"]"),
          ]
          for path in candidate_paths:
            try:text=path.read_text(encoding='utf-8')
            except:continue
            if 'notification' not in text.lower() and 'type_code' not in text.lower():continue
            for pat in type_patterns:
              for m in pat.finditer(text):
                code=m.group(1)
                if any(x in code for x in ['RACE','STAGE','TRAIN','SCOUT','STAFF','RIDER','SPONSOR','FINANCE','EQUIP','INFRA','SEASON','TEAM','APPLICATION','HEALTH','DOCTOR','MECHANIC','ADVIS']):
                  types.add(code)
          for code in sorted(types): print(code)
          print('TYPE COUNT',len(types))

          def flatten(obj,prefix=''):
            out={}
            if isinstance(obj,dict):
              for k,v in obj.items(): out.update(flatten(v,f'{prefix}.{k}' if prefix else k))
            else: out[prefix]=obj
            return out
          bundles={l:json.loads((root/f'src/i18n/locales/{l}/notifications.json').read_text(encoding='utf-8')) for l in locales}
          flat={l:flatten(b) for l,b in bundles.items()}
          en=flat['en']

          print('\n=== LOCALE KEY PARITY ===')
          for l in locales:
            missing=sorted(set(en)-set(flat[l]))
            extra=sorted(set(flat[l])-set(en))
            print(l,'keys',len(flat[l]),'missing',len(missing),'extra',len(extra))
            if missing:
              for k in missing[:80]: print(' MISSING',k)

          print('\n=== SEMANTIC TYPE TITLE COVERAGE ===')
          for code in sorted(types):
            key=f'semanticTypeTitles.{code}'
            present=[l for l in locales if isinstance(flat[l].get(key),str) and flat[l].get(key).strip()]
            if len(present)!=len(locales):
              print(code,'semantic title coverage',len(present),'/',len(locales),'present=',','.join(present))

          print('\n=== NON-EN VALUES IDENTICAL TO ENGLISH (NOTIFICATION-SPECIFIC KEYS) ===')
          prefixes=('semanticTypeTitles.','semanticTypeMessages.','semanticTypeEntityTitles.','templateLocalization.feed.','reportVariants.')
          for l in locales[1:]:
            identical=[]
            for k,v in flat[l].items():
              if not k.startswith(prefixes): continue
              if isinstance(v,str) and isinstance(en.get(k),str) and v.strip()==en[k].strip() and re.search(r'[A-Za-z]{3,}',v):
                identical.append((k,v))
            print('\n',l,'IDENTICAL COUNT',len(identical))
            for k,v in identical[:100]: print(' ',k,'=',v)

          print('\n=== SCREENSHOT CATEGORY / TYPE KEYS ===')
          for l in locales:
            print('\nLOCALE',l)
            for key in [
              'categories.stagePlanReminders','categories.raceApplicationResults',
              'templateLocalization.genericTitle','templateLocalization.genericMessage',
            ]:
              print(key,'=',flat[l].get(key))
          PY
