name: V3 A2 Step36 causal isolation of substep instability
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-step36-causal-isolation-v3.mjs'
      - '.github/workflows/v3-a2-step36-causal-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate free movement steering following and contested merges at 2 2.5 5 sec
        env:
          V3_A2_STEP36_DIR: ${{ runner.temp }}/step36
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step36-causal-isolation-v3.mjs
      - name: Keep all matched fixture outcomes and numerical failure data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step36-causal-isolation
          path: ${{ runner.temp }}/step36/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Step35 original sensitivity and other nonlinear physical regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step35-substep-sensitivity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-substep-physical-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Verify production application build
        run: npm ci --no-audit --no-fund && npm run build
