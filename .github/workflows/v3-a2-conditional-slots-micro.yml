name: V3 A2 conditional time slots safety
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2ConditionalCorridorV3.mjs'
      - 'scripts/v3/verify-a2-conditional-corridor-v3.mjs'
      - '.github/workflows/v3-a2-conditional-slots-micro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conditional, timed corridor and original physics tests
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-conditional-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-timed-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Independent app build
        run: npm ci --no-audit --no-fund && npm run build
