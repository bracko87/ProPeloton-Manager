name: V3 Step84 mirrored identity and 8/32 full-sporting audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/verify-a2-step84-physical-parity-replay-v3.mjs'
      - '.github/workflows/v3-step84-full-field-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-field-mirror-and-sporting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A84 all 16 true reflected renamed fields and full 8 32 180s original physics independent observer
        env:
          V3_A2_STEP84_PARITY_DIR: ${{ runner.temp }}/a84long
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step84-physical-parity-replay-v3.mjs
      - name: Protected A78 32 five-abreast staged 180s with 87 true three-second sustained passes
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Upload truthful symmetric and actual race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a84-full-32-physical-and-identity-safety
          path: |
            ${{ runner.temp }}/a84long/*.json
            ${{ runner.temp }}/a78/*.json
          if-no-files-found: warn
          retention-days: 30
