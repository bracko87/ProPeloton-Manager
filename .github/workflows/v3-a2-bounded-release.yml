name: V3 A2 bounded outer-lane release comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-bounded-release-v3.mjs'
      - 'scripts/v3/a2BoundedLaneReleaseV3.mjs'
      - '.github/workflows/v3-a2-bounded-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded release, collision, energy and checkpoint regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-lane-release-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-current-lane-first-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Full matched 2–6 rider policy comparison
        env:
          V3_A2_HOLD_SIZE: ${{ matrix.riders }}
          V3_A2_HOLD_DIR: ${{ runner.temp }}/a2-bounded-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-bounded-release-v3.mjs
      - name: Archive each sporting and technical outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-bounded-release-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-bounded-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent production application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
