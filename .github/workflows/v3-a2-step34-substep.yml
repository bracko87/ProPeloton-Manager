name: V3 A2 Step34 synchronized physical and energy substeps
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2SubstepPhysicalResearchV3.mjs'
      - 'scripts/v3/verify-a2-substep-physical-v3.mjs'
      - '.github/workflows/v3-a2-step34-substep.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synchronized-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronized substep positions power energy and checkpoint
        env:
          V3_A2_STEP34_DIR: ${{ runner.temp }}/a34
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-substep-physical-v3.mjs
      - name: Previous path-collision and accepted lane-slot regression tests
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Preserve A34 complete generated track and ledger summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-step34-synchronized-physics
          path: ${{ runner.temp }}/a34/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Build application with i18n
        run: npm ci --no-audit --no-fund && npm run build
