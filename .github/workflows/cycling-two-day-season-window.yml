name: Cycling two-day season transition validation

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/season/CyclingSeasonWindowBoundary.tsx'
      - 'src/components/season/CyclingAdminInspection.tsx'
      - 'src/features/squad/components/RiderProfilePage.tsx'
      - 'src/pages/dashboard/riders/RiderProfilePublicPage.tsx'
      - 'src/pages/dashboard/Finance.tsx'
      - 'src/pages/dashboard/finance/FinanceSeasonHistory.tsx'
      - 'src/pages/dashboard/WorldChampionshipExpectedField.tsx'
      - 'src/pages/dashboard/WorldChampionshipPastWinners.tsx'
      - 'src/pages/dashboard/RaceDetailPage.tsx'
      - 'tests/worldRoadChampionshipPastWinners.test.mjs'
      - 'tests/worldRoadChampionshipStartlistIntegrity.test.mjs'
      - 'supabase/migrations/20261112171000_world_road_championship_real_startlist_integrity_v1.sql'
      - 'supabase/migrations/20261112122700_cycling_private_migration_inspection_v1.sql'
      - 'tests/cyclingMigrationInspector.test.mjs'
      - 'tests/cyclingSeason2PostMigrationCorrections.test.mjs'
      - 'supabase/migrations/20261112135000_cycling_youth_academy_balance_alias_fix_v1.sql'
      - 'supabase/migrations/20261112135500_cycling_exclude_nation_only_from_club_last_races_v1.sql'
      - 'supabase/migrations/20261112140000_cycling_club_finance_historical_season_report_v1.sql'
      - 'supabase/migrations/20261111143000_cycling_two_day_season_window_v1.sql'
      - 'tests/cyclingTwoDaySeasonWindow.test.mjs'
      - '.github/workflows/cycling-two-day-season-window.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycling-two-day-season-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify season window lock, release checks, and safe 2x resume
        run: node --test tests/cyclingTwoDaySeasonWindow.test.mjs tests/cyclingMigrationInspector.test.mjs tests/cyclingSeason2PostMigrationCorrections.test.mjs tests/worldRoadChampionshipPastWinners.test.mjs tests/worldRoadChampionshipStartlistIntegrity.test.mjs
      - name: Verify protected website build
        run: npm run build
