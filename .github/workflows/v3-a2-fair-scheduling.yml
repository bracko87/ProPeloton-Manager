name: V3 A2 bounded two-sided lane fairness 2-6 rider comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-fair-scheduling-v3.mjs'
      - '.github/workflows/v3-a2-fair-scheduling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing lane safety and physics isolation
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-fair-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-corridor-reservation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Compare baseline old lease consent refusal and two-sided release
        env:
          V3_A2_FAIR_SIZE: ${{ matrix.riders }}
          V3_A2_FAIR_DIR: ${{ runner.temp }}/a2-fair-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-fair-scheduling-v3.mjs
      - name: Preserve per-rider progress and release outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-fair-scheduling-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-fair-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: App production build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
