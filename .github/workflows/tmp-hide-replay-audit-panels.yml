name: Hide race replay audit panels

on:
  push:
    branches:
      - fix/hide-replay-audit-panels
    paths:
      - .github/workflows/tmp-hide-replay-audit-panels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-replay-audit-panels
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove replay audit panels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RaceDetailPage.tsx')
          text = path.read_text(encoding='utf-8')

          phase78 = 'Phase 7 + Phase 8 acceptance audit'
          phase10 = 'Phase 10 deterministic incidents and rider statuses'
          phase9 = 'Phase 9 weather, preparation and resource audit'
          next_block = '\n          {result && resultsVisible ? ('

          marker_index = text.find(phase78)
          if marker_index == -1:
              raise SystemExit('Phase 7/8 audit panel marker not found')

          start = text.rfind('\n          {result ? (', 0, marker_index)
          if start == -1:
              raise SystemExit('Could not locate start of Phase 7/8 audit section')

          end = text.find(next_block, marker_index)
          if end == -1:
              raise SystemExit('Could not locate replay-complete block after audit panels')

          removed = text[start:end]
          for marker in (phase78, phase10, phase9):
              if marker not in removed:
                  raise SystemExit(f'Expected audit marker missing from removal block: {marker}')

          # Keep the replay-complete message and actual Stage profile replay below it.
          text = text[:start] + '\n' + text[end:]
          path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          for marker in (phase78, phase10, phase9):
              if marker in updated:
                  raise SystemExit(f'Audit panel still visible in JSX: {marker}')
          if 'Replay complete ·' not in updated:
              raise SystemExit('Replay complete summary was removed accidentally')
          if "t('replay.profile')" not in updated:
              raise SystemExit('Stage profile replay was removed accidentally')

          print('Removed Phase 7/8, Phase 10 and Phase 9 audit panels from replay UI.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-hide-replay-audit-panels.yml
          git add src/pages/dashboard/RaceDetailPage.tsx
          git commit -m "Hide replay audit statistic panels"
          git push origin HEAD:fix/hide-replay-audit-panels
