name: V3 A2 observed lane-claim continuity Step 30 matched grid stress
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-claim-continuity-v3.mjs'
      - 'scripts/v3/a2ActiveClaimSwitchV3.mjs'
      - 'scripts/v3/verify-a2-claim-continuity-v3.mjs'
      - '.github/workflows/v3-a2-claim-continuity-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original solver, persistence and claim-continuity micro regression
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-active-claim-switch-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-claim-continuity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-lane-release-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-current-lane-first-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Compare six retained-intent policies over matched starting lanes
        env:
          V3_A2_CONTINUITY_SIZE: ${{ matrix.riders }}
          V3_A2_CONTINUITY_DIR: ${{ runner.temp }}/continuity-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-claim-continuity-v3.mjs
      - name: Preserve detailed safety and sporting outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-active-continuity-${{ matrix.riders }}
          path: ${{ runner.temp }}/continuity-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify independent application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
