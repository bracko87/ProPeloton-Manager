name: V3 Step107 global two-lane spatial reservations original A64
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step107GlobalLaneReservationsV3.mjs'
      - 'scripts/v3/verify-a2-step107-*.mjs'
      - '.github/workflows/v3-step107-global-lane-reservations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-replay-and-original-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Global two-lane reservation invariants, actual A64 and exact replay
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step107-micro-v3.mjs
  large-fields-original-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Twenty-four actual A64 106/168 rider up-to-180s physical attempts
        env:
          V3_A2_STEP107_DIR: ${{ runner.temp }}/step107
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step107-large-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step107-global-lane-physical-evidence
          path: ${{ runner.temp }}/step107/*.json
          if-no-files-found: error
  preserve-eight-second-rule-and-protected-a64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: User exact eight-second peloton group merge and split invariant
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - name: Step86 protected original 32 rider full 180-second A64 benchmark
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
