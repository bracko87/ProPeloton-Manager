name: ChatGPT Phase 1 runner pin

on:
  push:
    branches:
      - chatgpt-phase1-runner-pin-20260911
    paths:
      - .github/workflows/chatgpt-phase1-runner-pin-20260911.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-phase1-runner-pin-20260911
          fetch-depth: 0

      - name: Pin production runner to validated Phase 1 engine
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/universal-race-stage-runner/index.ts')
          text = path.read_text()
          old = '667a2197775281d7431fac96687daec2a32f8bba'
          new = 'ee143a20cd74b7fe371ede346aca2b1583dc3306'

          if text.count(old) != 4:
              raise SystemExit(f'Expected exactly four primary source pins, found {text.count(old)}')
          if new in text:
              raise SystemExit('New Phase 1 source pin unexpectedly already present')

          text = text.replace(old, new)

          if text.count(new) != 4 or old in text:
              raise SystemExit('Primary source pin replacement did not complete cleanly')
          if text.count('90fc6ce06197f4537b6088d30252b60025f39253') < 4:
              raise SystemExit('Emergency V5.2 fallback pin changed unexpectedly')
          if f'const SOURCE_COMMIT = "{new}";' not in text:
              raise SystemExit('SOURCE_COMMIT does not match the Phase 1 engine commit')

          path.write_text(text)

      - name: Validate runner source pin
        run: |
          grep -q 'const SOURCE_COMMIT = "ee143a20cd74b7fe371ede346aca2b1583dc3306";' supabase/functions/universal-race-stage-runner/index.ts
          test "$(grep -o 'ee143a20cd74b7fe371ede346aca2b1583dc3306' supabase/functions/universal-race-stage-runner/index.ts | wc -l)" -eq 4

      - name: Commit runner pin and remove helper workflow
        run: |
          rm .github/workflows/chatgpt-phase1-runner-pin-20260911.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/universal-race-stage-runner/index.ts .github/workflows/chatgpt-phase1-runner-pin-20260911.yml
          git commit -m "Pin race runner to Phase 1 selective finish engine"
          git pull --rebase origin chatgpt-phase1-runner-pin-20260911
          git push origin HEAD:chatgpt-phase1-runner-pin-20260911
