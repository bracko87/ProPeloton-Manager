name: V3 A2 unilateral yield feasibility diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/simultaneousCrossingAwareResolveV3.mjs'
      - 'scripts/v3/simultaneousCrossingAwareMicroV3.mjs'
      - 'scripts/v3/verify-a2-yield-options-v3.mjs'
      - '.github/workflows/v3-a2-yield-options.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instrumentation parity and existing safety checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-yield-options-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-crossing-aware-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-targeted-yield-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Application production build
        run: npm ci --no-audit --no-fund && npm run build
