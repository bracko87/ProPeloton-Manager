name: Add Italian localization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_italian_localization_20260831.py'
      - '.github/workflows/chatgpt-add-italian-localization.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  italian:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers sentencepiece

      - name: Generate complete Italian locale package
        run: python .github/scripts/add_italian_localization_20260831.py

      - name: Validate Italian structure and placeholders
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          en_dir = root / 'src/i18n/locales/en'
          it_dir = root / 'src/i18n/locales/it'
          en_files = sorted(p.name for p in en_dir.glob('*.json'))
          it_files = sorted(p.name for p in it_dir.glob('*.json'))
          assert en_files == it_files, (len(en_files), len(it_files), set(en_files) ^ set(it_files))

          ph = re.compile(r'\{\{[^{}]+\}\}')
          def walk(a, b, path=''):
              assert type(a) is type(b), f'type mismatch {path}'
              if isinstance(a, dict):
                  assert list(a) == list(b), f'key/order mismatch {path}'
                  for k in a:
                      walk(a[k], b[k], f'{path}.{k}' if path else k)
              elif isinstance(a, list):
                  assert len(a) == len(b), f'list mismatch {path}'
                  for i, (x, y) in enumerate(zip(a, b)):
                      walk(x, y, f'{path}[{i}]')
              elif isinstance(a, str):
                  assert sorted(ph.findall(a)) == sorted(ph.findall(b)), f'placeholder mismatch {path}'

          for name in en_files:
              walk(
                  json.loads((en_dir / name).read_text(encoding='utf-8')),
                  json.loads((it_dir / name).read_text(encoding='utf-8')),
                  name,
              )

          languages = (root / 'src/i18n/languages.ts').read_text(encoding='utf-8')
          for needle in ["code: 'it'", "label: 'Italiano'", "flag: '🇮🇹'", "countryCode: 'IT'", "locale: 'it-IT'"]:
              assert needle in languages, needle

          index = (root / 'src/i18n/index.ts').read_text(encoding='utf-8')
          assert "./locales/it/accountPages.json" in index
          assert '\n  it: {\n' in index
          supported = re.search(r"supportedLngs:\s*\[([^\]]+)\]", index)
          assert supported and re.search(r"['\"]it['\"]", supported.group(1))

          bridge = (root / 'src/components/i18n/LocaleDateFormattingBridge.tsx').read_text(encoding='utf-8')
          assert "startsWith('it')" in bridge and "'it-IT'" in bridge

          print(f'Italian structural validation passed: {len(it_files)} resources')
          PY

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit and push complete Italian package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/locales/it src/i18n/index.ts src/i18n/languages.ts src/components/i18n/LocaleDateFormattingBridge.tsx src/components/i18n/LanguageSelector.tsx
          if git diff --cached --quiet; then
            echo "No Italian changes to commit"
            exit 0
          fi
          git commit -m "Add complete Italian language package"
          git pull --rebase origin main
          git push origin main
