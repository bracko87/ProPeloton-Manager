name: V3 Step99 persistent whole-peloton gate claims with original A64
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step99PersistentReservationsV3.mjs'
      - 'scripts/v3/a2Step98LongHorizonPhysicalChoiceV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step99-*.mjs'
      - '.github/workflows/v3-step99-global-trajectory.yml'
  workflow_dispatch:
jobs:
  pure-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step99-persistent-reservations-v3.mjs
      - run: node scripts/v3/verify-a2-step98-global-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step97-feasibility-v3.mjs
      - run: node scripts/v3/verify-a2-step96-local-gap-v3.mjs
      - run: node scripts/v3/verify-a2-step95-moving-gate-v3.mjs
      - run: node scripts/v3/verify-a2-step94-relative-closure-v3.mjs
      - run: node scripts/v3/verify-a2-step93-rolling-start-v3.mjs
      - run: node scripts/v3/verify-a2-step92-cohort-geometry-v3.mjs
      - run: node scripts/v3/verify-a2-step91-leases-v3.mjs
      - run: node scripts/v3/verify-a2-step90-row-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step85-throughput-v3.mjs
      - run: node scripts/v3/verify-a2-step78-joint-viability-v3.mjs
  large-106-168-original-a64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step99-large-full-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step99-global-large-physical
          path: /tmp/a98large
          if-no-files-found: warn
  parity-and-8-32-overtake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step99-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step99-persistent-physical-mirror
          path: /tmp/a98parity
          if-no-files-found: warn
  production-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
