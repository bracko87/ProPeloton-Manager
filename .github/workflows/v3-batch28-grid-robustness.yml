name: V3 Batch 28 grid robustness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/gridRobustnessV3.mjs'
      - 'scripts/v3/verify-grid-robustness-v3.mjs'
      - 'scripts/v3/audit-batch28-grid-robustness-v3.mjs'
      - '.github/workflows/v3-batch28-grid-robustness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, combined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure rank/initial-grid metric invariants
        run: node scripts/v3/verify-grid-robustness-v3.mjs
      - name: Offline full-stage multi-seed grid and wind robustness
        env:
          V3_BATCH28_MODE: ${{ matrix.mode }}
          V3_BATCH28_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH28_OUT_DIR: ${{ runner.temp }}/batch28-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch28-grid-robustness-v3.mjs
      - name: Save full rider, order and group evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch28-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch28-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Build production application
        if: matrix.mode == 'energy' && matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
