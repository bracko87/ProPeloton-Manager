name: V3 Step88 physical whole-row coupled occupancy research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step88CoupledRowFlowV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step88-coupled-physical-v3.mjs'
      - '.github/workflows/v3-step88-coupled-row-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-swept-row-occupancy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step88 true row occupancy, geometry symmetry, A64 8 32 106 168 five-wide 16 case matrix
        env:
          V3_A2_STEP88_DIR: ${{ runner.temp }}/a88
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step88-coupled-physical-v3.mjs
      - name: Protect Step87 two-gate physical corridor scheduling and mirror unit tests
        env:
          V3_A2_STEP87_DIR: ${{ runner.temp }}/a87
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - name: Protect Step86 actual physical gap and early 16 five-wide fields
        env:
          V3_A2_STEP86_DIR: ${{ runner.temp }}/a86
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - name: Protect Step78 full 32 five-wide staged 180s 87 real 3 second passing and replay
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: Protect Step76 32 106 168 three-wide full180 58 151 198 genuine passes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Publish exact original physical regression JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a88-coupled-row-original-swept-physical-evidence
          path: |
            ${{ runner.temp }}/a88/*.json
            ${{ runner.temp }}/a87/*.json
            ${{ runner.temp }}/a86/*.json
            ${{ runner.temp }}/a78/*.json
            ${{ runner.temp }}/a76/*.json
          retention-days: 30
          if-no-files-found: warn
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
