name: V3 Step103 original A64 pre-taper longitudinal clearance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step103PreTaperClearanceV3.mjs'
      - 'scripts/v3/verify-a2-step103-*.mjs'
      - '.github/workflows/v3-step103-pretaper-clearance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro-real-A64-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five bounded pre-taper controllers and exact physical restart
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step103-micro-v3.mjs
  real-106-168-five-wide-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original A64 five policies x two field sizes x two road narrowings
        env:
          V3_A2_STEP103_DIR: ${{ runner.temp }}/step103
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step103-large-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step103-original-a64-longitudinal-opening
          path: ${{ runner.temp }}/step103/*.json
          if-no-files-found: error
  protected-old-sport-and-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step101 exact eight-second dynamic peloton group rule
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - name: Step86 protected original A64 32 rider full 180s baseline
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
