name: V3 A2 unique durable overtakes and grid stability
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2PersistentPassesV3.mjs'
      - 'scripts/v3/verify-a2-persistent-passes-v3.mjs'
      - 'scripts/v3/audit-a2-persistent-passes-v3.mjs'
      - '.github/workflows/v3-a2-persistent-passes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistent-passing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        riders: [12, 24, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Passing duration observer, collision and historical isolation
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-targeted-yield-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Three starting grids with two conflict resolvers
        env:
          V3_A2_PASS_RIDERS: ${{ matrix.riders }}
          V3_A2_PASS_DIR: ${{ runner.temp }}/persistent-passes-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-persistent-passes-v3.mjs
      - name: Archive full per-pair event history and grid comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-persistent-passes-${{ matrix.riders }}
          path: ${{ runner.temp }}/persistent-passes-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Build production application
        if: matrix.riders == 12
        run: npm ci --no-audit --no-fund && npm run build
