name: V3 Batch 38 persistent queues and multi-tick passing shadows
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/queueReservationV3.mjs'
      - 'scripts/v3/verify-batch38-queues-v3.mjs'
      - 'scripts/v3/audit-batch38-queues-v3.mjs'
      - '.github/workflows/v3-batch38-steering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queues:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Queue persistence, safety and W-prime tests
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch38-queues-v3.mjs
      - name: Full baseline stages and conservative multi-tick steering shadows
        env:
          V3_BATCH38_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH38_MODE: ${{ matrix.mode }}
          V3_BATCH38_OUT_DIR: ${{ runner.temp }}/batch38-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch38-queues-v3.mjs
      - name: Preserve research evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch38-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch38-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify application build
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
