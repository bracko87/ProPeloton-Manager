name: Polish Croatian secondary core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-polish-croatian-secondary-core.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Croatian secondary core polish
        run: python .github/scripts/polish_croatian_secondary_core_20260830.py
      - name: Validate Croatian secondary core
        run: python .github/scripts/validate_croatian_secondary_core_20260830.py
      - name: Validate all Croatian schemas and placeholders
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('src/i18n/locales'); en=root/'en'; hr=root/'hr'; ph=re.compile(r'\{\{[^{}]+\}\}')
          e=sorted(p.name for p in en.glob('*.json')); h=sorted(p.name for p in hr.glob('*.json'))
          assert e==h
          def check(a,b,path):
              assert type(a) is type(b), f'{path}: type mismatch'
              if isinstance(a,dict):
                  assert list(a)==list(b), f'{path}: key/order mismatch'
                  for k in a: check(a[k],b[k],f'{path}.{k}')
              elif isinstance(a,list):
                  assert len(a)==len(b), f'{path}: list length mismatch'
                  for i,(x,y) in enumerate(zip(a,b)): check(x,y,f'{path}[{i}]')
              elif isinstance(a,str):
                  assert sorted(ph.findall(a))==sorted(ph.findall(b)), f'{path}: placeholder mismatch'
          for n in e: check(json.loads((en/n).read_text(encoding='utf-8')),json.loads((hr/n).read_text(encoding='utf-8')),n)
          print(f'PASS: all {len(e)} Croatian resources preserve canonical structure/placeholders.')
          PY
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit Croatian secondary core polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/i18n/locales/hr/scouting.json \
            src/i18n/locales/hr/statistics.json \
            src/i18n/locales/hr/teamRanking.json \
            src/i18n/locales/hr/staff.json \
            src/i18n/locales/hr/proPackages.json \
            src/i18n/locales/hr/seasonReset.json \
            src/i18n/locales/hr/sharedRiderModal.json
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'Polish Croatian secondary UI localization'
          git pull --rebase origin main
          git push origin main
