name: V3 A2 targeted simultaneous conflict micro safety
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/simultaneousTargetedResolveV3.mjs'
      - 'scripts/v3/simultaneousTargetedMicroV3.mjs'
      - 'scripts/v3/verify-a2-targeted-yield-v3.mjs'
      - '.github/workflows/v3-a2-targeted-yield.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical and targeted collision energy and replay micro
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-targeted-yield-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Application production build
        run: npm ci --no-audit --no-fund && npm run build
