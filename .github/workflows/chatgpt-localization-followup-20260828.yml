name: Apply localization follow-up 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-localization-followup-20260828.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply localization follow-up
        run: python .github/scripts/run_chatgpt_localization_followup_20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit localization fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/dashboard/Training.tsx \
            src/pages/dashboard/Infrastructure.tsx \
            src/pages/dashboard/infrastructure/AssetsSection.tsx \
            src/pages/dashboard/infrastructure/infrastructureHelpers.ts \
            src/pages/dashboard/RaceDetailPage.tsx \
            src/i18n/locales/en/training.json \
            src/i18n/locales/sr-Latn/training.json \
            src/i18n/locales/en/infrastructure.json \
            src/i18n/locales/sr-Latn/infrastructure.json \
            src/i18n/locales/en/raceDetail.json \
            src/i18n/locales/sr-Latn/raceDetail.json

          if git diff --cached --quiet; then
            echo "No localization changes to commit."
            exit 0
          fi

          git commit -m "Finish Serbian localization follow-up"
          git push origin main
