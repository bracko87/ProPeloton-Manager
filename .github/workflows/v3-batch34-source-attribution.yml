name: V3 Batch 34 source power and wheel attribution
on:
  push:
    branches: [main]
    paths:
      - 'src/race-engine-v3/coupledRoadRaceResearchV3.ts'
      - 'scripts/v3/audit-batch34-source-constraints-v3.mjs'
      - 'scripts/v3/pairedConstraintAttributionV3.mjs'
      - 'scripts/v3/verify-batch34-source-trace-v3.mjs'
      - '.github/workflows/v3-batch34-source-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict research TypeScript check
        run: npx --yes --package typescript@5.9.3 tsc --strict --noEmit --target ES2022 --module nodenext --moduleResolution nodenext --allowImportingTsExtensions src/race-engine-v3/coupledRoadRaceResearchV3.ts
      - name: Source observer invariance and pure attribution tests
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch34-source-trace-v3.mjs
      - name: Frozen paired full-race simulation source attribution
        env:
          V3_BATCH34_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH34_MODE: ${{ matrix.mode }}
          V3_BATCH34_OUT_DIR: ${{ runner.temp }}/batch34-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch34-source-constraints-v3.mjs
      - name: Save empirical source-level per-rider differences
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch34-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch34-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Production application build
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
