name: V3 A2 Step33 nonlinear within-tick path realism audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2NonlinearSweepAuditV3.mjs'
      - 'scripts/v3/verify-a2-nonlinear-sweep-v3.mjs'
      - '.github/workflows/v3-a2-step33-nonlinear.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adversarial nonlinear and 8 to 32 rider audit
        env:
          V3_A2_STEP33_DIR: ${{ runner.temp }}/step33
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-step33-nonlinear
          path: ${{ runner.temp }}/step33/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Unchanged V3 physical and A32 lane slot regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Production build and i18n
        run: npm ci --no-audit --no-fund && npm run build
