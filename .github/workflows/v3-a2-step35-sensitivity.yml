name: V3 A2 Step35 substep numerical sensitivity (offline only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-step35-substep-sensitivity-v3.mjs'
      - '.github/workflows/v3-a2-step35-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare identical 2s 2.5s 5s rider controls and physical ledgers
        env:
          V3_A2_STEP35_DIR: ${{ runner.temp }}/step35
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step35-substep-sensitivity-v3.mjs
      - name: Retain per-fixture 60s position gap ordering and energy differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step35-sensitivity-results
          path: ${{ runner.temp }}/step35/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Unchanged Step34 Step33 Step32 and stage technical regression tests
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-substep-physical-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Build production React application
        run: npm ci --no-audit --no-fund && npm run build
