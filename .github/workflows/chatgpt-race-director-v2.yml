name: ChatGPT Race Director V2

on:
  push:
    branches:
      - chatgpt-race-director-v2-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-director-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-race-director-v2-20260915
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Race Director V2 focused tests
        run: npx --yes vitest@2.1.9 run src/universal-race-engine/roadRaceDirectorV2.test.ts --reporter=verbose

      - name: Run V16 replay regression tests
        run: npx --yes vitest@2.1.9 run src/universal-race-engine/replayPhysicalStateV16.test.ts

      - name: Run full universal race-engine tests
        run: npx --yes vitest@2.1.9 run src/universal-race-engine/runRaceEngine.test.ts

      - name: Production build
        run: npm run build
