name: V3 A2 two-sided lane fairness micro
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2FairCorridorSchedulingV3.mjs'
      - 'scripts/v3/verify-a2-fair-corridor-v3.mjs'
      - '.github/workflows/v3-a2-fair-corridor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fair consent and original physical regression
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-fair-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-corridor-reservation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Independent app build
        run: npm ci --no-audit --no-fund && npm run build
