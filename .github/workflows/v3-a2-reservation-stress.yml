name: V3 A2 acknowledged reservation vs moving blocker micro comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-corridor-reservation-v3.mjs'
      - '.github/workflows/v3-a2-reservation-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consent micro and canonical collision/energy/regression tests
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-corridor-reservation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Run nonclairvoyant 2-6 rider corridor reservation comparison
        env:
          V3_A2_LEASE_SIZE: ${{ matrix.riders }}
          V3_A2_LEASE_DIR: ${{ runner.temp }}/a2-reservation-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-corridor-reservation-v3.mjs
      - name: Archive proof and sporting failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-reservation-${{ matrix.riders }}
          path: ${{ runner.temp }}/a2-reservation-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Independent application production build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
