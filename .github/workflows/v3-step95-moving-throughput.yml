name: V3 Step95 achieved moving-throughput fail-closed original A64
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step95MovingPhysicalGateV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step95-*.mjs'
      - '.github/workflows/v3-step95-moving-throughput.yml'
  workflow_dispatch:
jobs:
  unit-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step95-moving-gate-v3.mjs
      - run: node scripts/v3/verify-a2-step94-relative-closure-v3.mjs
      - run: node scripts/v3/verify-a2-step93-rolling-start-v3.mjs
      - run: node scripts/v3/verify-a2-step92-cohort-geometry-v3.mjs
      - run: node scripts/v3/verify-a2-step91-leases-v3.mjs
      - run: node scripts/v3/verify-a2-step90-row-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step85-throughput-v3.mjs
      - run: node scripts/v3/verify-a2-step78-joint-viability-v3.mjs
  physical-full-106-168:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step95-large-full-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a95-original-A64-no-crawl-106-168
          path: /tmp/a95large
          if-no-files-found: warn
  physical-8-32-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step95-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a95-original-A64-8-32-replay
          path: /tmp/a95parity
          if-no-files-found: warn
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
