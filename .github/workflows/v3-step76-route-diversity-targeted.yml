name: V3 Step76 double narrowing and five-abreast peloton research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2VariableRoadWidthV3.mjs'
      - 'scripts/v3/a2TwoSlotFeasibilityV3.mjs'
      - 'scripts/v3/a2NormalStartPelotonV3.mjs'
      - 'scripts/v3/verify-a2-step76-route-diversity-v3.mjs'
      - '.github/workflows/v3-step76-route-diversity-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-multi-bottleneck-and-five-abreast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Step76 synthetic second pinch physical sweeps, body valid five-lane grid, mirrored and ID independent rejection'
        env:
          V3_A2_STEP76_DIR: ${{ runner.temp }}/step76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-route-diversity-v3.mjs
      - name: Keep Step76 first physical contact and explicit no window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step76-double-road-five-abreast
          path: ${{ runner.temp }}/step76/*.json
          retention-days: 30
          if-no-files-found: warn
