name: V3 Batch 36 frozen-mechanics factorial
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/frozenFactorialV3.mjs'
      - 'scripts/v3/verify-batch36-frozen-factorial-v3.mjs'
      - 'scripts/v3/audit-batch36-mechanics-v3.mjs'
      - '.github/workflows/v3-batch36-frozen-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
        mode: [energy, finite_pass]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify matched-state mechanics and nonmutation
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch36-frozen-factorial-v3.mjs
      - name: Three-grid two-weather full-roster factorial and unchanged final racing
        env:
          V3_BATCH36_FIXTURE: ${{ matrix.fixture }}
          V3_BATCH36_MODE: ${{ matrix.mode }}
          V3_BATCH36_OUT_DIR: ${{ runner.temp }}/batch36-${{ matrix.fixture }}-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch36-mechanics-v3.mjs
      - name: Preserve full source-level shadow and real baseline finishes
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch36-${{ matrix.fixture }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/batch36-${{ matrix.fixture }}-${{ matrix.mode }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Build production application
        if: matrix.fixture == 'dordrecht-2000-10-15' && matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
