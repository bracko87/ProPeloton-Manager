name: Apply Stage Supply effects UI fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-stage-supply-effects-20260901.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Stage Supply preview patch
        run: python3 .github/scripts/chatgpt_fix_stage_supply_effects_20260901.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit fix and remove one-off files
        run: |
          rm -f .github/workflows/chatgpt-fix-stage-supply-effects-20260901.yml
          rm -f .github/scripts/chatgpt_fix_stage_supply_effects_20260901.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/RacePreparation.tsx .github/workflows/chatgpt-fix-stage-supply-effects-20260901.yml .github/scripts/chatgpt_fix_stage_supply_effects_20260901.py
          git commit -m 'Show Stage Supply effects in final calculation'
          git pull --rebase origin main
          git push origin main
