name: Apply Medical Center infrastructure UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-medical-center-ui-20260902.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Medical Center facility display
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/infrastructure/FacilitiesSection.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old_maintenance = "  medical_center: [0, 10000, 25000, 55000, 100000, 170000],"
          new_maintenance = "  medical_center: [0, 2500, 5000, 8000, 13000, 20000],"
          assert text.count(old_maintenance) == 1, f'Expected one Medical Center maintenance fallback, found {text.count(old_maintenance)}'
          text = text.replace(old_maintenance, new_maintenance, 1)

          old_zero = "  medical_center: {\n    unlock: 'Basic medical support only; advanced medical staff capacity remains limited.',\n    effect: 'Injury prevention, recovery and fatigue support use the Level 0 medical cap.',\n  },"
          new_zero = "  medical_center: {\n    unlock: 'Base medical facility; one Team Doctor and one Physio slot are available once staff operations are unlocked.',\n    effect: 'No Medical Center prevention, recovery-duration or rehabilitation fatigue-floor bonus is active.',\n  },"
          assert text.count(old_zero) == 1, f'Expected one Medical Center Level 0 block, found {text.count(old_zero)}'
          text = text.replace(old_zero, new_zero, 1)

          assert text != original, 'No Medical Center UI changes produced'
          path.write_text(text, encoding='utf-8')
          print('Medical Center UI fallback and Level 0 copy updated.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Medical Center UI and remove one-off workflow
        run: |
          rm -f .github/workflows/chatgpt-medical-center-ui-20260902.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/dashboard/infrastructure/FacilitiesSection.tsx .github/workflows/chatgpt-medical-center-ui-20260902.yml
          git commit -m 'Update Medical Center infrastructure display'
          git pull --rebase origin main
          git push origin main
