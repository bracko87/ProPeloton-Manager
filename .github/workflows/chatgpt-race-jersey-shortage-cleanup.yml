name: Race jersey shortage cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-race-jersey-shortage-cleanup.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Audit stale jersey-shortage participation rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          include_roots = [root/'src', root/'public', root/'supabase']
          suffixes = {'.ts','.tsx','.js','.jsx','.json','.sql','.md','.txt'}
          jersey = re.compile(r'(jersey|jerseys|race_jersey|mandatory_race_jersey_shortage)', re.I)
          stale = re.compile(r'(mandatory|block|removed|removal|disqual|eligib|no[- ]?show|missed[- ]?start|cannot\s+(?:start|participate|race|save)|will\s+not\s+(?:start|participate|race)|prevent.{0,30}(?:start|participat|race|save)|required)', re.I)
          rows=[]
          for base in include_roots:
              if not base.exists():
                  continue
              for path in sorted(base.rglob('*')):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  try:
                      lines=path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for idx,line in enumerate(lines,1):
                      if jersey.search(line) and stale.search(line):
                          rows.append(f'{path}:{idx}: {line.strip()}')
          report = '# Stale race jersey shortage participation-rule audit\n\n' + '\n'.join(rows) + '\n'
          Path('.github/race_jersey_shortage_audit.txt').write_text(report, encoding='utf-8')
          print(f'Found {len(rows)} potentially stale source lines.')
          PY

      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/race_jersey_shortage_audit.txt
          if git diff --cached --quiet; then
            echo 'No audit report change.'
            exit 0
          fi
          git commit -m 'Refine race jersey shortage source audit'
          git pull --rebase origin main
          git push origin main
