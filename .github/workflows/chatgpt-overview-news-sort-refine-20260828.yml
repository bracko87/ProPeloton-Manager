name: Overview news localization refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-overview-news-sort-refine-20260828.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply refinement
        run: python .github/scripts/chatgpt_overview_news_sort_refine_20260828.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/Overview.tsx src/i18n/locales/sr-Latn/calendar.json
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Refine Serbian News Board and month localization"
          git push origin main
