name: V3 Batch 27 spatial sensitivity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/finishOrderSensitivityV3.mjs'
      - 'scripts/v3/verify-finish-order-sensitivity-v3.mjs'
      - 'scripts/v3/audit-batch27-lane-epochs-v3.mjs'
      - 'scripts/v3/verify-batch27-cadence-v3.mjs'
      - '.github/workflows/v3-batch27-spatial-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stable ranking and split-statistics tests
        run: node scripts/v3/verify-finish-order-sensitivity-v3.mjs
      - name: Fixed-command lane-change cooldown sensitivity
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch27-cadence-v3.mjs
  epochs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [energy, combined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full-race early middle and late single-lane branch A/B
        env:
          V3_BATCH27_COMBINED: ${{ matrix.mode == 'combined' && '1' || '0' }}
          V3_BATCH27_OUT_DIR: ${{ runner.temp }}/batch27-${{ matrix.mode }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-batch27-lane-epochs-v3.mjs
      - name: Save full race metrics and per-rider finish changes
        uses: actions/upload-artifact@v4
        with:
          name: v3-batch27-${{ matrix.mode }}-epochs
          path: ${{ runner.temp }}/batch27-${{ matrix.mode }}/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Build production application
        if: matrix.mode == 'energy'
        run: npm ci --no-audit --no-fund && npm run build
