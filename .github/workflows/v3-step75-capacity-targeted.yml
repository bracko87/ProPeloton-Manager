name: V3 Step75 168-rider spatial entry capacity redistribution research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2TwoSlotFeasibilityV3.mjs'
      - 'scripts/v3/a2NormalStartPelotonV3.mjs'
      - 'scripts/v3/verify-a2-step75-capacity-distribution-v3.mjs'
      - '.github/workflows/v3-step75-capacity-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-168-rider-bottleneck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step75 168-rider strong bicycle-edge two-slot feasibility and mirrored physical collision audits
        env:
          V3_A2_STEP75_DIR: ${{ runner.temp }}/step75
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step75-capacity-distribution-v3.mjs
      - name: Save actual 168-rider first contact, missing window, parity and W-prime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step75-168-two-slot-capacity
          path: ${{ runner.temp }}/step75/*.json
          retention-days: 30
          if-no-files-found: warn
