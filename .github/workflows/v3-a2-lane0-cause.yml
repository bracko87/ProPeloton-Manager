name: V3 A2 lane 0 no-steering counterfactual
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-lane0-cause-v3.mjs'
      - '.github/workflows/v3-a2-lane0-cause.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lane0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original collision and full-stage technical regression
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-intent-aware-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Compare open-road lane0 counterfactual
        env:
          V3_A2_LANE0_DIR: ${{ runner.temp }}/lane0-cause
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-lane0-cause-v3.mjs
      - name: Archive all rider trajectories and passing outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-lane0-counterfactual
          path: ${{ runner.temp }}/lane0-cause/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Application build regression
        run: npm ci --no-audit --no-fund && npm run build
