name: Full German completion audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-full-german-completion-audit.yml'
      - 'src/i18n/locales/de/**'
      - 'src/pages/**'
      - 'src/components/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit German locale coverage and rendered UI source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          root = Path('.')
          en_dir = root / 'src/i18n/locales/en'
          de_dir = root / 'src/i18n/locales/de'
          report = []
          blockers = []
          warnings = []

          protected = {
              'ProPeloton Manager','Race Plan','Race Plans','Stage Plan','Stage Plans','Startlist',
              'Race Engine','Replay Engine','Race Sharpness','WorldTeam','WorldTour','ProTeam',
              'ProSeries','Continental','Supabase','Stripe','Discord','RPC','KPI','GC','KOM','U23','UCI',
              'Coins','Premium','FTP','VO2','DNF','DNS','OTL','ITT','TTT','AI'
          }
          placeholder = re.compile(r'\{\{[^{}]+\}\}')
          cyrillic = re.compile(r'[\u0400-\u04ff]')
          informal = re.compile(r'\b(?:du|dich|dir|dein|deine|deinen|deinem|deiner|deines)\b', re.I)
          bad_patterns = [
              r'\bJahreszeiten?\b', r'\bSchulungslager\b', r'\bPfadfinder(?:n|s)?\b',
              r'\bRassen?\b', r'\bReiter(?:in(?:nen)?|n|s)?\b', r'\bBühnen?\b',
              r'\bÜbertragungsgebühr\b', r'\bSignierbonus\b', r'\bHauptfach\b',
              r'\bVertragsglück\b', r'\bSaisonbeschäftigte\b', r'\bVermißt\b',
              r'Fahrrad-Vermächtnis', r'Ich unterschreibe', r'L 347 vom',
              r'Ich lege eine Bar', r'kostenlose Vermittlung von Agenten',
              r'Reiten als eins', r'Generika-Kit', r'Speicherkübel', r'Vierteljährlich'
          ]

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def walk_pair(a, b, path):
              if type(a) is not type(b):
                  blockers.append(f'{path}: type mismatch')
                  return
              if isinstance(a, dict):
                  if list(a) != list(b): blockers.append(f'{path}: keys/order mismatch')
                  for k in a:
                      if k in b: walk_pair(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  if len(a) != len(b): blockers.append(f'{path}: list length mismatch')
                  for i, (x, y) in enumerate(zip(a, b)): walk_pair(x, y, f'{path}[{i}]')
              elif isinstance(a, str):
                  if sorted(placeholder.findall(a)) != sorted(placeholder.findall(b)):
                      blockers.append(f'{path}: placeholders changed')
                  if not isinstance(b, str): return
                  if cyrillic.search(b): blockers.append(f'{path}: Cyrillic remains: {b!r}')
                  if informal.search(b): blockers.append(f'{path}: informal German tone: {b!r}')
                  for pat in bad_patterns:
                      if re.search(pat, b, re.I):
                          blockers.append(f'{path}: suspicious/bad German: {b!r}')
                          break
                  src=a.strip(); dst=b.strip()
                  if src == dst and len(src) >= 24 and len(src.split()) >= 4 and not any(t in src for t in protected):
                      warnings.append(f'{path}: unchanged English candidate: {src!r}')

          en_files=sorted(p.name for p in en_dir.glob('*.json'))
          de_files=sorted(p.name for p in de_dir.glob('*.json'))
          report += [f'English locale files: {len(en_files)}', f'German locale files: {len(de_files)}']
          if en_files != de_files: blockers.append('German locale filenames do not mirror English exactly')
          for name in en_files:
              if (de_dir/name).exists(): walk_pair(load(en_dir/name), load(de_dir/name), name)

          # Exact rendered/source forms only. Do not count developer comments as player-visible text.
          focused_checks = {
            'src/components/layout/MainLayout.tsx': [
              '                You will be logged out soon\n',
              '                Your game has been inactive for almost 30 minutes.\n',
              '            Stay logged in\n',
            ],
            'src/components/team/RestartTeamModal.tsx': [
              '                Confirm Team Restart\n',
              '<div className="font-semibold text-gray-900">You will keep</div>',
              '<div className="font-semibold text-gray-900">You will lose/reset</div>',
              "setError('You must type RESTART exactly to confirm this action.')",
            ],
            'src/components/ui/KitDesigner.tsx': [
              '>Kit name</label>', '>Pattern</label>', '>Sponsor text</label>', '>Shirt number</label>',
              '>Live preview</div>', "setMessage('Team kits table not ready yet.",
            ],
            'src/components/ui/JerseyPreview.tsx': ['aria-label="Team jersey preview"'],
            'src/pages/dashboard/DevelopingTeam.tsx': ['title="Unlock Developing Team in Preferences first."'],
          }
          for rel, needles in focused_checks.items():
              path=root/rel
              if not path.exists(): continue
              text=path.read_text(encoding='utf-8', errors='replace')
              for needle in needles:
                  if needle in text:
                      blockers.append(f'{rel}: rendered hardcoded English remains: {needle!r}')

          report.append(f'Locale/UI blockers: {len(blockers)}')
          for item in blockers[:500]: report.append('BLOCKER: '+item)
          report.append(f'Locale warnings: {len(warnings)}')
          for item in warnings[:500]: report.append('WARNING: '+item)
          out=Path('/tmp/german-full-audit.txt')
          out.write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          if blockers:
              raise SystemExit(f'German completion audit found {len(blockers)} blockers.')
          PY

      - name: Upload German audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: german-full-completion-audit
          path: /tmp/german-full-audit.txt
          retention-days: 1
          if-no-files-found: error
