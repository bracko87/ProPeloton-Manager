name: Inspect final German source residual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-inspect-final-german-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python .github/scripts/finalize_german_remaining_20260830.py
          echo '--- Stay logged in occurrences after patch ---'
          grep -n -C 3 'Stay logged in' src/components/layout/MainLayout.tsx || true
