name: V3 Step90 multirow premerge physical trajectory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step90RowTrajectoryV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step90-*.mjs'
      - '.github/workflows/v3-step90-row-trajectory.yml'
  workflow_dispatch:
jobs:
  geometry-and-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step90-row-trajectory-v3.mjs
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step85-throughput-v3.mjs
      - run: node scripts/v3/verify-a2-step78-joint-viability-v3.mjs
  large-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step90-large-full-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step90-original-a64-106-168
          path: /tmp/a90large
          if-no-files-found: warn
  sporting-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step90-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step90-original-a64-passing-replay
          path: /tmp/a90parity
          if-no-files-found: warn
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
