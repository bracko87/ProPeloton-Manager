name: Temporary replay full rider names patch

on:
  push:
    paths:
      - '.github/workflows/_tmp_replay_full_rider_names.yml'

permissions:
  contents: write

jobs:
  patch-replay-full-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make current rider records authoritative for replay names
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/RaceDetailPage.tsx')
          text = path.read_text()

          old_state = """  const [preStageStandingByRiderId, setPreStageStandingByRiderId] = useState<\n    Record<string, ReplayPreStageStanding>\n  >({})\n"""
          new_state = old_state + """  const [replayRiderIdentityById, setReplayRiderIdentityById] = useState<\n    Map<string, RiderNameLookupRow>\n  >(new Map())\n"""
          if old_state not in text:
              raise SystemExit('replay state insertion point not found')
          text = text.replace(old_state, new_state, 1)

          old_input = """  const input = shadowBuild.input\n  const result = shadowBuild.result\n"""
          new_input = """  const input = shadowBuild.input\n  const result = shadowBuild.result\n\n  useEffect(() => {\n    let cancelled = false\n\n    const riderIds = Array.from(\n      new Set(\n        (input?.riders ?? [])\n          .map((rider) => rider.riderId?.trim())\n          .filter((riderId): riderId is string => Boolean(riderId))\n      )\n    )\n\n    if (riderIds.length === 0) {\n      setReplayRiderIdentityById(new Map())\n      return () => {\n        cancelled = true\n      }\n    }\n\n    async function loadReplayRiderIdentities(): Promise<void> {\n      const { data, error } = await supabase\n        .from('riders')\n        .select('id, first_name, last_name, display_name, country_code')\n        .in('id', riderIds)\n\n      if (cancelled) return\n\n      if (error) {\n        console.warn(\n          'Could not load current rider identities for race replay:',\n          error.message\n        )\n        setReplayRiderIdentityById(new Map())\n        return\n      }\n\n      const nextIdentityById = new Map<string, RiderNameLookupRow>()\n\n      for (const row of (data ?? []) as RiderNameLookupRow[]) {\n        if (row.id) nextIdentityById.set(row.id, row)\n      }\n\n      setReplayRiderIdentityById(nextIdentityById)\n    }\n\n    void loadReplayRiderIdentities()\n\n    return () => {\n      cancelled = true\n    }\n  }, [input])\n"""
          if old_input not in text:
              raise SystemExit('replay input insertion point not found')
          text = text.replace(old_input, new_input, 1)

          old_tt = """          .map((rider) => {\n            const participant = participantRiderLookup.get(rider.riderId)?.rider\n            const explicitStartOrder =\n"""
          new_tt = """          .map((rider) => {\n            const participant = participantRiderLookup.get(rider.riderId)?.rider\n            const currentIdentity =\n              replayRiderIdentityById.get(rider.riderId) ?? null\n            const explicitStartOrder =\n"""
          if old_tt not in text:
              raise SystemExit('time trial rider identity insertion point not found')
          text = text.replace(old_tt, new_tt, 1)

          old_tt_label = """              label: participant\n                ? getRaceParticipantRiderDisplayName(participant)\n                : rider.snapshot.displayName?.trim() || rider.riderId,\n"""
          new_tt_label = """              label:\n                getFullRiderNameFromLookup(currentIdentity) ??\n                (participant\n                  ? getRaceParticipantRiderDisplayName(participant)\n                  : rider.snapshot.displayName?.trim() || rider.riderId),\n"""
          if old_tt_label not in text:
              raise SystemExit('time trial rider label snippet not found')
          text = text.replace(old_tt_label, new_tt_label, 1)

          old_tt_deps = """    participantRiderLookup,\n    participantTeams,\n    replayProgress,\n"""
          new_tt_deps = """    participantRiderLookup,\n    participantTeams,\n    replayProgress,\n    replayRiderIdentityById,\n"""
          if old_tt_deps not in text:
              raise SystemExit('time trial dependency snippet not found')
          text = text.replace(old_tt_deps, new_tt_deps, 1)

          old_row_identity = """      const participantRider =\n        participantRiderLookup.get(rider.riderId)?.rider ?? null\n      const activeCommand = commandByRiderId.get(rider.riderId)\n"""
          new_row_identity = """      const participantRider =\n        participantRiderLookup.get(rider.riderId)?.rider ?? null\n      const currentIdentity =\n        replayRiderIdentityById.get(rider.riderId) ?? null\n      const activeCommand = commandByRiderId.get(rider.riderId)\n"""
          if old_row_identity not in text:
              raise SystemExit('road replay rider identity insertion point not found')
          text = text.replace(old_row_identity, new_row_identity, 1)

          old_row_name = """        riderName: participantRider\n          ? getRaceParticipantRiderDisplayName(participantRider)\n          : rider.snapshot.displayName ?? rider.riderId,\n        teamName: team?.snapshot.teamName ?? rider.teamId,\n        countryCode: participantRider?.country_code ?? null,\n"""
          new_row_name = """        riderName:\n          getFullRiderNameFromLookup(currentIdentity) ??\n          (participantRider\n            ? getRaceParticipantRiderDisplayName(participantRider)\n            : rider.snapshot.displayName ?? rider.riderId),\n        teamName: team?.snapshot.teamName ?? rider.teamId,\n        countryCode:\n          currentIdentity?.country_code?.trim() ||\n          participantRider?.country_code ||\n          null,\n"""
          if old_row_name not in text:
              raise SystemExit('road replay rider name snippet not found')
          text = text.replace(old_row_name, new_row_name, 1)

          old_row_deps = """    participantRiderLookup,\n    readinessByRiderId,\n    resultsVisible,\n"""
          new_row_deps = """    participantRiderLookup,\n    readinessByRiderId,\n    replayRiderIdentityById,\n    resultsVisible,\n"""
          if old_row_deps not in text:
              raise SystemExit('road replay dependency snippet not found')
          text = text.replace(old_row_deps, new_row_deps, 1)

          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/RaceDetailPage.tsx
          git commit -m "Use full rider names in race replay"
          git push origin HEAD:main
