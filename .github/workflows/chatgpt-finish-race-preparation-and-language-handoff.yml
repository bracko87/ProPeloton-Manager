name: Finish Race Preparation localization and language handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-finish-race-preparation-and-language-handoff.yml'
      - 'src/pages/dashboard/RacePreparation.tsx'
      - 'src/pages/dashboard/race-preparation/**'
      - 'src/i18n/locales/*/racePreparation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Race Preparation locale keys and interpolations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const dirs=['en','sr-Latn','hr','de','es','it','fr','ru']
          const flatten=(input,p='',out={})=>{
            for(const [key,val] of Object.entries(input)){
              const name=p?p+'.'+key:key
              if(typeof val==='string')out[name]=val
              else if(val && typeof val==='object' && !Array.isArray(val))flatten(val,name,out)
            }
            return out
          }
          const tokens=value=>[...value.matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1]).sort().join(',')
          const en=flatten(JSON.parse(fs.readFileSync('src/i18n/locales/en/racePreparation.json','utf8')))
          for(const lang of dirs){
            const local=flatten(JSON.parse(fs.readFileSync('src/i18n/locales/'+lang+'/racePreparation.json','utf8')))
            for(const [key,v] of Object.entries(en)){
              if(!(key in local))throw new Error(lang+': missing racePreparation.'+key)
              if(tokens(v)!==tokens(local[key]))throw new Error(lang+': interpolation mismatch '+key)
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
