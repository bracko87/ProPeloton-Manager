name: Localization audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-race-detail-localization-v2.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit localization resources and direct UI text
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def flatten(value, prefix=''):
              out = set()
              if isinstance(value, dict):
                  for key, child in value.items():
                      next_prefix = f'{prefix}.{key}' if prefix else key
                      out |= flatten(child, next_prefix)
              else:
                  out.add(prefix)
              return out

          en_path = Path('src/i18n/locales/en/raceDetail.json')
          sr_path = Path('src/i18n/locales/sr-Latn/raceDetail.json')
          en = json.loads(en_path.read_text(encoding='utf-8'))
          sr = json.loads(sr_path.read_text(encoding='utf-8'))
          en_keys = flatten(en)
          sr_keys = flatten(sr)
          missing_sr = sorted(en_keys - sr_keys)
          extra_sr = sorted(sr_keys - en_keys)

          print('=== RACE DETAIL RESOURCE PARITY ===')
          print(f'EN leaf keys: {len(en_keys)}')
          print(f'SR leaf keys: {len(sr_keys)}')
          print(f'Missing in SR: {len(missing_sr)}')
          for key in missing_sr:
              print(f'  MISSING_SR {key}')
          print(f'Extra in SR: {len(extra_sr)}')
          for key in extra_sr:
              print(f'  EXTRA_SR {key}')

          known_old_race_detail = [
              'Loading rewards…',
              'No reward data available.',
              'Select which race reward table to view.',
              'Compact race commentary and final road groups.',
              'Loading race report…',
              'No race report available for this stage yet.',
              'No road group data available yet.',
              'Calculated from rider skills, this season results, race profile and assigned role.',
              'Loading accepted teams and riders...',
              'No accepted teams have been confirmed yet.',
              'Loading your application estimate…',
              'Waiting for team selection',
              'Current tour standings',
              'Prize money and international points',
              'Live race',
              'Replay unavailable',
              'Checking replay…',
              'Loading application preview…',
              'Review your application preview before submitting.',
              'Race profile tutorial',
              'Skip tutorial',
          ]

          pages = [
              Path('src/features/squad/components/ExternalRiderProfilePage.tsx'),
              Path('src/features/squad/components/RiderProfilePage.tsx'),
              Path('src/pages/dashboard/RaceDetailPage.tsx'),
          ]

          direct_text_re = re.compile(r'>\s*([A-Za-z][^<{}`]*?[A-Za-z0-9.!?…])\s*<')
          prop_re = re.compile(r'\b(?:title|description|placeholder|label|aria-label)="([A-Za-z][^"]*[A-Za-z0-9.!?…])"')

          print('=== DIRECT UI ENGLISH SCAN ===')
          for page in pages:
              source = page.read_text(encoding='utf-8')
              print(f'PAGE {page}')
              if page.name == 'RaceDetailPage.tsx':
                  old_hits = [phrase for phrase in known_old_race_detail if phrase in source]
                  print(f'  targeted old RaceDetail phrases remaining: {len(old_hits)}')
                  for phrase in old_hits:
                      print(f'    OLD {phrase}')

              candidates = []
              for line_number, line in enumerate(source.splitlines(), 1):
                  if line.lstrip().startswith('//') or line.lstrip().startswith('*'):
                      continue
                  for match in direct_text_re.finditer(line):
                      candidates.append((line_number, match.group(1).strip()))
                  for match in prop_re.finditer(line):
                      candidates.append((line_number, match.group(1).strip()))

              seen = set()
              unique = []
              for item in candidates:
                  if item in seen:
                      continue
                  seen.add(item)
                  unique.append(item)
              print(f'  direct JSX/visible-prop English candidates: {len(unique)}')
              for line_number, value in unique[:120]:
                  print(f'    L{line_number}: {value}')

          if missing_sr:
              raise SystemExit('Serbian raceDetail resource is missing English keys.')
          PY
