name: Polish Croatian gameplay UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/qa_croatian_gameplay_ui_20260830.py'
      - '.github/workflows/chatgpt-polish-croatian-gameplay-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Croatian gameplay polish
        run: python .github/scripts/polish_croatian_gameplay_ui_20260830.py
      - name: Validate Croatian gameplay localization
        run: python .github/scripts/qa_croatian_gameplay_ui_20260830.py
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit Croatian gameplay polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/locales/hr/racePreparation.json src/i18n/locales/hr/raceDetail.json src/i18n/locales/hr/training.json src/i18n/locales/hr/equipment.json src/i18n/locales/hr/infrastructure.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish Croatian gameplay localization'
          git pull --rebase origin main
          git push origin main
