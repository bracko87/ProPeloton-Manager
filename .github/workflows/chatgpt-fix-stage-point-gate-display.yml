name: Fix selected stage point gate display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-stage-point-gate-display.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix-stage-point-gate-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply selected-gate atomic award UI fix
        run: python .github/scripts/chatgpt_fix_stage_point_gate_display_20260909.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify selected gate only behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/pages/dashboard/RaceDetailPage.tsx').read_text(encoding='utf-8')
          start = text.index('function SimpleReplayStagePointsPanel({')
          end = text.index('\ntype UniversalShadowMode', start)
          panel = text[start:end]
          assert 'pointAwardPending' in panel
          assert 'expectedAwardRanks' in panel
          assert 'selectedAwardRows' in panel
          assert 'currentStageTotals' not in panel
          assert 'cumulativeRows' not in panel
          assert 'Awards will be published together once the full scoring set is known.' in panel
          print('Selected stage-point gate UI verification passed.')
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/chatgpt_fix_stage_point_gate_display_20260909.py
          git rm .github/workflows/chatgpt-fix-stage-point-gate-display.yml
          git add src/pages/dashboard/RaceDetailPage.tsx
          git commit -m 'Fix selected stage point awards and atomic publishing UI'
          git pull --rebase origin main
          git push origin main
