name: Add German localization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/localize_full_de_20260828.py
      - .github/scripts/wire_de_locale_20260828.py
      - .github/workflows/chatgpt-add-german-localization.yml

permissions:
  contents: write

jobs:
  localize-german:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install German translator
        run: |
          python -m pip install --quiet sentencepiece sacremoses protobuf 'transformers==4.53.0'
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Translate every English locale into German
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python .github/scripts/localize_full_de_20260828.py

      - name: Wire German into i18next selector and locale formatting
        run: python .github/scripts/wire_de_locale_20260828.py

      - name: Verify German resource coverage and wiring
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          en_dir = Path('src/i18n/locales/en')
          de_dir = Path('src/i18n/locales/de')
          en_files = sorted(p.name for p in en_dir.glob('*.json'))
          de_files = sorted(p.name for p in de_dir.glob('*.json'))
          assert en_files == de_files, (en_files, de_files)

          def shape(a, b, path='root'):
              assert type(a) is type(b), f'{path}: type mismatch'
              if isinstance(a, dict):
                  assert list(a) == list(b), f'{path}: keys/order mismatch'
                  for key in a:
                      shape(a[key], b[key], f'{path}.{key}')
              elif isinstance(a, list):
                  assert len(a) == len(b), f'{path}: list length mismatch'
                  for idx, (left, right) in enumerate(zip(a, b)):
                      shape(left, right, f'{path}[{idx}]')
              elif isinstance(a, str):
                  av = sorted(re.findall(r'\{\{[^{}]+\}\}', a))
                  bv = sorted(re.findall(r'\{\{[^{}]+\}\}', b))
                  assert av == bv, f'{path}: placeholders changed'

          for filename in en_files:
              en = json.loads((en_dir / filename).read_text(encoding='utf-8'))
              de = json.loads((de_dir / filename).read_text(encoding='utf-8'))
              shape(en, de, filename)

          index = Path('src/i18n/index.ts').read_text(encoding='utf-8')
          languages = Path('src/i18n/languages.ts').read_text(encoding='utf-8')
          selector = Path('src/components/i18n/LanguageSelector.tsx').read_text(encoding='utf-8')
          dates = Path('src/components/i18n/LocaleDateFormattingBridge.tsx').read_text(encoding='utf-8')

          assert "supportedLngs: ['en', 'sr-Latn', 'de']" in index
          assert 'fallbackLng: DEFAULT_LANGUAGE' in index
          assert "code: 'de'" in languages and "locale: 'de-DE'" in languages
          assert "de: 'de'" in selector
          assert "return 'de-DE'" in dates
          print(f'Coverage OK: {len(en_files)} English files == {len(de_files)} German files')
          PY

      - name: Inspect language preference storage constraints
        run: |
          grep -Rni --exclude-dir=node_modules "preferred_language" supabase src 2>/dev/null || true

      - name: Install app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit German localization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/i18n/locales/de \
            src/i18n/index.ts \
            src/i18n/languages.ts \
            src/components/i18n/LanguageSelector.tsx \
            src/components/i18n/LocaleDateFormattingBridge.tsx
          if git diff --cached --quiet; then
            echo 'No German localization changes to commit.'
            exit 0
          fi
          git commit -m 'Add German localization as third game language'
          git push origin main
