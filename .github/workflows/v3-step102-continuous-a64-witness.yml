name: V3 Step102 original A64 continuous multirow physical witness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step102ContinuousA64WitnessV3.mjs'
      - 'scripts/v3/verify-a2-step102-*.mjs'
      - '.github/workflows/v3-step102-continuous-a64-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-micro-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real A64 synchronized 8/32 rider path and exact 4+4 replay
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step102-continuous-a64-v3.mjs
      - name: Independently verify forced taper steering without reserved neighbor gap
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step102-forced-taper-v3.mjs
  original-106-168-physical-first-30s:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Three joint plans, actual A64 106/168 x staged/double up to 30 seconds
        env:
          V3_A2_STEP102_DIR: ${{ runner.temp }}/step102
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step102-large-witness-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step102-a64-real-physical-106-168-first30
          path: ${{ runner.temp }}/step102/*.json
          if-no-files-found: error
  protect-step86-and-group-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step101 exact eight-second dynamic grouping remains green
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - name: Step86 32 rider 180-second original physical baseline
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  production-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
