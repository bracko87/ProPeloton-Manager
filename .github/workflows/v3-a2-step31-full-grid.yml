name: V3 A2 Step31 observed safe-lane escape full grid
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2ObservedEscapeV3.mjs'
      - 'scripts/v3/audit-a2-step31-full-grid-v3.mjs'
      - 'scripts/v3/verify-a2-observed-escape-v3.mjs'
      - '.github/workflows/v3-a2-step31-full-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronous swept-path physical and intent regressions
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-observed-escape-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-claim-continuity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-active-claim-switch-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Audit every matched fixture with 3 noncoercive policies
        env:
          V3_A2_STEP31_GRID_SIZE: ${{ matrix.riders }}
          V3_A2_STEP31_GRID_DIR: ${{ runner.temp }}/step31-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step31-full-grid-v3.mjs
      - name: Retain all per-fixture safety, sporting and comparison records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-step31-full-grid-${{ matrix.riders }}
          path: ${{ runner.temp }}/step31-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
