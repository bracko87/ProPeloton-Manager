name: V4 isolated read-only physical solver proof
on:
  push:
    branches: [main]
    paths:
      - 'src/race-engine-v4/**'
      - 'scripts/v4/**'
      - 'docs/race-engine-v4/**'
      - '.github/workflows/v4-physical-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-v4-and-preserved-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bundle exact preserved V2 physics with isolated V4 wrapper
        run: npx esbuild src/race-engine-v4/physicalResearchProbeV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-physical-probe.mjs
      - name: Execute untouched V2 physics on locked V4 synthetic fields
        run: node /tmp/v4-physical-probe.mjs
      - name: Compile offline historical comparison CLI (no database credentials)
        run: npx esbuild src/race-engine-v4/historicalCompareCliV4.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/ppm-v4-history.mjs
      - name: Validate private historical cohort filters on synthetic aggregates, without source data
        run: node scripts/v4/historicalCohortAggregationV4.test.mjs
      - name: Compile private offline cohort CLI (no production database credentials)
        run: npx esbuild scripts/v4/privateHistoricalCohortCliV4.mjs --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/ppm-v4-private-cohort.mjs
      - name: Test private historical export with synthetic data only, no Supabase access
        run: node scripts/v4/privateHistoricalExportV4.test.mjs
      - name: Exercise private calibrated V4 history runner with a synthetic locked race only
        run: node scripts/v4/privateHistoricalPhysicsV4.test.mjs
      - name: Test automated PRIVATE historical pilot metadata selection and cleanup using mocks only
        run: node scripts/v4/privateHistoricalPilotV4.test.mjs
      - name: Trace five synthetic physical group-transition failures with original validator still strict
        run: node scripts/v4/traceReplayTransitionsV4.mjs
      - name: Validate V4 physical bridge-target normalization (research module only)
        run: |
          npx esbuild src/race-engine-v4/bridgeHandoffV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-bridge-target-unit.mjs
          node /tmp/v4-bridge-target-unit.mjs
      - name: Compare isolated V4 stale B1 to active front-group handoff candidate under strict replay checks
        run: node scripts/v4/probeBridgeAliasV4.mjs
      - name: Measure Phase-3 peloton response and breakaway cooperation independently in V4-only bundles
        run: node scripts/v4/phase3SensitivityV4.mjs
      - name: Build corrected ordinary V4 physical probe as a research-only executable
        run: |
          node scripts/v4/probeBridgeAliasV4.mjs --build-probe /tmp/v4-corrected-ordinary-probe.mjs
          node --input-type=module -e "const m = await import('/tmp/v4-corrected-ordinary-probe.mjs'); if (typeof m.probeV4PhysicalRace !== 'function') throw Error('V4 physical research export missing')"
      - name: Check research-only V4 trajectory maxima and chase context
        run: |
          npx esbuild src/race-engine-v4/breakawayGapDiagnosticsV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-gap-audit-unit.mjs
          node /tmp/v4-gap-audit-unit.mjs
      - name: Validate measured V4 chase speeds and rider energy without changing V2
        run: |
          npx esbuild src/race-engine-v4/phase4ChaseTelemetryV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-phase4-chase-telemetry-test.mjs
          node /tmp/v4-phase4-chase-telemetry-test.mjs
      - name: Validate V4-only early gap trajectories and front energy
        run: |
          npx esbuild src/race-engine-v4/earlyGapEvolutionV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-early-gap-evolution-test.mjs
          node /tmp/v4-early-gap-evolution-test.mjs
      - name: Check V4 Phase-3 measured physical speed diagnostics
        run: |
          npx esbuild src/race-engine-v4/phase3SpeedAuditV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-phase3-speed-unit.mjs
          node /tmp/v4-phase3-speed-unit.mjs
      - name: Validate V4 finish-group evidence with true physical catch tests
        run: |
          npx esbuild src/race-engine-v4/finishTransitionV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-finish-transition-unit.mjs
          node /tmp/v4-finish-transition-unit.mjs
      - name: Validate bounded V4 Phase-3 speed-dependent energy research
        run: |
          npx esbuild src/race-engine-v4/phase3PaceEnergyV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-phase3-pace-energy-unit.mjs
          node /tmp/v4-phase3-pace-energy-unit.mjs
      - name: Validate mountain carried bridge versus low-energy physical detachment
        run: |
          npx esbuild src/race-engine-v4/mountainBridgeCarryV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-mountain-carried-bridge-test.mjs
          node /tmp/v4-mountain-carried-bridge-test.mjs
      - name: Validate catch evidence against actual low-energy C detachment
        run: |
          npx esbuild src/race-engine-v4/mountainBridgeCatchV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-mountain-bridge-catch.mjs
          node /tmp/v4-mountain-bridge-catch.mjs
      - name: Preserve template-first unit tests
        run: |
          npx esbuild src/race-engine-v4/templateFirstPlannerV4.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/v4-template-first-tests.mjs
          node /tmp/v4-template-first-tests.mjs
  existing-react-build-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
