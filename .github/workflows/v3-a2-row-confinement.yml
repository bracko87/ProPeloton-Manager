name: V3 Milestone A2 start-row confinement diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-row-confinement-v3.mjs'
      - '.github/workflows/v3-a2-row-confinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confinement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        fixture: [dordrecht-2000-10-15, guangxi-2000-10-19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate race physics and stage finish isolation
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Run full-stage row confinement analysis
        env:
          V3_A2_CONFINEMENT_FIXTURE: ${{ matrix.fixture }}
          V3_A2_CONFINEMENT_DIR: ${{ runner.temp }}/a2-row-${{ matrix.fixture }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-row-confinement-v3.mjs
      - name: Archive each rider's mobility observations
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-row-confinement-${{ matrix.fixture }}
          path: ${{ runner.temp }}/a2-row-${{ matrix.fixture }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Production application build
        if: matrix.fixture == 'dordrecht-2000-10-15'
        run: npm ci --no-audit --no-fund && npm run build
