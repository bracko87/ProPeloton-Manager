name: V3 A2 intent-aware slots adversarial comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/audit-a2-adversarial-intent-v3.mjs'
      - '.github/workflows/v3-a2-adversarial-intent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        riders: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety and unchanged race-engine regression checks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-intent-aware-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-conditional-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-timed-corridor-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-simultaneous-micro-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-persistent-passes-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Evaluate 5 policies with delayed, immediate and reversing opponents
        env:
          V3_A2_INTENT_SIZE: ${{ matrix.riders }}
          V3_A2_INTENT_DIR: ${{ runner.temp }}/intent-${{ matrix.riders }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-adversarial-intent-v3.mjs
      - name: Archive per-event ordering and rider progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-a2-adversarial-intent-${{ matrix.riders }}
          path: ${{ runner.temp }}/intent-${{ matrix.riders }}/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify production application build
        if: matrix.riders == 2
        run: npm ci --no-audit --no-fund && npm run build
