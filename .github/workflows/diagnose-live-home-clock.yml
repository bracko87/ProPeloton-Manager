name: Diagnose live homepage clock in browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-home-clock.yml']

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser diagnostic dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Observe game time and public clock requests on production homepage
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } })
            const findings = { consoleErrors: [], pageErrors: [], failedRequests: [], rpc: [] }
            page.on('console', msg => {
              if (msg.type() === 'error') findings.consoleErrors.push(msg.text().slice(0, 350))
            })
            page.on('pageerror', e => findings.pageErrors.push(String(e).slice(0, 600)))
            page.on('requestfailed', req => {
              findings.failedRequests.push({ pathname: new URL(req.url()).pathname,
                error: req.failure()?.errorText })
            })
            page.on('response', async res => {
              const url = res.url()
              if (/\/rpc\/(get_authoritative_game_time|get_current_game_clock_v1|get_public_home_clock_anchor_v1|get_public_homepage_snapshot_v1)/.test(url)) {
                const entry = { rpc: new URL(url).pathname.split('/').pop(), status: res.status() }
                try {
                  const raw = await res.json()
                  const data = Array.isArray(raw) ? raw[0] : raw
                  entry.keys = data && typeof data === 'object' ? Object.keys(data).slice(0, 12) : []
                  entry.anchorPresent = !!data?.game_epoch_ms
                  entry.speed = data?.speed_multiplier ?? null
                  entry.homeLabel = data?.game_time_label ?? null
                } catch (e) { entry.jsonError = String(e).slice(0, 120) }
                findings.rpc.push(entry)
              }
            })
            const reply = await page.goto('https://propelotonmanager.com/?browser_clock_diagnostic=1',
              { waitUntil: 'domcontentloaded', timeout: 45000 })
            findings.pageStatus = reply?.status()
            await page.waitForTimeout(4000)
            findings.t4 = await page.locator('[data-clock-source]').evaluateAll(els => els.map(e => ({
              source: e.getAttribute('data-clock-source'), text: e.textContent?.trim() })))
            await page.waitForTimeout(12500)
            findings.t16 = await page.locator('[data-clock-source]').evaluateAll(els => els.map(e => ({
              source: e.getAttribute('data-clock-source'), text: e.textContent?.trim() })))
            findings.documentTitle = await page.title()
            findings.containsLoading = (await page.locator('body').innerText()).includes('Loading game time...')
            console.log('PUBLIC CLOCK DIAGNOSTIC:', JSON.stringify(findings, null, 2))
            await browser.close()
          })().catch(e => { console.error('BROWSER DIAGNOSTIC FAILED:', String(e)); process.exitCode = 1 })
          NODE
