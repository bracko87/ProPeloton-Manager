name: V3 Step89 long-range premerge physical reservation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step89PremergeReservationV3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - 'scripts/v3/verify-a2-step89-*.mjs'
      - '.github/workflows/v3-step89-premerge.yml'
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step89-premerge-v3.mjs
      - run: node scripts/v3/verify-a2-step87-corridor-physical-v3.mjs
      - run: node scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  large-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step89-large-full-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a89-large-original-body
          path: /tmp/a89large
          if-no-files-found: warn
  parity-and-sporting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v3/verify-a2-step89-physical-parity-replay-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a89-sporting-parity
          path: /tmp/a89parity
          if-no-files-found: warn
  react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
