name: V3 Step79 distributed 2D five-abreast admission research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step79DistributedAdmissionV3.mjs'
      - 'scripts/v3/a2Step79PhysicalChoiceV3.mjs'
      - 'scripts/v3/verify-a2-step79-distributed-v3.mjs'
      - 'scripts/v3/a2MultiGatePhysicalCandidateV3.mjs'
      - '.github/workflows/v3-step79-distributed-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distributed-full-body-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Step79 8/32/106/168 distributed graph and original swept physical solver
        env:
          V3_A2_STEP79_DIR: ${{ runner.temp }}/a79
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step79-distributed-v3.mjs
      - name: A78 local physical 24-case audit
        env:
          V3_A2_STEP78_PHASE2_DIR: ${{ runner.temp }}/a78phase2
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-negotiation-v3.mjs
      - name: A78 32r full 180s physical passing and 16 mirror identity checks
        env:
          V3_A2_STEP78_LOCAL_REPLAY_DIR: ${{ runner.temp }}/a78local
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step78-phase2-local-replay-v3.mjs
      - name: A77 physical 32r 180s 87 overtakes and exact replay
        env:
          V3_A2_STEP77_STAGED_DIR: ${{ runner.temp }}/a77
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step77-phase2-staged-success-v3.mjs
      - name: A76 protected 32/106/168 180s 58 151 198 3-second overtakes
        env:
          V3_A2_STEP76_PASS_DIR: ${{ runner.temp }}/a76
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step76-double-passing-v3.mjs
      - name: Upload full physical outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a79-distributed-real-contact-evidence
          path: |
            ${{ runner.temp }}/a79/*.json
            ${{ runner.temp }}/a78phase2/*.json
            ${{ runner.temp }}/a78local/*.json
            ${{ runner.temp }}/a77/*.json
            ${{ runner.temp }}/a76/*.json
          if-no-files-found: warn
          retention-days: 30
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
