name: V3 Step108 original A64 joint moving-speed and lane reservation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2Step108JointMovingA64V3.mjs'
      - 'scripts/v3/verify-a2-step108-*.mjs'
      - '.github/workflows/v3-step108-joint-moving-floor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-a64-short-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual A64 original 8/32, mirror, floor guard, original 8s groups, checkpoint
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step108-micro-v3.mjs
  original-a64-106-168-real:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full 180s attempts 106/168 five-wide two layouts both mirror branches
        env:
          V3_A2_STEP108_DIR: ${{ runner.temp }}/step108
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step108-large-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step108-a64-joint-moving-lane-audit
          path: ${{ runner.temp }}/step108/*.json
          if-no-files-found: error
  locked-full-field-a64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Forty-eight fully allocated locked-policy 180-second A64 attempts
        env:
          V3_A2_STEP108_DIR: ${{ runner.temp }}/step108
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step108-locked-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step108b-locked-policy-A64-physical
          path: ${{ runner.temp }}/step108/*.json
          if-no-files-found: error
  protect-original-and-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact eight-second grouping and breakaway/rejoin
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step101-eight-second-groups-v3.mjs
      - name: Protected original A64 Step86 32-rider 180-second benchmark
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step86-gap-physical-v3.mjs
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
