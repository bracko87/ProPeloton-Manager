name: V3 A2 Step41 canonical mirror geometry research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3/a2CanonicalMirrorResearchV3.mjs'
      - 'scripts/v3/verify-a2-step41-canonical-mirror-v3.mjs'
      - '.github/workflows/v3-a2-step41-canonical-mirror.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-metamorphic-and-sporting:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A41 120 canonical+120 original matched baseline, 120 mirrors, 96 renames
        env:
          V3_A2_STEP41_DIR: ${{ runner.temp }}/step41
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step41-canonical-mirror-v3.mjs
      - name: Upload every canonical-mirror and numerical comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-step41-canonical-mirror
          path: ${{ runner.temp }}/step41/*.json
          retention-days: 30
          if-no-files-found: warn
  original-gates-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve untouched A40 through A32 and full stage regression tests
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step40-normalized-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-step39-fairness-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step38-merge-trace-v3.mjs
          V3_A2_STEP37_FAMILY=following node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step37-event-yield-v3.mjs
          V3_A2_STEP37_FAMILY=hold node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step37-event-yield-v3.mjs
          V3_A2_STEP37_FAMILY=merge node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step37-event-yield-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step36-causal-isolation-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/audit-a2-step35-substep-sensitivity-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-substep-physical-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-nonlinear-sweep-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-a2-bounded-slot-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch42-2d-v3.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/v3/verify-batch43-complete-stage-v3.mjs
      - name: Verify production build
        run: npm ci --no-audit --no-fund && npm run build
