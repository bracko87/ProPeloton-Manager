name: Sponsor and language dropdown update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-sponsor-profile-dropdown-20260828.yml'

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sponsor and language dropdown updates
        run: python .github/scripts/chatgpt_sponsor_profile_dropdown_20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/finance/SponsorsTab.tsx src/pages/MyProfile.tsx src/i18n/languages.ts src/i18n/locales/en/finance.json src/i18n/locales/sr-Latn/finance.json src/i18n/locales/en/accountPages.json src/i18n/locales/sr-Latn/accountPages.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Localize sponsor offers and refine language selector"
            git push origin HEAD:main
          fi
